am apl untuk topi, cermin mata dan tema trek. Anda memperolehnya dengan berlumba, daftar masuk dan menonton iklan pilihan. Remah tidak pernah mengubah keputusan perlumbaan dan tidak boleh dibeli dengan wang."]], "privacy_title": "Dasar privasi", "privacy": [["Gambaran keseluruhan", "Quack Derby dibina untuk berfungsi di luar talian. Senarai, roda, sejarah perlumbaan dan tetapan anda hanya disimpan pada peranti anda. Kami tidak menjalankan pelayan yang menerima data anda, dan anda tidak memerlukan akaun."], ["Data yang anda masukkan", "Nama, nota, foto avatar dan roda kekal pada peranti anda. Pengecaman teks bagi senarai yang difoto berlaku pada peranti; imej tidak dimuat naik. Kod perlumbaan yang anda pilih untuk dikongsi mengandungi nama dalam perlumbaan itu, jadi kongsikan hanya dengan orang yang anda percayai."], ["Kamera dan foto", "Kamera hanya digunakan apabila anda mengetik “Foto senarai” atau “Imbas kod”. Akses pustaka foto hanya digunakan apabila anda memilih imej atau menyimpan keputusan. Anda boleh menukar kebenaran ini dalam tetapan peranti pada bila-bila masa."], ["Pengiklanan", "Versi percuma memaparkan iklan daripada Google AdMob. AdMob mungkin mengumpul pengecam peranti, data pengiklanan, data penggunaan dan diagnostik untuk memaparkan dan mengukur iklan. Pada iPhone kami meminta kebenaran sebelum sebarang penjejakan (App Tracking Transparency); di EEA/UK, borang persetujuan daripada User Messaging Platform Google dipaparkan terlebih dahulu. Anda boleh menukar pilihan anda pada bila-bila masa di Saya › Pilihan privasi. Premium membuang iklan sepanduk, iklan selitan dan iklan pembukaan apl."], ["Pembelian", "Pembelian dikendalikan oleh Apple atau Google. Kami tidak pernah melihat butiran pembayaran anda; kami hanya mengetahui sama ada Premium dimiliki supaya kami boleh membukanya."], ["Kanak-kanak", "Quack Derby ialah apl untuk khalayak umum dan tidak ditujukan kepada kanak-kanak di bawah 13 tahun. Kami tidak dengan sengaja mengumpul maklumat peribadi daripada kanak-kanak."], ["Memadam data anda", "Gunakan Saya › Data › Tetapkan semula semuanya, atau padam apl, untuk membuang semua data yang disimpan oleh Quack Derby."], ["Perubahan dan hubungan", "Jika dasar ini berubah, kami akan mengemas kini tarikh di atas. Soalan: haily.211194@gmail.com · 0334044737."]], "terms_title": "Terma penggunaan", "terms": [["Menggunakan apl", "Quack Derby ialah alat untuk memilih nama, membentuk pasukan dan berseronok. Keputusan adalah rawak; sila gunakannya secara bertanggungjawab dan jangan sekali-kali untuk perjudian atau keputusan yang memerlukan pertimbangan profesional."], ["Premium", "Premium ialah pembelian sekali sahaja yang tidak boleh habis guna. Ia membuang iklan dan membuka perlumbaan lebih besar, kejohanan lebih panjang, roda lebih dalam, video 1080p dan semua item almari. Tiada langganan. Bayaran balik dikendalikan oleh Apple atau Google mengikut dasar mereka."], ["Remah", "Remah tidak mempunyai nilai kewangan, tidak boleh ditukar atau dipindahkan dan mungkin diselaraskan jika sistem ekonominya berubah."], ["Kandungan anda", "Anda bertanggungjawab atas nama dan kandungan yang anda tambah dan kongsi. Jangan kongsi maklumat peribadi orang lain tanpa kebenaran."], ["Ketersediaan", "Kami berusaha keras memastikan apl ini boleh dipercayai, tetapi ia disediakan “seadanya” tanpa sebarang waranti. Setakat yang dibenarkan oleh undang-undang, kami tidak bertanggungan atas kerugian tidak langsung yang timbul daripada penggunaannya."], ["Hubungi", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Dibuat dengan penuh kasih, kuek dan dadu yang adil."}, "tr": {"lang_name": "Türkçe", "nav_support": "Yardım", "nav_privacy": "Gizlilik", "nav_terms": "Koşullar", "updated": "Son güncelleme: 2026-11-12", "support_title": "Yardım ve destek", "support_intro": "Quack Derby bir isim listesini yarışa, turnuvaya ya da çark çevirmeye dönüştürür — adil, doğrulanabilir ve çevrimdışı. Yardıma mı ihtiyacın var? Bize yaz, gerçek bir kişi yanıtlasın.", "contact_title": "İletişim", "contact_body": "E-posta: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Geliştirici: Truong Hai Ly", "faq_title": "Sıkça sorulan sorular", "faq": [["Bir yarışın adil olduğundan nasıl emin olabilirim?", "Her yarıştan önce uygulama gizli bir rastgele tohumun kısa bir parmak izini (taahhüt) gösterir. Yarıştan sonra tohum açıklanır. Herkes yarış kodunu “Doğrula”ya yapıştırıp aynı yarışı birebir tekrar oynatabilir — sonuç değiştirilmiş olsaydı parmak izi eşleşmezdi."], ["Ağırlıklar ne işe yarar?", "Ağırlıklar varsayılan olarak kapalıdır, yani herkesin şansı eşittir. Açtığında, 2× ağırlıklı bir yarışçının kazanma olasılığı 1× olan bir yarışçının tam iki katıdır. Ağırlıklı yarışlarda her zaman “Ağırlıklı” rozeti görünür."], ["Sınıf modu nedir?", "Bir sınıf listesinde seçilen kişiler, tüm liste bir kez seçilene kadar kenara çekilir. Liste her kişinin kaç kez seçildiğini gösterir."], ["Listelerimin fotoğrafları telefonumdan çıkıyor mu?", "Hayır. Metin tanıma cihazında çalışır. Fotoğraf yüklenmez ve saklanmaz."], ["Satın alımımı nasıl geri yüklerim?", "Ben sekmesini aç ve “Satın alımları geri yükle”ye dokun ya da VIP bileti ekranındaki düğmeyi kullan. Satın aldığın Apple Kimliği veya Google hesabını kullan."], ["Kırıntılar nedir?", "Kırıntılar şapka, gözlük ve pist temaları için eğlenceli bir uygulama içi para birimidir. Yarışarak, giriş yaparak ve isteğe bağlı reklamlar izleyerek kazanırsın. Yarış sonuçlarını asla değiştirmezler ve parayla satın alınamazlar."]], "privacy_title": "Gizlilik politikası", "privacy": [["Genel bakış", "Quack Derby çevrimdışı çalışmak üzere tasarlanmıştır. Listelerin, çarkların, yarış geçmişin ve ayarların yalnızca cihazında saklanır. Verilerini alan sunucularımız yoktur ve hesaba ihtiyacın yoktur."], ["Girdiğin veriler", "İsimler, notlar, avatar fotoğrafları ve çarklar cihazında kalır. Fotoğrafı çekilen listelerin metin tanıması cihazda yapılır; görseller yüklenmez. Paylaşmayı seçtiğin yarış kodları o yarıştaki isimleri içerir; bu yüzden yalnızca güvendiğin kişilerle paylaş."], ["Kamera ve fotoğraflar", "Kamera yalnızca “Listenin fotoğrafı” ya da “Kodu tara”ya dokunduğunda kullanılır. Fotoğraf arşivi erişimi yalnızca bir görsel seçtiğinde veya bir sonucu kaydettiğinde kullanılır. Bu izinleri istediğin zaman cihaz ayarlarından değiştirebilirsin."], ["Reklamlar", "Ücretsiz sürüm Google AdMob reklamları gösterir. AdMob reklamları göstermek ve ölçmek için cihaz tanımlayıcılarını, reklam verilerini, kullanım ve tanılama verilerini toplayabilir. iPhone'da herhangi bir izlemeden önce izin isteriz (App Tracking Transparency); AEA/Birleşik Krallık'ta önce Google'ın User Messaging Platform onay formu görünür. Tercihini istediğin zaman Ben › Gizlilik tercihleri bölümünden değiştirebilirsin. Premium banner, geçiş ve uygulama açılış reklamlarını kaldırır."], ["Satın alımlar", "Satın alımlar Apple veya Google tarafından işlenir. Ödeme bilgilerini asla görmeyiz; yalnızca kilidini açabilmek için Premium'a sahip olup olmadığını öğreniriz."], ["Çocuklar", "Quack Derby genel kitleye yönelik bir uygulamadır ve 13 yaş altı çocuklara yönelik değildir. Çocuklardan bilerek kişisel bilgi toplamayız."], ["Verilerini silme", "Quack Derby tarafından saklanan tüm verileri kaldırmak için Ben › Veriler › Her şeyi sıfırla'yı kullan ya da uygulamayı sil."], ["Değişiklikler ve iletişim", "Bu politika değişirse yukarıdaki tarihi güncelleriz. Sorular: haily.211194@gmail.com · 0334044737."]], "terms_title": "Kullanım koşulları", "terms": [["Uygulamayı kullanma", "Quack Derby isim seçmek, takım kurmak ve eğlenmek için bir araçtır. Sonuçlar rastgeledir; lütfen sorumlu bir şekilde kullan, asla kumar için ya da profesyonel değerlendirme gerektiren kararlar için kullanma."], ["Premium", "Premium tek seferlik, tüketilmeyen bir satın alımdır. Reklamları kaldırır; daha büyük yarışların, daha uzun turnuvaların, daha derin çarkların, 1080p videonun ve tüm gardırop eşyalarının kilidini açar. Abonelik yoktur. İadeler Apple veya Google tarafından kendi politikalarına göre yapılır."], ["Kırıntılar", "Kırıntıların parasal değeri yoktur, takas edilemez veya aktarılamaz ve ekonomi değişirse ayarlanabilir."], ["İçeriğin", "Eklediğin ve paylaştığın isimlerden ve içerikten sen sorumlusun. Başkalarının kişisel bilgilerini izinsiz paylaşma."], ["Hizmetin sürekliliği", "Uygulamayı güvenilir tutmak için çok çalışıyoruz, ancak uygulama garanti verilmeksizin “olduğu gibi” sunulur. Yasanın izin verdiği ölçüde, kullanımından doğan dolaylı kayıplardan sorumlu değiliz."], ["İletişim", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Özenle, vaklamalarla ve adil zarlarla yapıldı."}, "nl": {"lang_name": "Nederlands", "nav_support": "Hulp", "nav_privacy": "Privacy", "nav_terms": "Voorwaarden", "updated": "Laatst bijgewerkt: 2026-11-12", "support_title": "Hulp & ondersteuning", "support_intro": "Quack Derby maakt van een namenlijst een race, een toernooi of een draai aan het rad — eerlijk, controleerbaar en offline. Hulp nodig? Schrijf ons en een echt mens geeft antwoord.", "contact_title": "Contact", "contact_body": "E-mail: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefoon: 0334044737<br>Ontwikkelaar: Truong Hai Ly", "faq_title": "Veelgestelde vragen", "faq": [["Hoe weet ik zeker dat een race eerlijk is?", "Vóór elke race toont de app een korte vingerafdruk (commitment) van een geheime willekeurige seed. Na de race wordt de seed onthuld. Iedereen kan de racecode in “Controleren” plakken en precies dezelfde race afspelen — als de uitslag was veranderd, zou de vingerafdruk niet kloppen."], ["Wat doen gewichten?", "Gewichten staan standaard uit, dus iedereen heeft dezelfde kans. Als je ze aanzet, heeft een deelnemer met gewicht 2× precies twee keer zoveel kans om te winnen als een deelnemer met 1×. Races met gewichten tonen altijd een badge “Met gewichten”."], ["Wat is de klassenmodus?", "In een klassenlijst gaan mensen die gekozen zijn even aan de kant tot de hele lijst één keer is gekozen. De lijst toont hoe vaak elke persoon is gekozen."], ["Verlaten foto's van mijn lijsten mijn telefoon?", "Nee. Tekstherkenning draait op je apparaat. De foto wordt niet geüpload of bewaard."], ["Hoe herstel ik mijn aankoop?", "Open het tabblad Ik en tik op “Aankopen herstellen”, of gebruik de knop op het scherm van het VIP-ticket. Gebruik dezelfde Apple ID of hetzelfde Google-account waarmee je hebt gekocht."], ["Wat zijn kruimels?", "Kruimels zijn een leuke munteenheid in de app voor hoeden, brillen en baanthema's. Je verdient ze door te racen, in te checken en optionele advertenties te bekijken. Ze veranderen nooit raceresultaten en kunnen niet met geld worden gekocht."]], "privacy_title": "Privacybeleid", "privacy": [["Overzicht", "Quack Derby is gemaakt om offline te werken. Je lijsten, raderen, racegeschiedenis en instellingen worden alleen op je apparaat opgeslagen. We hebben geen servers die je gegevens ontvangen en je hebt geen account nodig."], ["Gegevens die je invoert", "Namen, notities, avatarfoto's en raderen blijven op je apparaat. Tekstherkenning voor gefotografeerde lijsten gebeurt op het apparaat; afbeeldingen worden niet geüpload. Racecodes die je deelt bevatten de namen uit die race, dus deel ze alleen met mensen die je vertrouwt."], ["Camera en foto's", "De camera wordt alleen gebruikt als je op “Foto van een lijst” of “Code scannen” tikt. Toegang tot de fotobibliotheek wordt alleen gebruikt als je een afbeelding kiest of een uitslag opslaat. Je kunt deze toestemmingen altijd wijzigen in de instellingen van je apparaat."], ["Advertenties", "De gratis versie toont advertenties van Google AdMob. AdMob kan apparaat-ID's, advertentiegegevens, gebruiks- en diagnostische gegevens verzamelen om advertenties te tonen en te meten. Op de iPhone vragen we toestemming vóór elke vorm van tracking (App Tracking Transparency); in de EER/het VK verschijnt eerst een toestemmingsformulier van Google's User Messaging Platform. Je kunt je keuze altijd wijzigen onder Ik › Privacykeuzes. Premium verwijdert banner-, interstitial- en app-openingsadvertenties."], ["Aankopen", "Aankopen worden afgehandeld door Apple of Google. We zien nooit je betaalgegevens; we horen alleen of je Premium bezit, zodat we het kunnen ontgrendelen."], ["Kinderen", "Quack Derby is een app voor een algemeen publiek en is niet gericht op kinderen jonger dan 13. We verzamelen niet bewust persoonsgegevens van kinderen."], ["Je gegevens verwijderen", "Gebruik Ik › Gegevens › Alles resetten, of verwijder de app, om alle gegevens te wissen die Quack Derby heeft opgeslagen."], ["Wijzigingen en contact", "Als dit beleid verandert, passen we de datum hierboven aan. Vragen: haily.211194@gmail.com · 0334044737."]], "terms_title": "Gebruiksvoorwaarden", "terms": [["De app gebruiken", "Quack Derby is een hulpmiddel om namen te kiezen, teams te maken en plezier te hebben. Uitslagen zijn willekeurig; gebruik ze verantwoord en nooit voor gokken of beslissingen die een professioneel oordeel vereisen."], ["Premium", "Premium is een eenmalige, niet-verbruikbare aankoop. Het verwijdert advertenties en ontgrendelt grotere races, langere toernooien, diepere raderen, 1080p-video en alle garderobe-items. Er is geen abonnement. Terugbetalingen worden door Apple of Google afgehandeld volgens hun eigen beleid."], ["Kruimels", "Kruimels hebben geen geldwaarde, kunnen niet worden geruild of overgedragen en kunnen worden aangepast als de economie in de app verandert."], ["Jouw inhoud", "Je bent verantwoordelijk voor de namen en inhoud die je toevoegt en deelt. Deel geen persoonsgegevens van anderen zonder toestemming."], ["Beschikbaarheid", "We doen ons best om de app betrouwbaar te houden, maar hij wordt geleverd “zoals hij is”, zonder garanties. Voor zover de wet dat toestaat, zijn we niet aansprakelijk voor indirecte schade die voortvloeit uit het gebruik ervan."], ["Contact", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Gemaakt met zorg, gekwaak en eerlijke dobbelstenen."}, "pl": {"lang_name": "Polski", "nav_support": "Pomoc", "nav_privacy": "Prywatność", "nav_terms": "Warunki", "updated": "Ostatnia aktualizacja: 2026-11-12", "support_title": "Pomoc i wsparcie", "support_intro": "Quack Derby zamienia listę imion w wyścig, turniej lub zakręcenie kołem — uczciwie, sprawdzalnie i offline. Potrzebujesz pomocy? Napisz do nas, a odpowie prawdziwy człowiek.", "contact_title": "Kontakt", "contact_body": "E-mail: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Deweloper: Truong Hai Ly", "faq_title": "Najczęściej zadawane pytania", "faq": [["Jak mogę mieć pewność, że wyścig jest uczciwy?", "Przed każdym wyścigiem aplikacja pokazuje krótki odcisk (zobowiązanie) tajnego losowego ziarna. Po wyścigu ziarno zostaje ujawnione. Każdy może wkleić kod wyścigu w „Weryfikuj” i odtworzyć dokładnie ten sam wyścig — gdyby wynik został zmieniony, odcisk by się nie zgadzał."], ["Do czego służą wagi?", "Wagi są domyślnie wyłączone, więc każdy ma taką samą szansę. Po ich włączeniu zawodnik z wagą 2× ma dokładnie dwa razy większą szansę na wygraną niż zawodnik z 1×. Wyścigi z wagami zawsze mają plakietkę „Z wagami”."], ["Czym jest tryb klasowy?", "Na liście klasowej osoby, które zostały wybrane, czekają z boku, aż cała lista zostanie wybrana raz. Lista pokazuje, ile razy każda osoba została wybrana."], ["Czy zdjęcia moich list opuszczają telefon?", "Nie. Rozpoznawanie tekstu działa na twoim urządzeniu. Zdjęcie nie jest przesyłane ani przechowywane."], ["Jak przywrócić zakup?", "Otwórz kartę Ja i dotknij „Przywróć zakupy” albo użyj przycisku na ekranie biletu VIP. Użyj tego samego Apple ID lub konta Google, którym dokonano zakupu."], ["Czym są okruszki?", "Okruszki to zabawna waluta w aplikacji na kapelusze, okulary i motywy torów. Zdobywasz je za wyścigi, meldowanie się i oglądanie opcjonalnych reklam. Nigdy nie zmieniają wyników wyścigów i nie można ich kupić za pieniądze."]], "privacy_title": "Polityka prywatności", "privacy": [["Przegląd", "Quack Derby działa offline. Twoje listy, koła, historia wyścigów i ustawienia są przechowywane wyłącznie na twoim urządzeniu. Nie prowadzimy serwerów, które odbierają twoje dane, i nie potrzebujesz konta."], ["Wprowadzane dane", "Imiona, notatki, zdjęcia awatarów i koła zostają na twoim urządzeniu. Rozpoznawanie tekstu na sfotografowanych listach odbywa się na urządzeniu; obrazy nie są przesyłane. Kody wyścigów, które zdecydujesz się udostępnić, zawierają imiona z danego wyścigu, więc udostępniaj je tylko osobom, którym ufasz."], ["Aparat i zdjęcia", "Aparat jest używany tylko wtedy, gdy dotkniesz „Zdjęcie listy” lub „Skanuj kod”. Dostęp do biblioteki zdjęć jest używany tylko, gdy wybierasz obraz lub zapisujesz wynik. W każdej chwili możesz zmienić te uprawnienia w ustawieniach urządzenia."], ["Reklamy", "Wersja darmowa wyświetla reklamy Google AdMob. AdMob może zbierać identyfikatory urządzenia, dane reklamowe, dane o użytkowaniu i diagnostyczne, aby wyświetlać i mierzyć reklamy. Na iPhonie prosimy o zgodę przed jakimkolwiek śledzeniem (App Tracking Transparency); w EOG/Wielkiej Brytanii najpierw pojawia się formularz zgody z platformy User Messaging Platform Google. W każdej chwili możesz zmienić wybór w Ja › Ustawienia prywatności. Premium usuwa reklamy banerowe, pełnoekranowe i przy otwarciu aplikacji."], ["Zakupy", "Zakupy obsługuje Apple lub Google. Nigdy nie widzimy twoich danych płatniczych; dowiadujemy się tylko, czy posiadasz Premium, aby móc je odblokować."], ["Dzieci", "Quack Derby to aplikacja dla ogółu odbiorców i nie jest skierowana do dzieci poniżej 13 lat. Nie zbieramy świadomie danych osobowych dzieci."], ["Usuwanie danych", "Użyj Ja › Dane › Resetuj wszystko lub usuń aplikację, aby usunąć wszystkie dane przechowywane przez Quack Derby."], ["Zmiany i kontakt", "Jeśli ta polityka się zmieni, zaktualizujemy datę powyżej. Pytania: haily.211194@gmail.com · 0334044737."]], "terms_title": "Warunki korzystania", "terms": [["Korzystanie z aplikacji", "Quack Derby to narzędzie do losowania imion, tworzenia drużyn i dobrej zabawy. Wyniki są losowe; korzystaj z nich odpowiedzialnie i nigdy do hazardu ani decyzji wymagających profesjonalnej oceny."], ["Premium", "Premium to jednorazowy zakup niekonsumpcyjny. Usuwa reklamy i odblokowuje większe wyścigi, dłuższe turnieje, głębsze koła, wideo 1080p i wszystkie rzeczy z garderoby. Nie ma subskrypcji. Zwrotami zajmuje się Apple lub Google zgodnie ze swoimi zasadami."], ["Okruszki", "Okruszki nie mają wartości pieniężnej, nie można ich wymieniać ani przekazywać i mogą zostać dostosowane, jeśli zmieni się ekonomia aplikacji."], ["Twoje treści", "Odpowiadasz za imiona i treści, które dodajesz i udostępniasz. Nie udostępniaj danych osobowych innych osób bez ich zgody."], ["Dostępność usługi", "Staramy się, aby aplikacja działała niezawodnie, ale jest dostarczana „tak jak jest”, bez gwarancji. W zakresie dozwolonym przez prawo nie ponosimy odpowiedzialności za szkody pośrednie wynikające z jej użytkowania."], ["Kontakt", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Zrobione z troską, kwakaniem i uczciwymi kośćmi."}, "sv": {"lang_name": "Svenska", "nav_support": "Hjälp", "nav_privacy": "Integritet", "nav_terms": "Villkor", "updated": "Senast uppdaterad: 2026-11-12", "support_title": "Hjälp & support", "support_intro": "Quack Derby gör en namnlista till ett lopp, en turnering eller ett snurr på hjulet — rättvist, verifierbart och offline. Behöver du hjälp? Skriv till oss så svarar en riktig människa.", "contact_title": "Kontakt", "contact_body": "E-post: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Utvecklare: Truong Hai Ly", "faq_title": "Vanliga frågor", "faq": [["Hur kan jag vara säker på att ett lopp är rättvist?", "Före varje lopp visar appen ett kort fingeravtryck (åtagande) av ett hemligt slumpfrö. Efter loppet avslöjas fröet. Vem som helst kan klistra in loppkoden i ”Verifiera” och spela upp exakt samma lopp — om resultatet hade ändrats skulle fingeravtrycket inte stämma."], ["Vad gör vikter?", "Vikter är avstängda som standard, så alla har samma chans. När du slår på dem har en deltagare med vikt 2× exakt dubbelt så stor chans att vinna som en deltagare med 1×. Lopp med vikter visar alltid märket ”Viktat”."], ["Vad är klassläget?", "I en klasslista får de som valts kliva åt sidan tills hela listan har valts en gång. Listan visar hur många gånger varje person har valts."], ["Lämnar foton av mina listor telefonen?", "Nej. Textigenkänningen körs på din enhet. Fotot laddas inte upp och sparas inte."], ["Hur återställer jag mitt köp?", "Öppna fliken Jag och tryck på ”Återställ köp”, eller använd knappen på VIP-biljettens skärm. Använd samma Apple-ID eller Google-konto som du köpte med."], ["Vad är smulor?", "Smulor är en rolig valuta i appen för hattar, glasögon och banteman. Du tjänar dem genom att tävla, checka in och titta på valfria annonser. De ändrar aldrig loppresultat och kan inte köpas för pengar."]], "privacy_title": "Integritetspolicy", "privacy": [["Översikt", "Quack Derby är byggd för att fungera offline. Dina listor, hjul, loppshistorik och inställningar lagras bara på din enhet. Vi har inga servrar som tar emot dina data och du behöver inget konto."], ["Data du anger", "Namn, anteckningar, avatarfoton och hjul stannar på din enhet. Textigenkänning för fotograferade listor sker på enheten; bilder laddas inte upp. Loppkoder som du väljer att dela innehåller namnen i det loppet, så dela dem bara med personer du litar på."], ["Kamera och foton", "Kameran används bara när du trycker på ”Foto av en lista” eller ”Skanna kod”. Åtkomst till bildbiblioteket används bara när du väljer en bild eller sparar ett resultat. Du kan när som helst ändra dessa behörigheter i enhetens inställningar."], ["Annonser", "Gratisversionen visar annonser från Google AdMob. AdMob kan samla in enhetsidentifierare, annonsdata, användnings- och diagnostikdata för att visa och mäta annonser. På iPhone ber vi om tillåtelse före all spårning (App Tracking Transparency); i EES/Storbritannien visas först ett samtyckesformulär från Googles User Messaging Platform. Du kan när som helst ändra ditt val under Jag › Integritetsval. Premium tar bort banner-, helskärms- och appöppningsannonser."], ["Köp", "Köp hanteras av Apple eller Google. Vi ser aldrig dina betalningsuppgifter; vi får bara veta om du äger Premium så att vi kan låsa upp det."], ["Barn", "Quack Derby är en app för en allmän publik och riktar sig inte till barn under 13 år. Vi samlar inte medvetet in personuppgifter från barn."], ["Radera dina data", "Använd Jag › Data › Återställ allt, eller radera appen, för att ta bort alla data som Quack Derby har lagrat."], ["Ändringar och kontakt", "Om den här policyn ändras uppdaterar vi datumet ovan. Frågor: haily.211194@gmail.com · 0334044737."]], "terms_title": "Användarvillkor", "terms": [["Använda appen", "Quack Derby är ett verktyg för att välja namn, göra lag och ha roligt. Resultaten är slumpmässiga; använd dem ansvarsfullt och aldrig för spel om pengar eller beslut som kräver professionell bedömning."], ["Premium", "Premium är ett engångsköp som inte förbrukas. Det tar bort annonser och låser upp större lopp, längre turneringar, djupare hjul, 1080p-video och alla garderobsföremål. Det finns ingen prenumeration. Återbetalningar hanteras av Apple eller Google enligt deras policyer."], ["Smulor", "Smulor har inget penningvärde, kan inte bytas eller överföras och kan justeras om ekonomin i appen ändras."], ["Ditt innehåll", "Du ansvarar för de namn och det innehåll du lägger till och delar. Dela inte andras personuppgifter utan tillåtelse."], ["Tillgänglighet", "Vi jobbar hårt för att hålla appen pålitlig, men den tillhandahålls ”i befintligt skick” utan garantier. I den utsträckning lagen tillåter ansvarar vi inte för indirekta förluster som uppstår genom användningen."], ["Kontakt", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Gjord med omsorg, kvack och rättvisa tärningar."}, "da": {"lang_name": "Dansk", "nav_support": "Hjælp", "nav_privacy": "Privatliv", "nav_terms": "Vilkår", "updated": "Senest opdateret: 2026-11-12", "support_title": "Hjælp og support", "support_intro": "Quack Derby forvandler en liste med navne til et løb, en turnering eller et lykkehjul — fair, verificerbart og offline. Brug for en hånd? Skriv til os, så svarer et rigtigt menneske.", "contact_title": "Kontakt", "contact_body": "E-mail: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Udvikler: Truong Hai Ly", "faq_title": "Ofte stillede spørgsmål", "faq": [["Hvordan kan jeg være sikker på, at et løb er fair?", "Før hvert løb viser appen et kort fingeraftryk (forsegling) af et hemmeligt tilfældigt frø. Efter løbet afsløres frøet. Alle kan indsætte løbskoden i “Verificér” og genafspille præcis det samme løb — hvis resultatet var blevet ændret, ville fingeraftrykket ikke passe."], ["Hvad gør vægte?", "Vægte er slået fra som standard, så alle har samme chance. Når du slår dem til, har en deltager med vægt 2× præcis dobbelt så stor chance for at vinde som en deltager med 1×. Løb med vægte viser altid et “Vægtet”-mærke."], ["Hvad er klasselistetilstand?", "I en klasseliste træder de, der er blevet valgt, til side, indtil hele listen er blevet valgt én gang. Listen viser, hvor mange gange hver person er blevet valgt."], ["Forlader fotos af mine lister min telefon?", "Nej. Tekstgenkendelsen kører på din enhed. Fotoet bliver hverken uploadet eller gemt."], ["Hvordan gendanner jeg mit køb?", "Åbn fanen Mig, og tryk på “Gendan køb”, eller brug knappen på skærmen med VIP-billetten. Brug det samme Apple-id eller den samme Google-konto, som du købte med."], ["Hvad er krummer?", "Krummer er en sjov valuta i appen til hatte, briller og banetemaer. Du tjener dem ved at løbe, tjekke ind og se valgfrie reklamer. De ændrer aldrig løbsresultater og kan ikke købes for penge."]], "privacy_title": "Privatlivspolitik", "privacy": [["Overblik", "Quack Derby er bygget til at fungere offline. Dine lister, hjul, løbshistorik og indstillinger gemmes kun på din enhed. Vi driver ingen servere, der modtager dine data, og du behøver ingen konto."], ["Data, du indtaster", "Navne, noter, avatarbilleder og hjul bliver på din enhed. Tekstgenkendelse af fotograferede lister sker på enheden; billeder bliver ikke uploadet. Løbskoder, du vælger at dele, indeholder navnene i det pågældende løb, så del dem kun med folk, du stoler på."], ["Kamera og fotos", "Kameraet bruges kun, når du trykker på “Foto af en liste” eller “Scan kode”. Adgang til fotobiblioteket bruges kun, når du vælger et billede eller gemmer et resultat. Du kan til enhver tid ændre disse tilladelser i enhedens indstillinger."], ["Reklamer", "Gratisversionen viser reklamer fra Google AdMob. AdMob kan indsamle enhedsidentifikatorer, reklamedata, brugs- og diagnosticeringsdata for at vise og måle reklamer. På iPhone beder vi om tilladelse før enhver sporing (App Tracking Transparency); i EØS/Storbritannien vises først en samtykkeformular fra Googles User Messaging Platform. Du kan til enhver tid ændre dit valg under Mig › Privatlivsvalg. Premium fjerner banner-, mellemside- og app-åbningsreklamer."], ["Køb", "Køb håndteres af Apple eller Google. Vi ser aldrig dine betalingsoplysninger; vi får kun at vide, om Premium er købt, så vi kan låse det op."], ["Børn", "Quack Derby er en app for et bredt publikum og er ikke rettet mod børn under 13 år. Vi indsamler ikke bevidst personoplysninger fra børn."], ["Sletning af dine data", "Brug Mig › Data › Nulstil alt, eller slet appen, for at fjerne alle data, som Quack Derby har gemt."], ["Ændringer og kontakt", "Hvis denne politik ændres, opdaterer vi datoen ovenfor. Spørgsmål: haily.211194@gmail.com · 0334044737."]], "terms_title": "Vilkår for brug", "terms": [["Brug af appen", "Quack Derby er et værktøj til at vælge navne, lave hold og have det sjovt. Resultaterne er tilfældige; brug dem ansvarligt og aldrig til spil om penge eller beslutninger, der kræver faglig vurdering."], ["Premium", "Premium er et engangskøb, der ikke forbruges. Det fjerner reklamer og låser større løb, længere turneringer, dybere hjul, 1080p-video og alle garderobeting op. Der er intet abonnement. Refusioner håndteres af Apple eller Google efter deres politikker."], ["Krummer", "Krummer har ingen pengeværdi, kan ikke veksles eller overføres og kan blive justeret, hvis økonomien ændres."], ["Dit indhold", "Du er ansvarlig for de navne og det indhold, du tilføjer og deler. Del ikke andres personoplysninger uden tilladelse."], ["Tilgængelighed", "Vi arbejder hårdt på at holde appen pålidelig, men den leveres “som den er” uden garantier. I det omfang loven tillader det, er vi ikke ansvarlige for indirekte tab som følge af brugen."], ["Kontakt", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Lavet med omhu, rap og fair terninger."}, "nb": {"lang_name": "Norsk bokmål", "nav_support": "Hjelp", "nav_privacy": "Personvern", "nav_terms": "Vilkår", "updated": "Sist oppdatert: 2026-11-12", "support_title": "Hjelp og støtte", "support_intro": "Quack Derby gjør en liste med navn om til et løp, en turnering eller et lykkehjul — rettferdig, etterprøvbart og uten nett. Trenger du hjelp? Skriv til oss, så svarer et ekte menneske.", "contact_title": "Kontakt", "contact_body": "E-post: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Utvikler: Truong Hai Ly", "faq_title": "Vanlige spørsmål", "faq": [["Hvordan kan jeg være sikker på at et løp er rettferdig?", "Før hvert løp viser appen et kort fingeravtrykk (forsegling) av et hemmelig tilfeldig frø. Etter løpet avsløres frøet. Alle kan lime inn løpskoden i «Verifiser» og spille av nøyaktig samme løp — hvis resultatet hadde blitt endret, ville ikke fingeravtrykket stemme."], ["Hva gjør vekter?", "Vekter er av som standard, så alle har samme sjanse. Når du slår dem på, har en deltaker med vekt 2× nøyaktig dobbelt så stor sjanse til å vinne som en deltaker med 1×. Løp med vekter viser alltid et «Vektet»-merke."], ["Hva er klasselistemodus?", "I en klasseliste trer de som er valgt til side til hele listen har blitt valgt én gang. Listen viser hvor mange ganger hver person er valgt."], ["Forlater bilder av listene mine telefonen?", "Nei. Tekstgjenkjenningen kjører på enheten din. Bildet blir verken lastet opp eller lagret."], ["Hvordan gjenoppretter jeg kjøpet mitt?", "Åpne fanen Meg og trykk «Gjenopprett kjøp», eller bruk knappen på skjermen med VIP-billetten. Bruk samme Apple-ID eller Google-konto som du kjøpte med."], ["Hva er smuler?", "Smuler er en morsom valuta i appen for hatter, briller og banetemaer. Du tjener dem ved å løpe, sjekke inn og se valgfrie reklamer. De endrer aldri løpsresultater og kan ikke kjøpes for penger."]], "privacy_title": "Personvernerklæring", "privacy": [["Oversikt", "Quack Derby er laget for å fungere uten nett. Listene, hjulene, løpshistorikken og innstillingene dine lagres bare på enheten din. Vi driver ingen servere som mottar dataene dine, og du trenger ingen konto."], ["Data du legger inn", "Navn, notater, avatarbilder og hjul blir på enheten din. Tekstgjenkjenning av fotograferte lister skjer på enheten; bilder lastes ikke opp. Løpskoder du velger å dele, inneholder navnene i det løpet, så del dem bare med folk du stoler på."], ["Kamera og bilder", "Kameraet brukes bare når du trykker på «Bilde av en liste» eller «Skann kode». Tilgang til bildebiblioteket brukes bare når du velger et bilde eller lagrer et resultat. Du kan når som helst endre disse tillatelsene i enhetens innstillinger."], ["Reklame", "Gratisversjonen viser reklame fra Google AdMob. AdMob kan samle inn enhetsidentifikatorer, reklamedata, bruks- og diagnosedata for å vise og måle reklame. På iPhone ber vi om tillatelse før all sporing (App Tracking Transparency); i EØS/Storbritannia vises først et samtykkeskjema fra Googles User Messaging Platform. Du kan når som helst endre valget ditt under Meg › Personvernvalg. Premium fjerner banner-, mellomside- og appåpningsreklame."], ["Kjøp", "Kjøp håndteres av Apple eller Google. Vi ser aldri betalingsopplysningene dine; vi får bare vite om Premium er kjøpt, slik at vi kan låse det opp."], ["Barn", "Quack Derby er en app for alle og er ikke rettet mot barn under 13 år. Vi samler ikke bevisst inn personopplysninger fra barn."], ["Sletting av dataene dine", "Bruk Meg › Data › Tilbakestill alt, eller slett appen, for å fjerne alle data som Quack Derby har lagret."], ["Endringer og kontakt", "Hvis denne erklæringen endres, oppdaterer vi datoen ovenfor. Spørsmål: haily.211194@gmail.com · 0334044737."]], "terms_title": "Vilkår for bruk", "terms": [["Bruk av appen", "Quack Derby er et verktøy for å velge navn, lage lag og ha det gøy. Resultatene er tilfeldige; bruk dem ansvarlig og aldri til pengespill eller beslutninger som krever faglig skjønn."], ["Premium", "Premium er et engangskjøp som ikke forbrukes. Det fjerner reklame og låser opp større løp, lengre turneringer, dypere hjul, 1080p-video og alle garderobeplagg. Det er ikke noe abonnement. Refusjoner håndteres av Apple eller Google etter deres retningslinjer."], ["Smuler", "Smuler har ingen pengeverdi, kan ikke veksles eller overføres og kan bli justert hvis økonomien endres."], ["Innholdet ditt", "Du er ansvarlig for navnene og innholdet du legger til og deler. Ikke del andres personopplysninger uten tillatelse."], ["Tilgjengelighet", "Vi jobber hardt for at appen skal være pålitelig, men den leveres «som den er» uten garantier. Så langt loven tillater det, er vi ikke ansvarlige for indirekte tap som følge av bruken."], ["Kontakt", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Laget med omtanke, kvakk og rettferdige terninger."}, "fi": {"lang_name": "Suomi", "nav_support": "Ohje", "nav_privacy": "Tietosuoja", "nav_terms": "Ehdot", "updated": "Päivitetty viimeksi: 2026-11-12", "support_title": "Ohje ja tuki", "support_intro": "Quack Derby tekee nimilistasta kisan, turnauksen tai onnenpyörän — reilusti, tarkistettavasti ja ilman verkkoyhteyttä. Tarvitsetko apua? Kirjoita meille, niin oikea ihminen vastaa.", "contact_title": "Yhteystiedot", "contact_body": "Sähköposti: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Puhelin: 0334044737<br>Kehittäjä: Truong Hai Ly", "faq_title": "Usein kysytyt kysymykset", "faq": [["Miten voin olla varma, että kisa on reilu?", "Ennen jokaista kisaa sovellus näyttää lyhyen sormenjäljen (sinetin) salaisesta satunnaisesta siemenestä. Kisan jälkeen siemen paljastetaan. Kuka tahansa voi liittää kisakoodin kohtaan ”Tarkista” ja toistaa täsmälleen saman kisan — jos tulosta olisi muutettu, sormenjälki ei täsmäisi."], ["Mitä painot tekevät?", "Painot ovat oletuksena pois päältä, joten kaikilla on sama mahdollisuus. Kun kytket ne päälle, painon 2× kilpailijalla on täsmälleen kaksinkertainen voittomahdollisuus painon 1× kilpailijaan verrattuna. Painotetuissa kisoissa näkyy aina ”Painotettu”-merkki."], ["Mikä on luokkalistatila?", "Luokkalistalla valitut siirtyvät sivuun, kunnes koko lista on valittu kerran. Lista näyttää, montako kertaa kukin on valittu."], ["Lähtevätkö listojeni kuvat puhelimestani?", "Eivät. Tekstintunnistus toimii laitteellasi. Kuvaa ei ladata palvelimelle eikä säilytetä."], ["Miten palautan ostokseni?", "Avaa Minä-välilehti ja napauta ”Palauta ostot” tai käytä VIP-lippunäkymän painiketta. Käytä samaa Apple ID:tä tai Google-tiliä, jolla teit oston."], ["Mitä murut ovat?", "Murut ovat hauska sovelluksen sisäinen valuutta hattuihin, laseihin ja ratateemoihin. Ansaitset niitä kisaamalla, kirjautumalla ja katsomalla vapaaehtoisia mainoksia. Ne eivät koskaan muuta kisan tuloksia, eikä niitä voi ostaa rahalla."]], "privacy_title": "Tietosuojakäytäntö", "privacy": [["Yleiskatsaus", "Quack Derby on tehty toimimaan ilman verkkoyhteyttä. Listasi, pyöräsi, kisahistoriasi ja asetuksesi tallennetaan vain laitteellesi. Emme ylläpidä palvelimia, jotka vastaanottaisivat tietojasi, etkä tarvitse tiliä."], ["Syöttämäsi tiedot", "Nimet, muistiinpanot, avatar-kuvat ja pyörät pysyvät laitteellasi. Valokuvattujen listojen tekstintunnistus tapahtuu laitteella; kuvia ei ladata palvelimelle. Jakamasi kisakoodit sisältävät kyseisen kisan nimet, joten jaa niitä vain ihmisille, joihin luotat."], ["Kamera ja kuvat", "Kameraa käytetään vain, kun napautat ”Kuva listasta” tai ”Skannaa koodi”. Kuvakirjastoa käytetään vain, kun valitset kuvan tai tallennat tuloksen. Voit muuttaa näitä lupia laitteen asetuksista milloin tahansa."], ["Mainonta", "Ilmaisversio näyttää Google AdMobin mainoksia. AdMob voi kerätä laitetunnisteita, mainostietoja sekä käyttö- ja diagnostiikkatietoja mainosten näyttämiseksi ja mittaamiseksi. iPhonessa pyydämme luvan ennen mitään seurantaa (App Tracking Transparency); ETA-alueella ja Isossa-Britanniassa näytetään ensin Googlen User Messaging Platformin suostumuslomake. Voit muuttaa valintaasi milloin tahansa kohdassa Minä › Tietosuojavalinnat. Premium poistaa banneri-, välimainos- ja avausmainokset."], ["Ostot", "Ostot hoitaa Apple tai Google. Emme koskaan näe maksutietojasi; saamme tietää vain, onko Premium omistettu, jotta voimme avata sen."], ["Lapset", "Quack Derby on tarkoitettu kaikenikäisille, eikä sitä ole suunnattu alle 13-vuotiaille lapsille. Emme tietoisesti kerää henkilötietoja lapsilta."], ["Tietojesi poistaminen", "Käytä kohtaa Minä › Tiedot › Nollaa kaikki tai poista sovellus poistaaksesi kaikki tiedot, jotka Quack Derby on tallentanut."], ["Muutokset ja yhteystiedot", "Jos tämä käytäntö muuttuu, päivitämme yllä olevan päivämäärän. Kysymykset: haily.211194@gmail.com · 0334044737."]], "terms_title": "Käyttöehdot", "terms": [["Sovelluksen käyttö", "Quack Derby on työkalu nimien valitsemiseen, joukkueiden muodostamiseen ja hauskanpitoon. Tulokset ovat satunnaisia; käytä niitä vastuullisesti äläkä koskaan rahapeleihin tai päätöksiin, jotka vaativat ammatillista harkintaa."], ["Premium", "Premium on kertaostos, joka ei kulu. Se poistaa mainokset ja avaa suuremmat kisat, pidemmät turnaukset, syvemmät pyörät, 1080p-videon ja kaikki vaatekaapin esineet. Tilausta ei ole. Hyvitykset hoitaa Apple tai Google omien käytäntöjensä mukaisesti."], ["Murut", "Muruilla ei ole rahallista arvoa, niitä ei voi vaihtaa tai siirtää, ja niitä voidaan säätää, jos talousjärjestelmä muuttuu."], ["Sisältösi", "Olet vastuussa lisäämistäsi ja jakamistasi nimistä ja sisällöstä. Älä jaa muiden henkilötietoja ilman lupaa."], ["Saatavuus", "Teemme parhaamme pitääksemme sovelluksen luotettavana, mutta se tarjotaan ”sellaisenaan” ilman takuita. Lain sallimissa rajoissa emme vastaa sen käytöstä aiheutuvista välillisistä vahingoista."], ["Yhteystiedot", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Tehty huolella, kvaakuilla ja reiluilla nopilla."}, "cs": {"lang_name": "Čeština", "nav_support": "Nápověda", "nav_privacy": "Soukromí", "nav_terms": "Podmínky", "updated": "Naposledy aktualizováno: 2026-11-12", "support_title": "Nápověda a podpora", "support_intro": "Quack Derby promění seznam jmen v závod, turnaj nebo kolo štěstí — férově, ověřitelně a offline. Potřebuješ pomoct? Napiš nám a odpoví ti skutečný člověk.", "contact_title": "Kontakt", "contact_body": "E-mail: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Vývojář: Truong Hai Ly", "faq_title": "Časté dotazy", "faq": [["Jak si můžu být jistý(á), že je závod férový?", "Před každým závodem aplikace zobrazí krátký otisk (pečeť) tajného náhodného semínka. Po závodě se semínko odhalí. Kdokoli může vložit kód závodu do „Ověřit“ a přehrát přesně stejný závod — kdyby byl výsledek změněn, otisk by nesouhlasil."], ["Co dělají váhy?", "Váhy jsou ve výchozím stavu vypnuté, takže všichni mají stejnou šanci. Když je zapneš, závodník s váhou 2× má přesně dvakrát větší šanci na výhru než závodník s 1×. Závody s váhami vždy zobrazují odznak „S váhami“."], ["Co je režim třídního seznamu?", "V třídním seznamu vybraní ustoupí stranou, dokud nebude celý seznam vybrán jednou. Seznam ukazuje, kolikrát byl kdo vybrán."], ["Opouštějí fotky mých seznamů telefon?", "Ne. Rozpoznávání textu probíhá ve tvém zařízení. Fotka se nenahrává ani neukládá."], ["Jak obnovím svůj nákup?", "Otevři kartu Já a klepni na „Obnovit nákupy“, nebo použij tlačítko na obrazovce VIP vstupenky. Použij stejné Apple ID nebo účet Google, pod kterým jsi nakupoval(a)."], ["Co jsou drobky?", "Drobky jsou zábavná měna v aplikaci na klobouky, brýle a motivy tratí. Získáváš je závoděním, přihlašováním a sledováním dobrovolných reklam. Nikdy nemění výsledky závodů a nelze je koupit za peníze."]], "privacy_title": "Zásady ochrany soukromí", "privacy": [["Přehled", "Quack Derby je navržen tak, aby fungoval offline. Tvé seznamy, kola, historie závodů a nastavení se ukládají jen ve tvém zařízení. Neprovozujeme servery, které by přijímaly tvá data, a nepotřebuješ žádný účet."], ["Data, která zadáváš", "Jména, poznámky, fotky avatarů a kola zůstávají ve tvém zařízení. Rozpoznávání textu z vyfocených seznamů probíhá v zařízení; obrázky se nenahrávají. Kódy závodů, které se rozhodneš sdílet, obsahují jména z daného závodu, takže je sdílej jen s lidmi, kterým důvěřuješ."], ["Fotoaparát a fotky", "Fotoaparát se používá jen tehdy, když klepneš na „Fotka seznamu“ nebo „Skenovat kód“. Přístup ke knihovně fotek se používá jen při výběru obrázku nebo uložení výsledku. Tato oprávnění můžeš kdykoli změnit v nastavení zařízení."], ["Reklama", "Bezplatná verze zobrazuje reklamy Google AdMob. AdMob může shromažďovat identifikátory zařízení, reklamní data a údaje o používání a diagnostice za účelem zobrazování a měření reklam. Na iPhonu žádáme o svolení před jakýmkoli sledováním (App Tracking Transparency); v EHP/Spojeném království se nejprve zobrazí formulář souhlasu z platformy Google User Messaging Platform. Svou volbu můžeš kdykoli změnit v Já › Volby soukromí. Premium odstraňuje bannerové, mezistránkové reklamy i reklamy při otevření aplikace."], ["Nákupy", "Nákupy zpracovává Apple nebo Google. Tvé platební údaje nikdy nevidíme; dozvíme se jen, zda vlastníš Premium, abychom ho mohli odemknout."], ["Děti", "Quack Derby je aplikace pro širokou veřejnost a není určena dětem mladším 13 let. Vědomě neshromažďujeme osobní údaje od dětí."], ["Smazání tvých dat", "Použij Já › Data › Obnovit vše nebo aplikaci smaž a odstraníš tak všechna data, která Quack Derby uložil."], ["Změny a kontakt", "Pokud se tyto zásady změní, aktualizujeme datum výše. Dotazy: haily.211194@gmail.com · 0334044737."]], "terms_title": "Podmínky použití", "terms": [["Používání aplikace", "Quack Derby je nástroj pro výběr jmen, tvoření týmů a zábavu. Výsledky jsou náhodné; používej je zodpovědně a nikdy pro hazardní hry nebo rozhodnutí, která vyžadují odborný úsudek."], ["Premium", "Premium je jednorázový, nespotřební nákup. Odstraňuje reklamy a odemyká větší závody, delší turnaje, hlubší kola, video 1080p a všechny kousky šatníku. Nejde o předplatné. Vrácení peněz řeší Apple nebo Google podle svých pravidel."], ["Drobky", "Drobky nemají peněžní hodnotu, nelze je směnit ani převést a mohou být upraveny, pokud se ekonomika aplikace změní."], ["Tvůj obsah", "Za jména a obsah, které přidáváš a sdílíš, odpovídáš ty. Nesdílej osobní údaje druhých bez jejich svolení."], ["Dostupnost", "Usilovně pracujeme na tom, aby aplikace byla spolehlivá, ale je poskytována „tak, jak je“, bez záruk. V rozsahu povoleném zákonem neodpovídáme za nepřímé ztráty vzniklé jejím používáním."], ["Kontakt", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Vyrobeno s péčí, kvákáním a férovými kostkami."}, "sk": {"lang_name": "Slovenčina", "nav_support": "Pomoc", "nav_privacy": "Súkromie", "nav_terms": "Podmienky", "updated": "Posledná aktualizácia: 2026-11-12", "support_title": "Pomoc a podpora", "support_intro": "Quack Derby premení zoznam mien na preteky, turnaj alebo točenie kolesom — férovo, overiteľne a offline. Potrebuješ pomôcť? Napíš nám a odpovie ti skutočný človek.", "contact_title": "Kontakt", "contact_body": "E-mail: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefón: 0334044737<br>Vývojár: Truong Hai Ly", "faq_title": "Časté otázky", "faq": [["Ako si môžem byť istý, že preteky sú férové?", "Pred každými pretekmi aplikácia zobrazí krátky odtlačok (záväzok) tajného náhodného semienka. Po pretekoch sa semienko odhalí. Ktokoľvek môže vložiť kód pretekov do „Overiť“ a prehrať presne tie isté preteky — ak by bol výsledok zmenený, odtlačok by nesedel."], ["Čo robia váhy?", "Váhy sú predvolene vypnuté, takže každý má rovnakú šancu. Keď ich zapneš, pretekár s váhou 2× má presne dvakrát väčšiu šancu vyhrať ako pretekár s 1×. Preteky s váhami vždy zobrazujú odznak „S váhami“."], ["Čo je režim triedy?", "V zozname triedy ľudia, ktorí už boli vybraní, ustúpia, kým nebude celý zoznam vybraný raz. Zoznam ukazuje, koľkokrát bol každý vybraný."], ["Opúšťajú fotky mojich zoznamov telefón?", "Nie. Rozpoznávanie textu prebieha v tvojom zariadení. Fotka sa nenahráva ani neukladá."], ["Ako obnovím nákup?", "Otvor kartu Ja a ťukni na „Obnoviť nákupy“ alebo použi tlačidlo na obrazovke VIP vstupenky. Použi rovnaké Apple ID alebo účet Google, s ktorým si nakupoval."], ["Čo sú omrvinky?", "Omrvinky sú zábavná mena v aplikácii na klobúky, okuliare a témy tratí. Získavaš ich pretekaním, prihlasovaním a sledovaním voliteľných reklám. Nikdy nemenia výsledky pretekov a nedajú sa kúpiť za peniaze."]], "privacy_title": "Zásady ochrany súkromia", "privacy": [["Prehľad", "Quack Derby je navrhnutá tak, aby fungovala offline. Tvoje zoznamy, kolesá, história pretekov a nastavenia sú uložené iba v tvojom zariadení. Neprevádzkujeme servery, ktoré by prijímali tvoje dáta, a nepotrebuješ účet."], ["Údaje, ktoré zadáš", "Mená, poznámky, fotky avatarov a kolesá zostávajú v tvojom zariadení. Rozpoznávanie textu z odfotených zoznamov prebieha v zariadení; obrázky sa nenahrávajú. Kódy pretekov, ktoré sa rozhodneš zdieľať, obsahujú mená z daných pretekov, preto ich zdieľaj iba s ľuďmi, ktorým dôveruješ."], ["Fotoaparát a fotky", "Fotoaparát sa používa iba vtedy, keď ťukneš na „Fotka zoznamu“ alebo „Skenovať kód“. Prístup ku knižnici fotiek sa používa iba pri výbere obrázka alebo ukladaní výsledku. Tieto povolenia môžeš kedykoľvek zmeniť v nastaveniach zariadenia."], ["Reklama", "Bezplatná verzia zobrazuje reklamy z Google AdMob. AdMob môže zbierať identifikátory zariadenia, reklamné údaje, údaje o používaní a diagnostické údaje na zobrazovanie a meranie reklám. Na iPhone pred akýmkoľvek sledovaním žiadame o povolenie (App Tracking Transparency); v EHP/UK sa najprv zobrazí formulár súhlasu z Google User Messaging Platform. Svoju voľbu môžeš kedykoľvek zmeniť v Ja › Nastavenia súkromia. Premium odstraňuje bannerové, celoobrazovkové reklamy aj reklamy pri otvorení aplikácie."], ["Nákupy", "Nákupy vybavuje Apple alebo Google. Tvoje platobné údaje nikdy nevidíme; dozvieme sa iba to, či vlastníš Premium, aby sme ho mohli odomknúť."], ["Deti", "Quack Derby je aplikácia pre široké publikum a nie je určená deťom mladším ako 13 rokov. Vedome nezbierame osobné údaje od detí."], ["Vymazanie údajov", "Použi Ja › Dáta › Obnoviť všetko alebo aplikáciu odstráň, čím vymažeš všetky údaje uložené aplikáciou Quack Derby."], ["Zmeny a kontakt", "Ak sa tieto zásady zmenia, aktualizujeme dátum vyššie. Otázky: haily.211194@gmail.com · 0334044737."]], "terms_title": "Podmienky používania", "terms": [["Používanie aplikácie", "Quack Derby je nástroj na vyberanie mien, vytváranie tímov a zábavu. Výsledky sú náhodné; používaj ich zodpovedne a nikdy nie na hazard alebo rozhodnutia, ktoré vyžadujú odborný úsudok."], ["Premium", "Premium je jednorazový, nespotrebný nákup. Odstraňuje reklamy a odomyká väčšie preteky, dlhšie turnaje, hlbšie kolesá, video 1080p a všetky kúsky zo šatníka. Nejde o predplatné. Vrátenie peňazí vybavuje Apple alebo Google podľa svojich pravidiel."], ["Omrvinky", "Omrvinky nemajú peňažnú hodnotu, nedajú sa vymeniť ani previesť a môžu byť upravené, ak sa zmení ekonomika aplikácie."], ["Tvoj obsah", "Zodpovedáš za mená a obsah, ktoré pridávaš a zdieľaš. Nezdieľaj osobné údaje iných bez ich súhlasu."], ["Dostupnosť", "Usilovne pracujeme na spoľahlivosti aplikácie, no poskytuje sa „tak, ako je“, bez záruk. V rozsahu povolenom zákonom nezodpovedáme za nepriame straty vyplývajúce z jej používania."], ["Kontakt", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Vyrobené s láskou, kvákaním a férovými kockami."}, "hu": {"lang_name": "Magyar", "nav_support": "Súgó", "nav_privacy": "Adatvédelem", "nav_terms": "Feltételek", "updated": "Utolsó frissítés: 2026-11-12", "support_title": "Súgó és támogatás", "support_intro": "A(z) Quack Derby egy névlistából versenyt, tornát vagy kerékpörgetést készít — tisztességesen, ellenőrizhetően és offline. Segítség kell? Írj nekünk, és egy valódi ember válaszol.", "contact_title": "Kapcsolat", "contact_body": "E-mail: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Fejlesztő: Truong Hai Ly", "faq_title": "Gyakran ismételt kérdések", "faq": [["Hogyan lehetek biztos benne, hogy a verseny tisztességes?", "Minden verseny előtt az app megmutatja egy titkos véletlen mag rövid ujjlenyomatát (rögzítését). A verseny után a mag nyilvánosságra kerül. Bárki beillesztheti a versenykódot az „Ellenőrzés” mezőbe, és pontosan ugyanazt a versenyt játszhatja vissza — ha az eredményt megváltoztatták volna, az ujjlenyomat nem egyezne."], ["Mit csinálnak a súlyok?", "A súlyok alapból ki vannak kapcsolva, így mindenkinek ugyanakkora az esélye. Ha bekapcsolod őket, egy 2× súlyú versenyző pontosan kétszer akkora eséllyel nyer, mint egy 1× súlyú. A súlyozott versenyeken mindig látszik a „Súlyozott” jelvény."], ["Mi az osztálymód?", "Osztálylistában a már kiválasztottak félreállnak, amíg az egész lista egyszer sorra nem került. A lista mutatja, ki hányszor lett kiválasztva."], ["Elhagyják a listáimról készült fotók a telefonomat?", "Nem. A szövegfelismerés a készülékeden fut. A fotót nem töltjük fel és nem tároljuk."], ["Hogyan állíthatom vissza a vásárlásomat?", "Nyisd meg az Én lapot, és koppints a „Vásárlások visszaállítása” gombra, vagy használd a VIP jegy képernyőjén lévő gombot. Ugyanazt az Apple ID-t vagy Google-fiókot használd, amellyel vásároltál."], ["Mik azok a morzsák?", "A morzsák egy játékos, appon belüli pénznem kalapokra, szemüvegekre és pályatémákra. Versenyzéssel, bejelentkezéssel és opcionális hirdetések megnézésével szerezheted őket. Sosem változtatják meg a versenyeredményt, és pénzért nem vásárolhatók."]], "privacy_title": "Adatvédelmi irányelvek", "privacy": [["Áttekintés", "A(z) Quack Derby offline működésre készült. A listáid, kerekeid, versenyelőzményeid és beállításaid kizárólag a készülékeden tárolódnak. Nem üzemeltetünk olyan szervert, amely az adataidat fogadná, és fiókra sincs szükséged."], ["Az általad megadott adatok", "A nevek, megjegyzések, avatárfotók és kerekek a készülékeden maradnak. A lefotózott listák szövegfelismerése a készüléken történik; a képeket nem töltjük fel. Az általad megosztott versenykódok tartalmazzák az adott verseny neveit, ezért csak megbízható emberekkel oszd meg őket."], ["Kamera és fotók", "A kamerát csak akkor használjuk, ha a „Lista fotója” vagy a „Kód beolvasása” gombra koppintasz. A fotókönyvtárhoz csak kép kiválasztásakor vagy eredmény mentésekor férünk hozzá. Ezeket az engedélyeket bármikor módosíthatod a készülék beállításaiban."], ["Hirdetések", "Az ingyenes verzió a Google AdMob hirdetéseit jeleníti meg. Az AdMob eszközazonosítókat, hirdetési adatokat, használati és diagnosztikai adatokat gyűjthet a hirdetések megjelenítéséhez és méréséhez. iPhone-on minden követés előtt engedélyt kérünk (App Tracking Transparency); az EGT-ben és az Egyesült Királyságban előbb a Google User Messaging Platform hozzájárulási űrlapja jelenik meg. Döntésedet bármikor módosíthatod az Én › Adatvédelmi beállítások menüben. A Premium eltávolítja a banner-, a teljes képernyős és az appmegnyitási hirdetéseket."], ["Vásárlások", "A vásárlásokat az Apple vagy a Google kezeli. Fizetési adataidat sosem látjuk; csak azt tudjuk meg, hogy megvan-e a Premium, hogy feloldhassuk."], ["Gyermekek", "A(z) Quack Derby általános közönségnek szóló app, és nem 13 év alatti gyermekeknek készült. Tudatosan nem gyűjtünk személyes adatokat gyermekektől."], ["Adataid törlése", "Használd az Én › Adatok › Minden visszaállítása lehetőséget, vagy töröld az appot, hogy eltávolíts minden adatot, amelyet a(z) Quack Derby tárolt."], ["Változások és kapcsolat", "Ha ezek az irányelvek változnak, frissítjük a fenti dátumot. Kérdések: haily.211194@gmail.com · 0334044737."]], "terms_title": "Felhasználási feltételek", "terms": [["Az app használata", "A(z) Quack Derby egy eszköz nevek kiválasztására, csapatok alkotására és szórakozásra. Az eredmények véletlenszerűek; használd őket felelősséggel, és soha ne szerencsejátékra vagy szakmai mérlegelést igénylő döntésekre."], ["Premium", "A Premium egyszeri, nem fogyóeszköz típusú vásárlás. Eltávolítja a hirdetéseket, és feloldja a nagyobb versenyeket, hosszabb tornákat, mélyebb kerekeket, az 1080p videót és minden ruhatárelemet. Nincs előfizetés. A visszatérítést az Apple vagy a Google intézi saját szabályai szerint."], ["Morzsák", "A morzsáknak nincs pénzbeli értékük, nem válthatók be és nem ruházhatók át, és módosulhatnak, ha az app gazdasága megváltozik."], ["A tartalmad", "Te felelsz az általad hozzáadott és megosztott nevekért és tartalmakért. Mások személyes adatait ne oszd meg engedélyük nélkül."], ["Elérhetőség", "Keményen dolgozunk az app megbízhatóságáért, de „ahogy van” alapon, garancia nélkül biztosítjuk. A törvény által megengedett mértékben nem felelünk a használatából eredő közvetett károkért."], ["Kapcsolat", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Gondossággal, hápogással és tisztességes kockákkal készült."}, "ro": {"lang_name": "Română", "nav_support": "Ajutor", "nav_privacy": "Confidențialitate", "nav_terms": "Termeni", "updated": "Ultima actualizare: 2026-11-12", "support_title": "Ajutor și asistență", "support_intro": "Quack Derby transformă o listă de nume într-o cursă, un turneu sau o roată norocoasă — corect, verificabil și offline. Ai nevoie de ajutor? Scrie-ne și îți va răspunde un om adevărat.", "contact_title": "Contact", "contact_body": "E-mail: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Dezvoltator: Truong Hai Ly", "faq_title": "Întrebări frecvente", "faq": [["Cum pot fi sigur că o cursă este corectă?", "Înainte de fiecare cursă, aplicația afișează o amprentă scurtă (angajament) a unei semințe aleatorii secrete. După cursă, sămânța este dezvăluită. Oricine poate lipi codul cursei în „Verifică” și poate reda exact aceeași cursă — dacă rezultatul ar fi fost modificat, amprenta nu s-ar potrivi."], ["Ce fac ponderile?", "Ponderile sunt oprite implicit, așa că toată lumea are aceeași șansă. Când le pornești, un concurent cu pondere 2× are exact de două ori mai multe șanse să câștige decât unul cu 1×. Cursele cu ponderi afișează mereu insigna „Cu ponderi”."], ["Ce este modul clasă?", "Într-o listă de clasă, persoanele alese stau deoparte până când întreaga listă a fost aleasă o dată. Lista arată de câte ori a fost aleasă fiecare persoană."], ["Fotografiile listelor mele părăsesc telefonul?", "Nu. Recunoașterea textului rulează pe dispozitivul tău. Fotografia nu este încărcată și nici păstrată."], ["Cum îmi restabilesc achiziția?", "Deschide fila Eu și atinge „Restabilește achizițiile” sau folosește butonul de pe ecranul biletului VIP. Folosește același Apple ID sau cont Google cu care ai cumpărat."], ["Ce sunt firimiturile?", "Firimiturile sunt o monedă distractivă din aplicație pentru pălării, ochelari și teme de pistă. Le câștigi concurând, făcând check-in și urmărind reclame opționale. Nu schimbă niciodată rezultatele curselor și nu pot fi cumpărate cu bani."]], "privacy_title": "Politica de confidențialitate", "privacy": [["Prezentare generală", "Quack Derby este creată să funcționeze offline. Listele, roțile, istoricul curselor și setările tale sunt stocate doar pe dispozitivul tău. Nu avem servere care să primească datele tale și nu ai nevoie de cont."], ["Datele pe care le introduci", "Numele, notele, fotografiile de avatar și roțile rămân pe dispozitivul tău. Recunoașterea textului din listele fotografiate are loc pe dispozitiv; imaginile nu sunt încărcate. Codurile de cursă pe care alegi să le distribui conțin numele din acea cursă, așa că distribuie-le doar persoanelor în care ai încredere."], ["Camera și fotografiile", "Camera este folosită doar când atingi „Fotografia unei liste” sau „Scanează codul”. Accesul la biblioteca foto este folosit doar când alegi o imagine sau salvezi un rezultat. Poți schimba oricând aceste permisiuni din setările dispozitivului."], ["Publicitate", "Versiunea gratuită afișează reclame de la Google AdMob. AdMob poate colecta identificatori ai dispozitivului, date de publicitate, date de utilizare și de diagnosticare pentru a afișa și măsura reclamele. Pe iPhone cerem permisiunea înainte de orice urmărire (App Tracking Transparency); în SEE/Regatul Unit apare mai întâi un formular de consimțământ de la Google User Messaging Platform. Îți poți schimba oricând alegerea din Eu › Opțiuni de confidențialitate. Premium elimină reclamele banner, interstițiale și de la deschiderea aplicației."], ["Achiziții", "Achizițiile sunt gestionate de Apple sau Google. Nu vedem niciodată detaliile tale de plată; aflăm doar dacă deții Premium, ca să-l putem debloca."], ["Copii", "Quack Derby este o aplicație pentru publicul larg și nu se adresează copiilor sub 13 ani. Nu colectăm în mod intenționat informații personale de la copii."], ["Ștergerea datelor", "Folosește Eu › Date › Resetează tot sau șterge aplicația pentru a elimina toate datele stocate de Quack Derby."], ["Modificări și contact", "Dacă această politică se schimbă, vom actualiza data de mai sus. Întrebări: haily.211194@gmail.com · 0334044737."]], "terms_title": "Termeni de utilizare", "terms": [["Utilizarea aplicației", "Quack Derby este un instrument pentru alegerea numelor, formarea echipelor și distracție. Rezultatele sunt aleatorii; folosește-le responsabil și niciodată pentru jocuri de noroc sau decizii care necesită judecată profesională."], ["Premium", "Premium este o achiziție unică, neconsumabilă. Elimină reclamele și deblochează curse mai mari, turnee mai lungi, roți mai adânci, video 1080p și toate articolele din garderobă. Nu există abonament. Rambursările sunt gestionate de Apple sau Google conform politicilor lor."], ["Firimituri", "Firimiturile nu au valoare monetară, nu pot fi schimbate sau transferate și pot fi ajustate dacă economia aplicației se schimbă."], ["Conținutul tău", "Ești responsabil pentru numele și conținutul pe care le adaugi și le distribui. Nu distribui informații personale ale altora fără permisiune."], ["Disponibilitate", "Muncim din greu ca aplicația să fie fiabilă, dar este oferită „ca atare”, fără garanții. În măsura permisă de lege, nu răspundem pentru pierderi indirecte rezultate din utilizarea ei."], ["Contact", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Făcut cu grijă, mac-mac și zaruri corecte."}, "uk": {"lang_name": "Українська", "nav_support": "Довідка", "nav_privacy": "Конфіденційність", "nav_terms": "Умови", "updated": "Останнє оновлення: 2026-11-12", "support_title": "Довідка та підтримка", "support_intro": "Quack Derby перетворює список імен на перегони, турнір або обертання колеса — чесно, перевірювано й офлайн. Потрібна допомога? Напиши нам, і відповість справжня людина.", "contact_title": "Контакти", "contact_body": "Ел. пошта: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Телефон: 0334044737<br>Розробник: Truong Hai Ly", "faq_title": "Поширені запитання", "faq": [["Як переконатися, що перегони чесні?", "Перед кожними перегонами застосунок показує короткий відбиток (зобов’язання) таємного випадкового зерна. Після перегонів зерно розкривається. Будь-хто може вставити код перегонів у «Перевірити» й відтворити точно ті самі перегони — якби результат змінили, відбиток не збігся б."], ["Що роблять ваги?", "За замовчуванням ваги вимкнено, тож у всіх однаковий шанс. Коли ти їх вмикаєш, учасник із вагою 2× має рівно вдвічі більше шансів перемогти, ніж учасник з 1×. Перегони з вагами завжди показують значок «З вагами»."], ["Що таке режим класу?", "У списку класу вже обрані люди відходять убік, доки весь список не буде обрано один раз. Список показує, скільки разів обирали кожного."], ["Чи покидають фото моїх списків телефон?", "Ні. Розпізнавання тексту відбувається на твоєму пристрої. Фото не вивантажується й не зберігається."], ["Як відновити покупку?", "Відкрий вкладку «Я» й торкнися «Відновити покупки» або скористайся кнопкою на екрані VIP-квитка. Використовуй той самий Apple ID чи обліковий запис Google, з яким купував."], ["Що таке крихти?", "Крихти — це весела внутрішня валюта для капелюхів, окулярів і тем трас. Їх можна заробити в перегонах, щоденними відмітками та переглядом необов’язкової реклами. Вони ніколи не змінюють результатів перегонів і не продаються за гроші."]], "privacy_title": "Політика конфіденційності", "privacy": [["Огляд", "Quack Derby створено для роботи офлайн. Твої списки, колеса, історія перегонів і налаштування зберігаються лише на твоєму пристрої. Ми не маємо серверів, які отримують твої дані, і обліковий запис не потрібен."], ["Дані, які ти вводиш", "Імена, нотатки, фото аватарів і колеса залишаються на твоєму пристрої. Розпізнавання тексту зі сфотографованих списків відбувається на пристрої; зображення не вивантажуються. Коди перегонів, якими ти вирішиш поділитися, містять імена з цих перегонів, тож ділися ними лише з тими, кому довіряєш."], ["Камера та фото", "Камера використовується, лише коли ти торкаєшся «Фото списку» або «Сканувати код». Доступ до бібліотеки фото використовується, лише коли ти вибираєш зображення чи зберігаєш результат. Ці дозволи можна будь-коли змінити в налаштуваннях пристрою."], ["Реклама", "Безкоштовна версія показує рекламу Google AdMob. AdMob може збирати ідентифікатори пристрою, рекламні дані, дані про використання та діагностику, щоб показувати й вимірювати рекламу. На iPhone ми просимо дозвіл перед будь-яким відстеженням (App Tracking Transparency); у ЄЕЗ/Великій Британії спершу з’являється форма згоди від Google User Messaging Platform. Свій вибір можна будь-коли змінити в Я › Вибір конфіденційності. Premium прибирає банерну, повноекранну рекламу та рекламу під час відкриття застосунку."], ["Покупки", "Покупки обробляють Apple або Google. Ми ніколи не бачимо твоїх платіжних даних; ми дізнаємося лише, чи придбано Premium, щоб відкрити його."], ["Діти", "Quack Derby — застосунок для широкої аудиторії, не призначений для дітей до 13 років. Ми свідомо не збираємо персональну інформацію дітей."], ["Видалення даних", "Скористайся Я › Дані › Скинути все або видали застосунок, щоб прибрати всі дані, збережені Quack Derby."], ["Зміни та контакти", "Якщо ця політика зміниться, ми оновимо дату вгорі. Питання: haily.211194@gmail.com · 0334044737."]], "terms_title": "Умови використання", "terms": [["Використання застосунку", "Quack Derby — це інструмент для вибору імен, створення команд і розваги. Результати випадкові; використовуй їх відповідально й ніколи — для азартних ігор чи рішень, що потребують професійної оцінки."], ["Premium", "Premium — це одноразова невитратна покупка. Вона прибирає рекламу й відкриває більші перегони, довші турніри, глибші колеса, відео 1080p і всі речі з гардероба. Підписки немає. Поверненням коштів займаються Apple або Google відповідно до своїх правил."], ["Крихти", "Крихти не мають грошової вартості, їх не можна обміняти чи передати, і їх може бути скориговано, якщо зміниться економіка застосунку."], ["Твій контент", "Ти відповідаєш за імена й контент, які додаєш і поширюєш. Не поширюй персональні дані інших людей без їхнього дозволу."], ["Доступність", "Ми докладаємо зусиль, щоб застосунок працював надійно, але він надається «як є», без гарантій. У межах, дозволених законом, ми не відповідаємо за непрямі збитки, що виникли внаслідок його використання."], ["Контакти", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Зроблено з турботою, кряканням і чесними кубиками."}, "el": {"lang_name": "Ελληνικά", "nav_support": "Βοήθεια", "nav_privacy": "Απόρρητο", "nav_terms": "Όροι", "updated": "Τελευταία ενημέρωση: 2026-11-12", "support_title": "Βοήθεια & υποστήριξη", "support_intro": "Το Quack Derby μετατρέπει μια λίστα ονομάτων σε αγώνα, τουρνουά ή γύρισμα ρόδας — δίκαια, επαληθεύσιμα και χωρίς σύνδεση. Χρειάζεσαι βοήθεια; Γράψε μας και θα σου απαντήσει ένας πραγματικός άνθρωπος.", "contact_title": "Επικοινωνία", "contact_body": "Email: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Τηλέφωνο: 0334044737<br>Προγραμματιστής: Truong Hai Ly", "faq_title": "Συχνές ερωτήσεις", "faq": [["Πώς μπορώ να είμαι σίγουρος ότι ένας αγώνας είναι δίκαιος;", "Πριν από κάθε αγώνα η εφαρμογή δείχνει ένα σύντομο αποτύπωμα (δέσμευση) ενός μυστικού τυχαίου σπόρου. Μετά τον αγώνα ο σπόρος αποκαλύπτεται. Ο καθένας μπορεί να επικολλήσει τον κωδικό αγώνα στην «Επαλήθευση» και να ξαναπαίξει ακριβώς τον ίδιο αγώνα — αν το αποτέλεσμα είχε αλλάξει, το αποτύπωμα δεν θα ταίριαζε."], ["Τι κάνουν τα βάρη;", "Τα βάρη είναι ανενεργά από προεπιλογή, οπότε όλοι έχουν την ίδια πιθανότητα. Όταν τα ενεργοποιήσεις, ένας δρομέας με βάρος 2× έχει ακριβώς διπλάσια πιθανότητα να κερδίσει από έναν με 1×. Οι αγώνες με βάρη δείχνουν πάντα το σήμα «Με βάρη»."], ["Τι είναι η λειτουργία τάξης;", "Σε μια λίστα τάξης, όσοι επιλέχθηκαν μένουν στην άκρη μέχρι να επιλεγεί μία φορά όλη η λίστα. Η λίστα δείχνει πόσες φορές επιλέχθηκε ο καθένας."], ["Φεύγουν από το κινητό μου οι φωτογραφίες των λιστών;", "Όχι. Η αναγνώριση κειμένου γίνεται στη συσκευή σου. Η φωτογραφία δεν ανεβαίνει ούτε κρατιέται."], ["Πώς επαναφέρω την αγορά μου;", "Άνοιξε την καρτέλα «Εγώ» και πάτα «Επαναφορά αγορών» ή χρησιμοποίησε το κουμπί στην οθόνη του εισιτηρίου VIP. Χρησιμοποίησε το ίδιο Apple ID ή λογαριασμό Google με τον οποίο αγόρασες."], ["Τι είναι τα ψίχουλα;", "Τα ψίχουλα είναι ένα διασκεδαστικό νόμισμα της εφαρμογής για καπέλα, γυαλιά και θέματα πίστας. Τα κερδίζεις με αγώνες, check-in και προαιρετικές διαφημίσεις. Δεν αλλάζουν ποτέ τα αποτελέσματα και δεν αγοράζονται με χρήματα."]], "privacy_title": "Πολιτική απορρήτου", "privacy": [["Επισκόπηση", "Το Quack Derby είναι φτιαγμένο για να λειτουργεί χωρίς σύνδεση. Οι λίστες, οι ρόδες, το ιστορικό αγώνων και οι ρυθμίσεις σου αποθηκεύονται μόνο στη συσκευή σου. Δεν διατηρούμε διακομιστές που λαμβάνουν τα δεδομένα σου και δεν χρειάζεσαι λογαριασμό."], ["Δεδομένα που εισάγεις", "Ονόματα, σημειώσεις, φωτογραφίες άβαταρ και ρόδες μένουν στη συσκευή σου. Η αναγνώριση κειμένου σε φωτογραφημένες λίστες γίνεται στη συσκευή· οι εικόνες δεν ανεβαίνουν. Οι κωδικοί αγώνα που επιλέγεις να μοιραστείς περιέχουν τα ονόματα του αγώνα, γι' αυτό μοιράσου τους μόνο με άτομα που εμπιστεύεσαι."], ["Κάμερα και φωτογραφίες", "Η κάμερα χρησιμοποιείται μόνο όταν πατάς «Φωτογραφία λίστας» ή «Σάρωση κωδικού». Η πρόσβαση στη βιβλιοθήκη φωτογραφιών χρησιμοποιείται μόνο όταν διαλέγεις εικόνα ή αποθηκεύεις αποτέλεσμα. Μπορείς να αλλάξεις αυτές τις άδειες στις ρυθμίσεις της συσκευής ανά πάσα στιγμή."], ["Διαφημίσεις", "Η δωρεάν έκδοση δείχνει διαφημίσεις από το Google AdMob. Το AdMob μπορεί να συλλέγει αναγνωριστικά συσκευής, διαφημιστικά δεδομένα, δεδομένα χρήσης και διαγνωστικά για την προβολή και μέτρηση διαφημίσεων. Στο iPhone ζητάμε άδεια πριν από οποιαδήποτε παρακολούθηση (App Tracking Transparency)· στον ΕΟΧ/ΗΒ εμφανίζεται πρώτα μια φόρμα συγκατάθεσης από το User Messaging Platform της Google. Μπορείς να αλλάξεις την επιλογή σου ανά πάσα στιγμή στο Εγώ › Επιλογές απορρήτου. Το Premium αφαιρεί τις διαφημίσεις banner, πλήρους οθόνης και ανοίγματος εφαρμογής."], ["Αγορές", "Τις αγορές τις διαχειρίζεται η Apple ή η Google. Δεν βλέπουμε ποτέ τα στοιχεία πληρωμής σου· μαθαίνουμε μόνο αν έχεις Premium ώστε να το ξεκλειδώσουμε."], ["Παιδιά", "Το Quack Derby είναι εφαρμογή για γενικό κοινό και δεν απευθύνεται σε παιδιά κάτω των 13. Δεν συλλέγουμε εν γνώσει μας προσωπικές πληροφορίες από παιδιά."], ["Διαγραφή δεδομένων", "Χρησιμοποίησε Εγώ › Δεδομένα › Επαναφορά όλων ή διάγραψε την εφαρμογή για να αφαιρέσεις όλα τα δεδομένα που αποθηκεύει το Quack Derby."], ["Αλλαγές και επικοινωνία", "Αν αλλάξει αυτή η πολιτική, θα ενημερώσουμε την παραπάνω ημερομηνία. Ερωτήσεις: haily.211194@gmail.com · 0334044737."]], "terms_title": "Όροι χρήσης", "terms": [["Χρήση της εφαρμογής", "Το Quack Derby είναι ένα εργαλείο για επιλογή ονομάτων, δημιουργία ομάδων και διασκέδαση. Τα αποτελέσματα είναι τυχαία· χρησιμοποίησέ τα υπεύθυνα και ποτέ για τζόγο ή αποφάσεις που απαιτούν επαγγελματική κρίση."], ["Premium", "Το Premium είναι εφάπαξ, μη αναλώσιμη αγορά. Αφαιρεί τις διαφημίσεις και ξεκλειδώνει μεγαλύτερους αγώνες, μεγαλύτερα τουρνουά, βαθύτερες ρόδες, βίντεο 1080p και όλη τη γκαρνταρόμπα. Δεν υπάρχει συνδρομή. Τις επιστροφές χρημάτων τις χειρίζεται η Apple ή η Google σύμφωνα με τις πολιτικές τους."], ["Ψίχουλα", "Τα ψίχουλα δεν έχουν χρηματική αξία, δεν ανταλλάσσονται ούτε μεταβιβάζονται και μπορεί να προσαρμοστούν αν αλλάξει η οικονομία της εφαρμογής."], ["Το περιεχόμενό σου", "Είσαι υπεύθυνος για τα ονόματα και το περιεχόμενο που προσθέτεις και μοιράζεσαι. Μη μοιράζεσαι προσωπικές πληροφορίες άλλων χωρίς άδεια."], ["Διαθεσιμότητα", "Δουλεύουμε σκληρά ώστε η εφαρμογή να είναι αξιόπιστη, αλλά παρέχεται «ως έχει» χωρίς εγγυήσεις. Στο μέτρο που επιτρέπει ο νόμος, δεν ευθυνόμαστε για έμμεσες ζημίες από τη χρήση της."], ["Επικοινωνία", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Φτιαγμένο με φροντίδα, πα-πα και δίκαια ζάρια."}, "he": {"lang_name": "עברית", "nav_support": "עזרה", "nav_privacy": "פרטיות", "nav_terms": "תנאים", "updated": "עודכן לאחרונה: 2026-11-12", "support_title": "עזרה ותמיכה", "support_intro": "Quack Derby הופך רשימת שמות למרוץ, לטורניר או לסיבוב גלגל — הוגן, ניתן לאימות ועובד בלי אינטרנט. צריכים עזרה? כתבו לנו ואדם אמיתי יענה.", "contact_title": "יצירת קשר", "contact_body": "דוא״ל: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>טלפון: 0334044737<br>מפתח: Truong Hai Ly", "faq_title": "שאלות נפוצות", "faq": [["איך אפשר להיות בטוחים שמרוץ הוגן?", "לפני כל מרוץ האפליקציה מציגה טביעת אצבע קצרה (התחייבות) של גרעין אקראי סודי. אחרי המרוץ הגרעין נחשף. כל אחד יכול להדביק את קוד המרוץ ב„אימות” ולהריץ שוב את אותו מרוץ בדיוק — אם התוצאה הייתה משתנה, טביעת האצבע לא הייתה תואמת."], ["מה עושים המשקלים?", "המשקלים כבויים כברירת מחדל, כך שלכולם אותו סיכוי. כשמפעילים אותם, למשתתף עם משקל ‎2×‎ יש בדיוק פי שניים סיכוי לנצח ממשתתף עם ‎1×‎. מרוצים עם משקלים תמיד מציגים תג „עם משקלים”."], ["מה זה מצב כיתה?", "ברשימת כיתה, מי שנבחר זז הצידה עד שכל הרשימה נבחרה פעם אחת. הרשימה מציגה כמה פעמים כל אחד נבחר."], ["האם תמונות של הרשימות שלי יוצאות מהטלפון?", "לא. זיהוי הטקסט מתבצע במכשיר שלכם. התמונה לא מועלית ולא נשמרת."], ["איך משחזרים רכישה?", "פתחו את לשונית „אני” והקישו על „שחזור רכישות”, או השתמשו בכפתור במסך כרטיס ה־VIP. השתמשו באותו Apple ID או חשבון Google שבו קניתם."], ["מה הם פירורים?", "פירורים הם מטבע משחקי באפליקציה לכובעים, משקפיים וערכות מסלול. מרוויחים אותם ממרוצים, צ׳ק־אין וצפייה בפרסומות אופציונליות. הם אף פעם לא משנים תוצאות מרוץ ואי אפשר לקנות אותם בכסף."]], "privacy_title": "מדיניות פרטיות", "privacy": [["סקירה", "Quack Derby בנוי לעבוד בלי אינטרנט. הרשימות, הגלגלים, היסטוריית המרוצים וההגדרות שלכם נשמרים רק במכשיר שלכם. אין לנו שרתים שמקבלים את הנתונים שלכם, ואין צורך בחשבון."], ["נתונים שאתם מזינים", "שמות, הערות, תמונות אווטאר וגלגלים נשארים במכשיר שלכם. זיהוי טקסט ברשימות מצולמות מתבצע במכשיר; תמונות לא מועלות. קודי מרוץ שאתם בוחרים לשתף מכילים את השמות שבמרוץ, אז שתפו אותם רק עם אנשים שאתם סומכים עליהם."], ["מצלמה ותמונות", "המצלמה משמשת רק כשמקישים על „תמונה של רשימה” או „סריקת קוד”. הגישה לספריית התמונות משמשת רק כשבוחרים תמונה או שומרים תוצאה. אפשר לשנות את ההרשאות האלה בהגדרות המכשיר בכל עת."], ["פרסום", "הגרסה החינמית מציגה פרסומות מ־Google AdMob. AdMob עשויה לאסוף מזהי מכשיר, נתוני פרסום, נתוני שימוש ואבחון כדי להציג ולמדוד פרסומות. ב־iPhone אנחנו מבקשים רשות לפני כל מעקב (App Tracking Transparency); באזור הכלכלי האירופי ובבריטניה מופיע קודם טופס הסכמה של User Messaging Platform של Google. אפשר לשנות את הבחירה בכל עת תחת אני › בחירות פרטיות. Premium מסיר פרסומות באנר, מסך מלא ופתיחת אפליקציה."], ["רכישות", "הרכישות מטופלות על ידי Apple או Google. אנחנו אף פעם לא רואים את פרטי התשלום שלכם; אנחנו רק יודעים אם יש לכם Premium כדי לפתוח אותו."], ["ילדים", "Quack Derby היא אפליקציה לקהל הרחב ואינה מיועדת לילדים מתחת לגיל 13. איננו אוספים ביודעין מידע אישי מילדים."], ["מחיקת הנתונים שלכם", "השתמשו באני › נתונים › איפוס הכול, או מחקו את האפליקציה, כדי להסיר את כל הנתונים ש־Quack Derby שומר."], ["שינויים ויצירת קשר", "אם המדיניות תשתנה, נעדכן את התאריך למעלה. שאלות: haily.211194@gmail.com · 0334044737."]], "terms_title": "תנאי שימוש", "terms": [["שימוש באפליקציה", "Quack Derby הוא כלי לבחירת שמות, חלוקה לקבוצות וכיף. התוצאות אקראיות; השתמשו בהן באחריות ולעולם לא להימורים או להחלטות שדורשות שיקול דעת מקצועי."], ["Premium", "Premium הוא רכישה חד־פעמית שאינה מתכלה. הוא מסיר פרסומות ופותח מרוצים גדולים יותר, טורנירים ארוכים יותר, גלגלים עמוקים יותר, וידאו 1080p וכל פריטי המלתחה. אין מנוי. החזרים מטופלים על ידי Apple או Google לפי המדיניות שלהן."], ["פירורים", "לפירורים אין ערך כספי, אי אפשר להמיר או להעביר אותם, והם עשויים להשתנות אם הכלכלה באפליקציה משתנה."], ["התוכן שלכם", "אתם אחראים לשמות ולתוכן שאתם מוסיפים ומשתפים. אל תשתפו מידע אישי של אחרים בלי רשות."], ["זמינות", "אנחנו עובדים קשה כדי שהאפליקציה תהיה אמינה, אבל היא מסופקת „כמות שהיא” ללא אחריות. במידה שהחוק מתיר, איננו אחראים להפסדים עקיפים הנובעים מהשימוש בה."], ["יצירת קשר", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. נעשה באהבה, בגע־גע ובקוביות הוגנות."}, "fa": {"lang_name": "فارسی", "nav_support": "راهنما", "nav_privacy": "حریم خصوصی", "nav_terms": "شرایط", "updated": "آخرین به‌روزرسانی: 2026-11-12", "support_title": "راهنما و پشتیبانی", "support_intro": "Quack Derby فهرستی از نام‌ها را به مسابقه، تورنمنت یا چرخش گردونه تبدیل می‌کند — منصفانه، قابل تأیید و آفلاین. کمک لازم داری؟ برایمان بنویس تا یک انسان واقعی جوابت را بدهد.", "contact_title": "تماس", "contact_body": "ایمیل: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>تلفن: 0334044737<br>توسعه‌دهنده: Truong Hai Ly", "faq_title": "پرسش‌های پرتکرار", "faq": [["از کجا مطمئن شوم مسابقه منصفانه است؟", "پیش از هر مسابقه، برنامه اثر انگشت کوتاهی (تعهد) از یک بذر تصادفی مخفی نشان می‌دهد. پس از مسابقه بذر فاش می‌شود. هر کسی می‌تواند کد مسابقه را در «تأیید» جای‌گذاری کند و دقیقاً همان مسابقه را بازپخش کند — اگر نتیجه تغییر کرده بود، اثر انگشت مطابقت نمی‌کرد."], ["وزن‌ها چه می‌کنند؟", "وزن‌ها به‌طور پیش‌فرض خاموش‌اند، پس همه شانس یکسان دارند. وقتی روشنشان کنی، شرکت‌کننده‌ای با وزن ×2 دقیقاً دو برابر شرکت‌کننده‌ای با ×1 شانس برد دارد. مسابقه‌های وزن‌دار همیشه نشان «وزن‌دار» را نمایش می‌دهند."], ["حالت کلاسی چیست؟", "در فهرست کلاسی، کسانی که انتخاب شده‌اند کنار می‌روند تا کل فهرست یک بار انتخاب شود. فهرست نشان می‌دهد هر نفر چند بار انتخاب شده است."], ["آیا عکس فهرست‌هایم از گوشی خارج می‌شود؟", "نه. تشخیص متن روی دستگاه خودت انجام می‌شود. عکس آپلود یا نگه‌داری نمی‌شود."], ["خریدم را چطور بازیابی کنم؟", "زبانهٔ «من» را باز کن و «بازیابی خریدها» را بزن، یا از دکمهٔ صفحهٔ بلیت VIP استفاده کن. از همان Apple ID یا حساب Google که با آن خریده‌ای استفاده کن."], ["خرده‌نان چیست؟", "خرده‌نان یک واحد پول سرگرم‌کننده در برنامه برای کلاه، عینک و پوستهٔ پیست است. آن را با مسابقه دادن، ثبت حضور و تماشای تبلیغات اختیاری به دست می‌آوری. هرگز نتیجهٔ مسابقه را تغییر نمی‌دهد و با پول خریدنی نیست."]], "privacy_title": "سیاست حریم خصوصی", "privacy": [["نمای کلی", "Quack Derby برای کار به‌صورت آفلاین ساخته شده است. فهرست‌ها، گردونه‌ها، تاریخچهٔ مسابقه و تنظیماتت فقط روی دستگاهت ذخیره می‌شوند. ما سروری که داده‌هایت را دریافت کند نداریم و به حساب کاربری نیازی نیست."], ["داده‌هایی که وارد می‌کنی", "نام‌ها، یادداشت‌ها، عکس‌های آواتار و گردونه‌ها روی دستگاهت می‌مانند. تشخیص متن فهرست‌های عکاسی‌شده روی دستگاه انجام می‌شود؛ تصاویر آپلود نمی‌شوند. کدهای مسابقه‌ای که به اشتراک می‌گذاری نام‌های آن مسابقه را در خود دارند، پس فقط با افراد مورد اعتماد به اشتراک بگذار."], ["دوربین و عکس‌ها", "دوربین فقط وقتی «عکس از فهرست» یا «اسکن کد» را بزنی استفاده می‌شود. دسترسی به کتابخانهٔ عکس فقط وقتی تصویری انتخاب کنی یا نتیجه‌ای ذخیره کنی استفاده می‌شود. هر زمان می‌توانی این مجوزها را در تنظیمات دستگاه تغییر دهی."], ["تبلیغات", "نسخهٔ رایگان تبلیغات Google AdMob را نشان می‌دهد. AdMob ممکن است شناسه‌های دستگاه، داده‌های تبلیغاتی، داده‌های استفاده و عیب‌یابی را برای نمایش و سنجش تبلیغات جمع‌آوری کند. در iPhone پیش از هرگونه ردیابی اجازه می‌گیریم (App Tracking Transparency)؛ در منطقهٔ اقتصادی اروپا و بریتانیا ابتدا فرم رضایت User Messaging Platform گوگل نمایش داده می‌شود. هر زمان می‌توانی انتخابت را در من › انتخاب‌های حریم خصوصی تغییر دهی. Premium تبلیغات بنری، تمام‌صفحه و هنگام باز شدن برنامه را حذف می‌کند."], ["خریدها", "خریدها توسط Apple یا Google انجام می‌شوند. ما هرگز جزئیات پرداختت را نمی‌بینیم؛ فقط می‌فهمیم Premium را داری یا نه تا آن را باز کنیم."], ["کودکان", "Quack Derby برنامه‌ای برای عموم است و مخاطبش کودکان زیر ۱۳ سال نیست. ما آگاهانه اطلاعات شخصی کودکان را جمع‌آوری نمی‌کنیم."], ["حذف داده‌ها", "برای حذف همهٔ داده‌هایی که Quack Derby ذخیره کرده، از من › داده‌ها › بازنشانی همه‌چیز استفاده کن یا برنامه را حذف کن."], ["تغییرات و تماس", "اگر این سیاست تغییر کند، تاریخ بالا را به‌روز می‌کنیم. پرسش‌ها: haily.211194@gmail.com · 0334044737."]], "terms_title": "شرایط استفاده", "terms": [["استفاده از برنامه", "Quack Derby ابزاری برای انتخاب نام، تیم‌سازی و سرگرمی است. نتایج تصادفی‌اند؛ لطفاً مسئولانه از آن‌ها استفاده کن و هرگز برای قمار یا تصمیم‌هایی که نیاز به قضاوت حرفه‌ای دارند به کار نبر."], ["Premium", "Premium خریدی یک‌باره و غیرمصرفی است. تبلیغات را حذف می‌کند و مسابقه‌های بزرگ‌تر، تورنمنت‌های طولانی‌تر، گردونه‌های عمیق‌تر، ویدیوی 1080p و همهٔ آیتم‌های کمد لباس را باز می‌کند. اشتراکی در کار نیست. بازپرداخت‌ها طبق سیاست‌های Apple یا Google توسط آن‌ها انجام می‌شود."], ["خرده‌نان", "خرده‌نان ارزش پولی ندارد، قابل مبادله یا انتقال نیست و ممکن است در صورت تغییر اقتصاد برنامه تعدیل شود."], ["محتوای تو", "مسئولیت نام‌ها و محتوایی که اضافه و به اشتراک می‌گذاری با خودت است. اطلاعات شخصی دیگران را بدون اجازه به اشتراک نگذار."], ["در دسترس بودن", "ما سخت تلاش می‌کنیم برنامه قابل اعتماد بماند، اما «همان‌طور که هست» و بدون ضمانت ارائه می‌شود. تا جایی که قانون اجازه می‌دهد، مسئول زیان‌های غیرمستقیم ناشی از استفاده از آن نیستیم."], ["تماس", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. ساخته‌شده با دقت، کواک‌کواک و تاس‌های منصف."}, "bg": {"lang_name": "Български", "nav_support": "Помощ", "nav_privacy": "Поверителност", "nav_terms": "Условия", "updated": "Последна актуализация: 2026-11-12", "support_title": "Помощ и поддръжка", "support_intro": "Quack Derby превръща списък с имена в състезание, турнир или завъртане на колело — честно, проверимо и офлайн. Нужна ти е помощ? Пиши ни и ще ти отговори истински човек.", "contact_title": "Контакт", "contact_body": "Имейл
