@media (prefers-color-scheme:dark){:root{--bg:#14212B;--card:#1E2F3B;--ink:#F4EBD9;--soft:#A9B4C2;--pri:#FF9F45;--duck:#FFDA5E;--sea:#3CCFE0}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{width:64px;height:64px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
header h1{font-size:28px;margin:0;font-weight:900;letter-spacing:.3px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
nav a,select{border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px;color:var(--ink);text-decoration:none;font-weight:700;background:var(--card);box-shadow:0 3px 0 var(--ink);font-size:14px}
nav a.on{background:var(--duck);color:#1F2A37}
select{font:inherit;font-size:14px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink);padding:18px 20px;margin:16px 0}
h2{font-size:22px;margin:4px 0 8px}h3{font-size:17px;margin:14px 0 4px}
p{margin:6px 0}a{color:var(--sea)}.soft{color:var(--soft);font-size:14px}
details{border-top:2px dashed color-mix(in srgb,var(--ink) 25%,transparent);padding:10px 0}
details:first-of-type{border-top:0}summary{cursor:pointer;font-weight:700}

<main id="main"><noscript><h3>Using the app</h3><p>Quack Derby is a tool for picking names, making teams and having fun. Results are random; please use them responsibly and never for gambling or decisions that require professional judgement.</p><h3>Premium</h3><p>Premium is a one-time, non-consumable purchase. It removes ads and unlocks larger races, longer tournaments, deeper wheels, 1080p video and all wardrobe items. There is no subscription. Refunds are handled by Apple or Google under their policies.</p><h3>Crumbs</h3><p>Crumbs have no monetary value, cannot be exchanged or transferred and may be adjusted if the economy changes.</p><h3>Your content</h3><p>You are responsible for the names and content you add and share. Do not share personal information of others without permission.</p><h3>Availability</h3><p>We work hard to keep the app reliable, but it is provided “as is” without warranties. To the extent allowed by law we are not liable for indirect losses arising from its use.</p><h3>Contact</h3><p>Truong Hai Ly · haily.211194@gmail.com · 0334044737</p></noscript></main><footer id="foot"></footer></div>
<script>const DATA={"en": {"lang_name": "English", "nav_support": "Help", "nav_privacy": "Privacy", "nav_terms": "Terms", "updated": "Last updated: 2026-11-12", "support_title": "Help & support", "support_intro": "Quack Derby turns a list of names into a race, a tournament or a wheel spin — fair, verifiable and offline. Need a hand? Write to us and a real person will answer.", "contact_title": "Contact", "contact_body": "Email: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Phone: 0334044737<br>Developer: Truong Hai Ly", "faq_title": "Frequently asked questions", "faq": [["How can I be sure a race is fair?", "Before every race the app shows a short fingerprint (commitment) of a secret random seed. After the race the seed is revealed. Anyone can paste the race code into “Verify” and replay the exact same race — if the result had been changed, the fingerprint would not match."], ["What do weights do?", "Weights are off by default, so everyone has the same chance. When you switch them on, a racer with weight 2× is exactly twice as likely to win as a racer with 1×. Races with weights always show a “Weighted” badge."], ["What is classroom mode?", "In a classroom list, people who were picked step aside until the whole list has been picked once. The list shows how many times each person was picked."], ["Do photos of my lists leave my phone?", "No. Text recognition runs on your device. The photo is not uploaded or kept."], ["How do I restore my purchase?", "Open the Me tab and tap “Restore purchases”, or use the button on the VIP ticket screen. Use the same Apple ID or Google account you bought with."], ["What are crumbs?", "Crumbs are a fun in-app currency for hats, glasses and track themes. You earn them by racing, checking in and watching optional ads. They never change race results and cannot be bought with money."]], "privacy_title": "Privacy policy", "privacy": [["Overview", "Quack Derby is built to work offline. Your lists, wheels, race history and settings are stored only on your device. We do not run servers that receive your data, and you do not need an account."], ["Data you enter", "Names, notes, avatar photos and wheels stay on your device. Text recognition for photographed lists happens on the device; images are not uploaded. Race codes you choose to share contain the names in that race, so only share them with people you trust."], ["Camera and photos", "The camera is used only when you tap “Photo of a list” or “Scan code”. Photo library access is used only when you pick an image or save a result. You can change these permissions in your device settings at any time."], ["Advertising", "The free version shows ads from Google AdMob. AdMob may collect device identifiers, advertising data, usage and diagnostic data to show and measure ads. On iPhone we ask for permission before any tracking (App Tracking Transparency); in the EEA/UK a consent form from Google’s User Messaging Platform appears first. You can change your choice at any time under Me › Privacy choices. Premium removes banner, interstitial and app-open ads."], ["Purchases", "Purchases are handled by Apple or Google. We never see your payment details; we only learn whether Premium is owned so we can unlock it."], ["Children", "Quack Derby is a general-audience app and is not directed at children under 13. We do not knowingly collect personal information from children."], ["Deleting your data", "Use Me › Data › Reset everything, or delete the app, to remove all data stored by Quack Derby."], ["Changes and contact", "If this policy changes we will update the date above. Questions: haily.211194@gmail.com · 0334044737."]], "terms_title": "Terms of use", "terms": [["Using the app", "Quack Derby is a tool for picking names, making teams and having fun. Results are random; please use them responsibly and never for gambling or decisions that require professional judgement."], ["Premium", "Premium is a one-time, non-consumable purchase. It removes ads and unlocks larger races, longer tournaments, deeper wheels, 1080p video and all wardrobe items. There is no subscription. Refunds are handled by Apple or Google under their policies."], ["Crumbs", "Crumbs have no monetary value, cannot be exchanged or transferred and may be adjusted if the economy changes."], ["Your content", "You are responsible for the names and content you add and share. Do not share personal information of others without permission."], ["Availability", "We work hard to keep the app reliable, but it is provided “as is” without warranties. To the extent allowed by law we are not liable for indirect losses arising from its use."], ["Contact", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Made with care, quacks and fair dice."}, "vi": {"lang_name": "Tiếng Việt", "nav_support": "Trợ giúp", "nav_privacy": "Quyền riêng tư", "nav_terms": "Điều khoản", "updated": "Cập nhật lần cuối: 2026-11-12", "support_title": "Trợ giúp & hỗ trợ", "support_intro": "Quack Derby biến một danh sách tên thành cuộc đua, giải đấu hay vòng quay — công bằng, kiểm chứng được và chạy offline. Cần giúp đỡ? Hãy viết cho chúng tôi, một người thật sẽ trả lời.", "contact_title": "Liên hệ", "contact_body": "Email: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Điện thoại: 0334044737<br>Nhà phát triển: Truong Hai Ly", "faq_title": "Câu hỏi thường gặp", "faq": [["Làm sao biết cuộc đua công bằng?", "Trước mỗi cuộc đua, app hiện một “dấu vân tay” ngắn (mã cam kết) của một hạt giống ngẫu nhiên bí mật. Sau cuộc đua, hạt giống được công bố. Ai cũng có thể dán mã cuộc đua vào mục “Kiểm chứng” để chạy lại đúng cuộc đua đó — nếu kết quả bị sửa, dấu vân tay sẽ không khớp."], ["Trọng số dùng để làm gì?", "Trọng số mặc định tắt, nên ai cũng có cơ hội như nhau. Khi bật, người có trọng số 2× có khả năng thắng gấp đúng hai lần người 1×. Cuộc đua có trọng số luôn hiện huy hiệu “Có trọng số”."], ["Chế độ lớp học là gì?", "Trong danh sách lớp học, người đã được gọi sẽ tạm đứng ngoài cho tới khi cả danh sách được gọi một lượt. Danh sách hiển thị số lần mỗi người được gọi."], ["Ảnh chụp danh sách có rời khỏi điện thoại không?", "Không. Việc nhận dạng chữ chạy ngay trên máy. Ảnh không được tải lên hay lưu lại."], ["Khôi phục giao dịch thế nào?", "Mở tab Tôi và bấm “Khôi phục giao dịch”, hoặc dùng nút trên màn hình Vé VIP. Hãy dùng đúng Apple ID hoặc tài khoản Google đã mua."], ["Bánh mì là gì?", "Bánh mì là đơn vị vui trong app để mua mũ, kính và giao diện đường đua. Bạn nhận được khi đua, điểm danh và xem quảng cáo tuỳ chọn. Bánh mì không bao giờ ảnh hưởng kết quả đua và không mua được bằng tiền."]], "privacy_title": "Chính sách quyền riêng tư", "privacy": [["Tổng quan", "Quack Derby được làm để chạy offline. Danh sách, vòng quay, lịch sử đua và cài đặt của bạn chỉ được lưu trên thiết bị. Chúng tôi không có máy chủ nhận dữ liệu của bạn và bạn không cần tài khoản."], ["Dữ liệu bạn nhập", "Tên, ghi chú, ảnh đại diện và vòng quay chỉ nằm trên máy. Nhận dạng chữ cho ảnh chụp danh sách diễn ra trên máy; ảnh không được tải lên. Mã cuộc đua bạn chọn chia sẻ có chứa tên trong cuộc đua đó, nên chỉ chia sẻ với người bạn tin tưởng."], ["Camera và ảnh", "Camera chỉ được dùng khi bạn bấm “Chụp danh sách” hoặc “Quét mã”. Quyền thư viện ảnh chỉ dùng khi bạn chọn ảnh hoặc lưu kết quả. Bạn có thể đổi các quyền này trong cài đặt thiết bị bất cứ lúc nào."], ["Quảng cáo", "Bản miễn phí hiển thị quảng cáo từ Google AdMob. AdMob có thể thu thập mã định danh thiết bị, dữ liệu quảng cáo, dữ liệu sử dụng và chẩn đoán để hiển thị và đo lường quảng cáo. Trên iPhone, chúng tôi hỏi ý kiến trước khi theo dõi (App Tracking Transparency); ở EEA/Anh, biểu mẫu đồng ý của Google User Messaging Platform sẽ hiện trước. Bạn có thể đổi lựa chọn bất cứ lúc nào ở Tôi › Lựa chọn quyền riêng tư. Premium gỡ quảng cáo banner, quảng cáo xen kẽ và quảng cáo khi mở app."], ["Mua hàng", "Giao dịch do Apple hoặc Google xử lý. Chúng tôi không bao giờ thấy thông tin thanh toán; chúng tôi chỉ biết bạn đã sở hữu Premium hay chưa để mở khoá."], ["Trẻ em", "Quack Derby dành cho mọi người và không hướng tới trẻ em dưới 13 tuổi. Chúng tôi không cố ý thu thập thông tin cá nhân của trẻ em."], ["Xoá dữ liệu", "Dùng Tôi › Dữ liệu › Đặt lại toàn bộ, hoặc xoá app, để xoá mọi dữ liệu Quack Derby lưu trên máy."], ["Thay đổi và liên hệ", "Nếu chính sách thay đổi, chúng tôi sẽ cập nhật ngày ở trên. Thắc mắc: haily.211194@gmail.com · 0334044737."]], "terms_title": "Điều khoản sử dụng", "terms": [["Sử dụng app", "Quack Derby là công cụ để bốc thăm tên, chia đội và vui chơi. Kết quả là ngẫu nhiên; hãy dùng có trách nhiệm và không dùng cho cờ bạc hay những quyết định cần ý kiến chuyên môn."], ["Premium", "Premium là giao dịch mua một lần, không tiêu hao. Premium gỡ quảng cáo và mở khoá cuộc đua lớn hơn, giải đấu dài hơn, vòng quay nhiều tầng hơn, video 1080p và mọi món đồ trang trí. Không có gói thuê bao. Hoàn tiền do Apple hoặc Google xử lý theo chính sách của họ."], ["Bánh mì", "Bánh mì không có giá trị quy đổi thành tiền, không thể trao đổi hay chuyển nhượng và có thể được điều chỉnh khi cơ chế trong app thay đổi."], ["Nội dung của bạn", "Bạn chịu trách nhiệm với tên và nội dung bạn thêm và chia sẻ. Đừng chia sẻ thông tin cá nhân của người khác khi chưa được phép."], ["Tính sẵn sàng", "Chúng tôi cố gắng giữ app ổn định, nhưng app được cung cấp “nguyên trạng” và không kèm bảo đảm. Trong phạm vi pháp luật cho phép, chúng tôi không chịu trách nhiệm cho thiệt hại gián tiếp phát sinh từ việc sử dụng."], ["Liên hệ", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Làm bằng sự tận tâm, tiếng quạc và xúc xắc công bằng."}, "ja": {"lang_name": "日本語", "nav_support": "ヘルプ", "nav_privacy": "プライバシー", "nav_terms": "利用規約", "updated": "最終更新日：2026-11-12", "support_title": "ヘルプとサポート", "support_intro": "Quack Derbyは名前のリストを、レース、トーナメント、ルーレットに変えるアプリです — 公正で、検証でき、オフラインで動きます。お困りですか？ご連絡いただければ、実際の担当者がお返事します。", "contact_title": "お問い合わせ", "contact_body": "メール：<a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>電話：0334044737<br>開発者：Truong Hai Ly", "faq_title": "よくある質問", "faq": [["レースが公正だと確かめるには？", "毎回のレースの前に、アプリは秘密のランダムシードの短いフィンガープリント（コミットメント）を表示します。レース後にシードが公開されます。誰でもレースコードを「検証」に貼り付けて、まったく同じレースを再現できます — 結果が変えられていれば、フィンガープリントは一致しません。"], ["重み付けとは？", "重み付けは初期設定でオフなので、全員が同じ確率です。オンにすると、重み2×のレーサーは1×のレーサーのちょうど2倍勝ちやすくなります。重み付きのレースには必ず「重み付けあり」バッジが表示されます。"], ["クラス名簿モードとは？", "クラス名簿では、選ばれた人はリスト全員が一度選ばれるまでお休みします。リストには各自が選ばれた回数が表示されます。"], ["リストの写真はスマホの外に送られますか？", "いいえ。文字認識はデバイス上で行われます。写真がアップロードされたり保存されたりすることはありません。"], ["購入を復元するには？", "マイページタブを開いて「購入を復元」をタップするか、VIPチケット画面のボタンを使ってください。購入時と同じApple IDまたはGoogleアカウントを使ってください。"], ["パンくずとは？", "パンくずは、帽子、メガネ、コーステーマに使える楽しいアプリ内通貨です。レース、チェックイン、任意の広告視聴で獲得できます。レース結果を変えることはなく、お金で買うこともできません。"]], "privacy_title": "プライバシーポリシー", "privacy": [["概要", "Quack Derbyはオフラインで動くように作られています。リスト、ルーレット、レース履歴、設定はお使いのデバイスにのみ保存されます。私たちはデータを受け取るサーバーを運営しておらず、アカウントも必要ありません。"], ["入力するデータ", "名前、メモ、アバター写真、ルーレットはデバイス内に留まります。撮影したリストの文字認識はデバイス上で行われ、画像はアップロードされません。共有を選んだレースコードにはそのレースの名前が含まれるため、信頼できる人とだけ共有してください。"], ["カメラと写真", "カメラは「リストの写真」または「コードをスキャン」をタップしたときだけ使われます。写真ライブラリへのアクセスは、画像を選ぶときや結果を保存するときだけ使われます。これらの許可はいつでもデバイスの設定で変更できます。"], ["広告", "無料版ではGoogle AdMobの広告が表示されます。AdMobは広告の表示と効果測定のために、デバイス識別子、広告データ、利用状況や診断データを収集する場合があります。iPhoneでは、トラッキングの前に許可を求めます（App Tracking Transparency）。EEA/英国では、まずGoogleのUser Messaging Platformによる同意フォームが表示されます。選択はいつでもマイページ › プライバシー設定で変更できます。Premiumではバナー、インタースティシャル、アプリ起動時の広告が表示されなくなります。"], ["購入", "購入はAppleまたはGoogleが処理します。私たちが支払い情報を見ることはなく、Premiumを解放するために所有の有無だけを確認します。"], ["お子さま", "Quack Derbyは一般向けのアプリであり、13歳未満のお子さまを対象としていません。お子さまの個人情報を故意に収集することはありません。"], ["データの削除", "マイページ › データ › すべてリセットを使うか、アプリを削除すると、Quack Derbyが保存したすべてのデータが削除されます。"], ["変更とお問い合わせ", "本ポリシーを変更した場合は、上記の日付を更新します。お問い合わせ：haily.211194@gmail.com · 0334044737。"]], "terms_title": "利用規約", "terms": [["アプリの利用", "Quack Derbyは名前を選んだり、チームを作ったり、楽しんだりするためのツールです。結果はランダムです。責任を持ってご利用いただき、ギャンブルや専門的な判断が必要な決定には決して使わないでください。"], ["Premium", "Premiumは1回限りの非消耗型の購入です。広告を削除し、より大きなレース、より長いトーナメント、より深いルーレット、1080p動画、すべての衣装アイテムを解放します。サブスクリプションではありません。返金はAppleまたはGoogleが各社のポリシーに基づいて対応します。"], ["パンくず", "パンくずに金銭的価値はなく、交換や譲渡はできません。また、アプリ内経済の変更に伴い調整される場合があります。"], ["あなたのコンテンツ", "追加・共有する名前やコンテンツについてはご自身の責任となります。他人の個人情報を許可なく共有しないでください。"], ["提供について", "アプリの安定性には努めていますが、本アプリは「現状のまま」無保証で提供されます。法律で認められる範囲で、利用によって生じた間接的な損害について責任を負いません。"], ["お問い合わせ", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. 心を込めて、クワッと、公正なサイコロで作りました。"}, "ko": {"lang_name": "한국어", "nav_support": "도움말", "nav_privacy": "개인정보", "nav_terms": "약관", "updated": "최종 업데이트: 2026-11-12", "support_title": "도움말 및 지원", "support_intro": "Quack Derby는 이름 목록을 레이스, 토너먼트 또는 돌림판으로 바꿔 줘요 — 공정하고, 검증할 수 있고, 오프라인으로 작동해요. 도움이 필요하신가요? 연락 주시면 실제 사람이 답해 드려요.", "contact_title": "문의", "contact_body": "이메일: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>전화: 0334044737<br>개발자: Truong Hai Ly", "faq_title": "자주 묻는 질문", "faq": [["레이스가 공정한지 어떻게 확신할 수 있나요?", "매 레이스 전에 앱은 비밀 랜덤 시드의 짧은 지문(커밋)을 보여 줘요. 레이스가 끝나면 시드가 공개돼요. 누구나 레이스 코드를 “검증”에 붙여넣어 똑같은 레이스를 재현할 수 있어요 — 결과가 바뀌었다면 지문이 일치하지 않아요."], ["가중치는 무슨 역할을 하나요?", "가중치는 기본적으로 꺼져 있어서 모두 같은 확률을 가져요. 켜면 가중치 2×인 레이서는 1×인 레이서보다 정확히 두 배 더 이기기 쉬워요. 가중치가 적용된 레이스에는 항상 “가중치 적용” 배지가 표시돼요."], ["반 명단 모드가 뭔가요?", "반 명단에서는 뽑힌 사람이 목록 전체가 한 번씩 뽑힐 때까지 빠져 있어요. 목록에는 각 사람이 몇 번 뽑혔는지 표시돼요."], ["명단 사진이 휴대폰 밖으로 나가나요?", "아니요. 글자 인식은 기기에서 이루어져요. 사진은 업로드되거나 보관되지 않아요."], ["구매를 어떻게 복원하나요?", "나 탭을 열고 “구매 복원”을 탭하거나, VIP 티켓 화면의 버튼을 사용하세요. 구매할 때 사용한 Apple ID 또는 Google 계정을 사용하세요."], ["빵부스러기가 뭔가요?", "빵부스러기는 모자, 안경, 트랙 테마에 쓰는 재미있는 앱 내 화폐예요. 레이스, 출석, 선택형 광고 시청으로 얻을 수 있어요. 레이스 결과를 절대 바꾸지 않으며 돈으로 살 수 없어요."]], "privacy_title": "개인정보 처리방침", "privacy": [["개요", "Quack Derby는 오프라인으로 작동하도록 만들어졌어요. 목록, 돌림판, 레이스 기록, 설정은 기기에만 저장돼요. 저희는 데이터를 받는 서버를 운영하지 않으며 계정도 필요하지 않아요."], ["입력하는 데이터", "이름, 메모, 아바타 사진, 돌림판은 기기에 남아요. 촬영한 명단의 글자 인식은 기기에서 이루어지며 이미지는 업로드되지 않아요. 공유하기로 한 레이스 코드에는 그 레이스의 이름이 포함되므로 신뢰하는 사람과만 공유하세요."], ["카메라와 사진", "카메라는 “명단 사진” 또는 “코드 스캔”을 탭할 때만 사용돼요. 사진 보관함 접근은 이미지를 선택하거나 결과를 저장할 때만 사용돼요. 이 권한은 언제든 기기 설정에서 바꿀 수 있어요."], ["광고", "무료 버전에는 Google AdMob 광고가 표시돼요. AdMob은 광고를 표시하고 측정하기 위해 기기 식별자, 광고 데이터, 사용 및 진단 데이터를 수집할 수 있어요. iPhone에서는 추적 전에 허락을 구해요(App Tracking Transparency). EEA/영국에서는 Google User Messaging Platform의 동의 양식이 먼저 표시돼요. 선택은 언제든 나 › 개인정보 설정에서 바꿀 수 있어요. Premium은 배너, 전면 광고, 앱 실행 광고를 제거해요."], ["구매", "구매는 Apple 또는 Google이 처리해요. 저희는 결제 정보를 절대 보지 않으며, Premium을 잠금 해제하기 위해 보유 여부만 확인해요."], ["어린이", "Quack Derby는 일반 사용자용 앱이며 13세 미만 어린이를 대상으로 하지 않아요. 저희는 어린이의 개인정보를 고의로 수집하지 않아요."], ["데이터 삭제", "나 › 데이터 › 모두 초기화를 사용하거나 앱을 삭제하면 Quack Derby에 저장된 모든 데이터가 삭제돼요."], ["변경 및 문의", "이 방침이 변경되면 위의 날짜를 업데이트할게요. 문의: haily.211194@gmail.com · 0334044737."]], "terms_title": "이용약관", "terms": [["앱 사용", "Quack Derby는 이름을 뽑고, 팀을 나누고, 즐기기 위한 도구예요. 결과는 무작위이니 책임감 있게 사용하시고, 도박이나 전문적인 판단이 필요한 결정에는 절대 사용하지 마세요."], ["Premium", "Premium은 한 번만 결제하는 비소모성 구매예요. 광고를 제거하고 더 큰 레이스, 더 긴 토너먼트, 더 깊은 돌림판, 1080p 영상, 모든 옷장 아이템을 잠금 해제해요. 구독이 아니에요. 환불은 Apple 또는 Google이 각자의 정책에 따라 처리해요."], ["빵부스러기", "빵부스러기는 금전적 가치가 없고, 교환하거나 양도할 수 없으며, 앱 내 경제가 바뀌면 조정될 수 있어요."], ["사용자 콘텐츠", "추가하고 공유하는 이름과 콘텐츠에 대한 책임은 사용자에게 있어요. 다른 사람의 개인정보를 허락 없이 공유하지 마세요."], ["서비스 제공", "앱을 안정적으로 유지하려고 노력하지만, 앱은 보증 없이 “있는 그대로” 제공돼요. 법이 허용하는 범위에서 앱 사용으로 인한 간접적인 손실에 대해 책임지지 않아요."], ["문의", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. 정성과 꽥꽥, 공정한 주사위로 만들었어요."}, "zh_Hans": {"lang_name": "简体中文", "nav_support": "帮助", "nav_privacy": "隐私", "nav_terms": "条款", "updated": "最后更新：2026-11-12", "support_title": "帮助与支持", "support_intro": "Quack Derby 能把一份名单变成一场比赛、一场锦标赛或一次转盘抽选——公平、可验证，而且离线可用。需要帮忙？给我们写信，会有真人回复你。", "contact_title": "联系方式", "contact_body": "邮箱：<a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>电话：0334044737<br>开发者：Truong Hai Ly", "faq_title": "常见问题", "faq": [["怎样确定比赛是公平的？", "每场比赛开始前，应用会显示一个秘密随机种子的简短指纹（承诺）。比赛结束后公开种子。任何人都可以把比赛代码粘贴到“验证”中，重放完全相同的比赛——如果结果被改动过，指纹就不会匹配。"], ["权重有什么作用？", "权重默认关闭，所以每个人的机会都相同。开启后，权重为 2× 的选手获胜的可能性恰好是 1× 选手的两倍。使用权重的比赛始终会显示“已加权”徽章。"], ["什么是班级模式？", "在班级名单中，被抽到的人会暂时退出，直到整份名单的人都被抽到一次。名单会显示每个人被抽到的次数。"], ["名单的照片会离开我的手机吗？", "不会。文字识别在你的设备上运行。照片不会被上传或保存。"], ["如何恢复购买？", "打开“我的”页面并点按“恢复购买”，或使用 VIP 门票页面上的按钮。请使用购买时的同一个 Apple ID 或 Google 账户。"], ["面包屑是什么？", "面包屑是一种有趣的应用内货币，可用于购买帽子、眼镜和赛道主题。通过比赛、签到和自愿观看广告获得。它们绝不会改变比赛结果，也不能用钱购买。"]], "privacy_title": "隐私政策", "privacy": [["概述", "Quack Derby 为离线使用而设计。你的名单、转盘、比赛历史和设置只保存在你的设备上。我们不运营接收你数据的服务器，你也无需注册账户。"], ["你输入的数据", "名字、备注、头像照片和转盘都保留在你的设备上。拍摄名单的文字识别在设备上完成；图片不会被上传。你选择分享的比赛代码包含该场比赛的名字，因此请只与你信任的人分享。"], ["相机和照片", "只有在你点按“名单照片”或“扫描代码”时才会使用相机。只有在你选择图片或保存结果时才会访问照片图库。你可以随时在设备设置中更改这些权限。"], ["广告", "免费版会显示 Google AdMob 的广告。AdMob 可能会收集设备标识符、广告数据、使用数据和诊断数据，用于展示和衡量广告。在 iPhone 上，我们会在任何跟踪之前征求你的许可（App Tracking Transparency）；在欧洲经济区/英国，会先显示来自 Google User Messaging Platform 的同意表单。你可以随时在“我的 › 隐私选项”中更改选择。Premium 会移除横幅广告、插页广告和开屏广告。"], ["购买", "购买由 Apple 或 Google 处理。我们永远看不到你的付款信息；我们只知道你是否拥有 Premium，以便为你解锁。"], ["儿童", "Quack Derby 是面向一般用户的应用，不针对 13 岁以下儿童。我们不会故意收集儿童的个人信息。"], ["删除你的数据", "使用“我的 › 数据 › 全部重置”，或删除应用，即可移除 Quack Derby 保存的所有数据。"], ["变更与联系", "如果本政策有变更，我们会更新上方的日期。如有疑问：haily.211194@gmail.com · 0334044737。"]], "terms_title": "使用条款", "terms": [["使用本应用", "Quack Derby 是一款用于抽选名字、分组和娱乐的工具。结果是随机的；请负责任地使用，切勿用于赌博或需要专业判断的决定。"], ["Premium", "Premium 是一次性的非消耗型购买。它会移除广告，并解锁更大的比赛、更长的锦标赛、更深的转盘、1080p 视频和全部衣橱物品。没有订阅。退款由 Apple 或 Google 按其政策处理。"], ["面包屑", "面包屑没有货币价值，不能兑换或转让，如果应用内经济调整，面包屑也可能随之调整。"], ["你的内容", "你需要对自己添加和分享的名字及内容负责。未经许可，请勿分享他人的个人信息。"], ["可用性", "我们会努力保持应用稳定可靠，但本应用按“现状”提供，不作任何保证。在法律允许的范围内，我们不对因使用本应用而产生的间接损失承担责任。"], ["联系方式", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly。用心、嘎嘎声和公平的骰子打造。"}, "zh_Hant": {"lang_name": "繁體中文", "nav_support": "說明", "nav_privacy": "隱私權", "nav_terms": "條款", "updated": "最後更新：2026-11-12", "support_title": "說明與支援", "support_intro": "Quack Derby 能把一份名單變成一場比賽、一場錦標賽或一次轉盤抽選——公平、可驗證，而且離線也能用。需要幫忙嗎？寫信給我們，會有真人回覆你。", "contact_title": "聯絡方式", "contact_body": "電子郵件：<a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>電話：0334044737<br>開發者：Truong Hai Ly", "faq_title": "常見問題", "faq": [["怎麼確定比賽是公平的？", "每場比賽開始前，App 會顯示一組秘密隨機種子的簡短指紋（承諾）。比賽結束後公開種子。任何人都能把比賽代碼貼到「驗證」中，重播完全相同的比賽——如果結果被改動過，指紋就不會相符。"], ["權重有什麼作用？", "權重預設為關閉，所以每個人的機會都相同。開啟後，權重為 2× 的選手獲勝機率剛好是 1× 選手的兩倍。使用權重的比賽一律會顯示「已加權」徽章。"], ["什麼是班級模式？", "在班級名單中，被抽到的人會暫時退出，直到整份名單的人都被抽到一次。名單會顯示每個人被抽到的次數。"], ["名單的照片會離開我的手機嗎？", "不會。文字辨識在你的裝置上執行。照片不會被上傳或保存。"], ["要怎麼恢復購買？", "開啟「我的」分頁並點按「恢復購買」，或使用 VIP 門票畫面上的按鈕。請使用購買時的同一個 Apple ID 或 Google 帳號。"], ["麵包屑是什麼？", "麵包屑是一種有趣的 App 內貨幣，可用來購買帽子、眼鏡和賽道主題。透過比賽、簽到和自願觀看廣告取得。它們絕不會改變比賽結果，也無法用錢購買。"]], "privacy_title": "隱私權政策", "privacy": [["概述", "Quack Derby 為離線使用而設計。你的名單、轉盤、比賽歷史和設定只儲存在你的裝置上。我們沒有營運接收你資料的伺服器，你也不需要帳號。"], ["你輸入的資料", "名字、備註、頭像照片和轉盤都保留在你的裝置上。拍攝名單的文字辨識在裝置上完成；圖片不會被上傳。你選擇分享的比賽代碼包含該場比賽的名字，因此請只與你信任的人分享。"], ["相機和照片", "只有在你點按「名單照片」或「掃描代碼」時才會使用相機。只有在你選擇圖片或儲存結果時才會存取照片圖庫。你可以隨時在裝置設定中變更這些權限。"], ["廣告", "免費版會顯示 Google AdMob 的廣告。AdMob 可能會收集裝置識別碼、廣告資料、使用資料和診斷資料，用於顯示和評估廣告。在 iPhone 上，我們會在任何追蹤之前徵求你的許可（App Tracking Transparency）；在歐洲經濟區／英國，會先顯示來自 Google User Messaging Platform 的同意表單。你可以隨時在「我的 › 隱私選項」中變更選擇。Premium 會移除橫幅廣告、插頁式廣告和開啟 App 時的廣告。"], ["購買", "購買由 Apple 或 Google 處理。我們永遠看不到你的付款資訊；我們只會知道你是否擁有 Premium，以便為你解鎖。"], ["兒童", "Quack Derby 是適合一般大眾的 App，並非以 13 歲以下兒童為對象。我們不會故意收集兒童的個人資料。"], ["刪除你的資料", "使用「我的 › 資料 › 全部重設」，或刪除 App，即可移除 Quack Derby 儲存的所有資料。"], ["變更與聯絡", "如果本政策有所變更，我們會更新上方的日期。如有疑問：haily.211194@gmail.com · 0334044737。"]], "terms_title": "使用條款", "terms": [["使用本 App", "Quack Derby 是一款用來抽選名字、分組和同樂的工具。結果是隨機的；請負責任地使用，切勿用於賭博或需要專業判斷的決定。"], ["Premium", "Premium 是一次性的非消耗性購買。它會移除廣告，並解鎖更大的比賽、更長的錦標賽、更深的轉盤、1080p 影片和全部衣櫥物品。沒有訂閱。退款由 Apple 或 Google 依其政策處理。"], ["麵包屑", "麵包屑沒有金錢價值，無法兌換或轉讓，若 App 內經濟有所調整，麵包屑也可能隨之調整。"], ["你的內容", "你需對自己新增和分享的名字及內容負責。未經許可，請勿分享他人的個人資料。"], ["可用性", "我們會努力維持 App 穩定可靠，但本 App 依「現狀」提供，不提供任何保證。在法律允許的範圍內，我們不對因使用本 App 而產生的間接損失負責。"], ["聯絡方式", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly。用心、呱呱聲和公平的骰子打造。"}, "es": {"lang_name": "Español", "nav_support": "Ayuda", "nav_privacy": "Privacidad", "nav_terms": "Condiciones", "updated": "Última actualización: 2026-11-12", "support_title": "Ayuda y soporte", "support_intro": "Quack Derby convierte una lista de nombres en una carrera, un torneo o un giro de ruleta: justo, verificable y sin conexión. ¿Necesitas ayuda? Escríbenos y te responderá una persona de verdad.", "contact_title": "Contacto", "contact_body": "Correo: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Teléfono: 0334044737<br>Desarrollador: Truong Hai Ly", "faq_title": "Preguntas frecuentes", "faq": [["¿Cómo puedo estar seguro de que una carrera es justa?", "Antes de cada carrera, la app muestra una huella corta (compromiso) de una semilla aleatoria secreta. Después de la carrera se revela la semilla. Cualquiera puede pegar el código de carrera en «Verificar» y repetir exactamente la misma carrera: si el resultado se hubiera cambiado, la huella no coincidiría."], ["¿Para qué sirven los pesos?", "Los pesos están desactivados por defecto, así que todos tienen la misma probabilidad. Si los activas, un corredor con peso 2× tiene exactamente el doble de probabilidades de ganar que uno con 1×. Las carreras con pesos siempre muestran la insignia «Con pesos»."], ["¿Qué es el modo clase?", "En una lista de clase, quienes ya han salido esperan hasta que toda la lista haya salido una vez. La lista muestra cuántas veces ha salido cada persona."], ["¿Las fotos de mis listas salen de mi teléfono?", "No. El reconocimiento de texto se realiza en tu dispositivo. La foto no se sube ni se guarda."], ["¿Cómo restauro mi compra?", "Abre la pestaña Yo y toca «Restaurar compras», o usa el botón de la pantalla del pase VIP. Usa el mismo ID de Apple o la misma cuenta de Google con la que compraste."], ["¿Qué son las migas?", "Las migas son una moneda divertida dentro de la app para sombreros, gafas y temas de pista. Se ganan corriendo, registrándote a diario y viendo anuncios opcionales. Nunca cambian los resultados de las carreras y no se pueden comprar con dinero."]], "privacy_title": "Política de privacidad", "privacy": [["Resumen", "Quack Derby está pensada para funcionar sin conexión. Tus listas, ruletas, historial de carreras y ajustes se guardan solo en tu dispositivo. No tenemos servidores que reciban tus datos y no necesitas una cuenta."], ["Datos que introduces", "Los nombres, notas, fotos de avatar y ruletas se quedan en tu dispositivo. El reconocimiento de texto de las listas fotografiadas se hace en el dispositivo; las imágenes no se suben. Los códigos de carrera que decidas compartir contienen los nombres de esa carrera, así que compártelos solo con personas de confianza."], ["Cámara y fotos", "La cámara solo se usa cuando tocas «Foto de una lista» o «Escanear código». El acceso a la fototeca solo se usa cuando eliges una imagen o guardas un resultado. Puedes cambiar estos permisos en los ajustes del dispositivo en cualquier momento."], ["Publicidad", "La versión gratuita muestra anuncios de Google AdMob. AdMob puede recopilar identificadores del dispositivo, datos publicitarios, de uso y de diagnóstico para mostrar y medir anuncios. En iPhone pedimos permiso antes de cualquier seguimiento (App Tracking Transparency); en el EEE y el Reino Unido aparece antes un formulario de consentimiento de la User Messaging Platform de Google. Puedes cambiar tu elección en cualquier momento en Yo › Opciones de privacidad. Premium elimina los anuncios de banner, intersticiales y de apertura de la app."], ["Compras", "Las compras las gestionan Apple o Google. Nunca vemos tus datos de pago; solo sabemos si tienes Premium para poder desbloquearlo."], ["Menores", "Quack Derby es una app para público general y no está dirigida a menores de 13 años. No recopilamos a sabiendas información personal de menores."], ["Eliminar tus datos", "Usa Yo › Datos › Restablecer todo, o elimina la app, para borrar todos los datos guardados por Quack Derby."], ["Cambios y contacto", "Si esta política cambia, actualizaremos la fecha de arriba. Preguntas: haily.211194@gmail.com · 0334044737."]], "terms_title": "Condiciones de uso", "terms": [["Uso de la app", "Quack Derby es una herramienta para elegir nombres, hacer equipos y divertirse. Los resultados son aleatorios; úsalos con responsabilidad y nunca para apuestas ni decisiones que requieran criterio profesional."], ["Premium", "Premium es una compra única no consumible. Elimina los anuncios y desbloquea carreras más grandes, torneos más largos, ruletas más profundas, vídeo 1080p y todo el vestuario. No hay suscripción. Los reembolsos los gestionan Apple o Google según sus políticas."], ["Migas", "Las migas no tienen valor monetario, no se pueden canjear ni transferir y pueden ajustarse si cambia la economía del juego."], ["Tu contenido", "Eres responsable de los nombres y el contenido que añades y compartes. No compartas información personal de otras personas sin su permiso."], ["Disponibilidad", "Nos esforzamos por que la app sea fiable, pero se ofrece «tal cual», sin garantías. En la medida en que lo permita la ley, no somos responsables de pérdidas indirectas derivadas de su uso."], ["Contacto", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Hecho con cariño, cuacs y dados justos."}, "pt": {"lang_name": "Português (Brasil)", "nav_support": "Ajuda", "nav_privacy": "Privacidade", "nav_terms": "Termos", "updated": "Última atualização: 2026-11-12", "support_title": "Ajuda e suporte", "support_intro": "Quack Derby transforma uma lista de nomes em uma corrida, um torneio ou um giro de roleta — justo, verificável e offline. Precisa de ajuda? Escreva para nós e uma pessoa de verdade vai responder.", "contact_title": "Contato", "contact_body": "E-mail: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefone: 0334044737<br>Desenvolvedor: Truong Hai Ly", "faq_title": "Perguntas frequentes", "faq": [["Como posso ter certeza de que uma corrida é justa?", "Antes de cada corrida, o app mostra uma impressão digital curta (compromisso) de uma semente aleatória secreta. Depois da corrida, a semente é revelada. Qualquer pessoa pode colar o código da corrida em “Verificar” e repetir exatamente a mesma corrida — se o resultado tivesse sido alterado, a impressão digital não bateria."], ["O que os pesos fazem?", "Os pesos vêm desligados, então todos têm a mesma chance. Quando você os liga, um competidor com peso 2× tem exatamente o dobro de chance de vencer de um com 1×. Corridas com pesos sempre mostram o selo “Com pesos”."], ["O que é o modo turma?", "Numa lista de turma, quem já foi sorteado fica de fora até a lista inteira ter sido sorteada uma vez. A lista mostra quantas vezes cada pessoa foi sorteada."], ["As fotos das minhas listas saem do meu celular?", "Não. O reconhecimento de texto roda no seu aparelho. A foto não é enviada nem guardada."], ["Como restauro minha compra?", "Abra a aba Eu e toque em “Restaurar compras”, ou use o botão na tela do ingresso VIP. Use o mesmo ID Apple ou conta Google com que você comprou."], ["O que são migalhas?", "Migalhas são uma moeda divertida do app para chapéus, óculos e temas de pista. Você as ganha correndo, fazendo check-in e assistindo a anúncios opcionais. Elas nunca mudam o resultado das corridas e não podem ser compradas com dinheiro."]], "privacy_title": "Política de privacidade", "privacy": [["Visão geral", "Quack Derby foi feito para funcionar offline. Suas listas, roletas, histórico de corridas e configurações ficam guardados só no seu aparelho. Não temos servidores que recebam seus dados e você não precisa de conta."], ["Dados que você insere", "Nomes, notas, fotos de avatar e roletas ficam no seu aparelho. O reconhecimento de texto de listas fotografadas acontece no aparelho; as imagens não são enviadas. Códigos de corrida que você decide compartilhar contêm os nomes daquela corrida, então compartilhe apenas com pessoas de confiança."], ["Câmera e fotos", "A câmera só é usada quando você toca em “Foto de uma lista” ou “Escanear código”. O acesso à fototeca só é usado quando você escolhe uma imagem ou salva um resultado. Você pode mudar essas permissões nas configurações do aparelho a qualquer momento."], ["Publicidade", "A versão gratuita mostra anúncios do Google AdMob. O AdMob pode coletar identificadores do aparelho, dados de publicidade, de uso e de diagnóstico para exibir e medir anúncios. No iPhone pedimos permissão antes de qualquer rastreamento (App Tracking Transparency); no EEE/Reino Unido, aparece antes um formulário de consentimento da User Messaging Platform do Google. Você pode mudar sua escolha a qualquer momento em Eu › Opções de privacidade. O Premium remove anúncios de banner, intersticiais e de abertura do app."], ["Compras", "As compras são processadas pela Apple ou pelo Google. Nunca vemos seus dados de pagamento; só sabemos se você tem o Premium para poder liberá-lo."], ["Crianças", "Quack Derby é um app para o público em geral e não é direcionado a crianças menores de 13 anos. Não coletamos intencionalmente informações pessoais de crianças."], ["Excluir seus dados", "Use Eu › Dados › Redefinir tudo, ou exclua o app, para remover todos os dados guardados pelo Quack Derby."], ["Mudanças e contato", "Se esta política mudar, atualizaremos a data acima. Dúvidas: haily.211194@gmail.com · 0334044737."]], "terms_title": "Termos de uso", "terms": [["Uso do app", "Quack Derby é uma ferramenta para sortear nomes, formar times e se divertir. Os resultados são aleatórios; use-os com responsabilidade e nunca para apostas ou decisões que exijam julgamento profissional."], ["Premium", "O Premium é uma compra única, não consumível. Ele remove os anúncios e libera corridas maiores, torneios mais longos, roletas mais profundas, vídeo 1080p e todo o guarda-roupa. Não há assinatura. Reembolsos são tratados pela Apple ou pelo Google de acordo com as políticas deles."], ["Migalhas", "Migalhas não têm valor monetário, não podem ser trocadas nem transferidas e podem ser ajustadas se a economia do app mudar."], ["Seu conteúdo", "Você é responsável pelos nomes e conteúdos que adiciona e compartilha. Não compartilhe informações pessoais de outras pessoas sem permissão."], ["Disponibilidade", "Trabalhamos para manter o app confiável, mas ele é fornecido “no estado em que se encontra”, sem garantias. Na medida permitida por lei, não nos responsabilizamos por perdas indiretas decorrentes do seu uso."], ["Contato", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Feito com carinho, quás e dados justos."}, "fr": {"lang_name": "Français", "nav_support": "Aide", "nav_privacy": "Confidentialité", "nav_terms": "Conditions", "updated": "Dernière mise à jour : 2026-11-12", "support_title": "Aide et assistance", "support_intro": "Quack Derby transforme une liste de noms en course, en tournoi ou en tour de roue — équitable, vérifiable et hors ligne. Besoin d’un coup de main ? Écris-nous, une vraie personne te répondra.", "contact_title": "Contact", "contact_body": "E-mail : <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Téléphone : 0334044737<br>Développeur : Truong Hai Ly", "faq_title": "Questions fréquentes", "faq": [["Comment être sûr qu’une course est équitable ?", "Avant chaque course, l’app affiche une courte empreinte (engagement) d’une graine aléatoire secrète. Après la course, la graine est révélée. N’importe qui peut coller le code de course dans « Vérifier » et rejouer exactement la même course — si le résultat avait été modifié, l’empreinte ne correspondrait pas."], ["À quoi servent les poids ?", "Les poids sont désactivés par défaut : tout le monde a la même chance. Si tu les actives, un coureur de poids 2× a exactement deux fois plus de chances de gagner qu’un coureur de poids 1×. Les courses pondérées affichent toujours un badge « Pondéré »."], ["Qu’est-ce que le mode classe ?", "Dans une liste de classe, les personnes déjà tirées attendent que toute la liste ait été tirée une fois. La liste indique combien de fois chaque personne a été tirée."], ["Les photos de mes listes quittent-elles mon téléphone ?", "Non. La reconnaissance de texte s’effectue sur ton appareil. La photo n’est ni envoyée ni conservée."], ["Comment restaurer mon achat ?", "Ouvre l’onglet Moi et touche « Restaurer les achats », ou utilise le bouton de l’écran du ticket VIP. Utilise le même identifiant Apple ou compte Google que lors de l’achat."], ["Que sont les miettes ?", "Les miettes sont une monnaie ludique dans l’app pour des chapeaux, des lunettes et des thèmes de piste. Tu les gagnes en courant, en pointant chaque jour et en regardant des pubs facultatives. Elles ne changent jamais le résultat des courses et ne s’achètent pas avec de l’argent."]], "privacy_title": "Politique de confidentialité", "privacy": [["Aperçu", "Quack Derby est conçue pour fonctionner hors ligne. Tes listes, roues, historique de courses et réglages sont stockés uniquement sur ton appareil. Nous n’exploitons aucun serveur qui reçoit tes données, et aucun compte n’est nécessaire."], ["Données que tu saisis", "Les noms, notes, photos d’avatar et roues restent sur ton appareil. La reconnaissance de texte des listes photographiées a lieu sur l’appareil ; les images ne sont pas envoyées. Les codes de course que tu choisis de partager contiennent les noms de cette course : ne les partage qu’avec des personnes de confiance."], ["Appareil photo et photos", "L’appareil photo n’est utilisé que lorsque tu touches « Photo d’une liste » ou « Scanner un code ». L’accès à la photothèque n’est utilisé que lorsque tu choisis une image ou enregistres un résultat. Tu peux modifier ces autorisations à tout moment dans les réglages de ton appareil."], ["Publicité", "La version gratuite affiche des publicités Google AdMob. AdMob peut collecter des identifiants d’appareil, des données publicitaires, d’utilisation et de diagnostic pour afficher et mesurer les annonces. Sur iPhone, nous demandons l’autorisation avant tout suivi (App Tracking Transparency) ; dans l’EEE et au Royaume-Uni, un formulaire de consentement de la User Messaging Platform de Google s’affiche d’abord. Tu peux modifier ton choix à tout moment dans Moi › Choix de confidentialité. Premium supprime les bannières, les interstitiels et les publicités à l’ouverture de l’app."], ["Achats", "Les achats sont gérés par Apple ou Google. Nous ne voyons jamais tes informations de paiement ; nous savons seulement si Premium est acquis afin de le débloquer."], ["Enfants", "Quack Derby est une app tous publics qui ne s’adresse pas aux enfants de moins de 13 ans. Nous ne collectons pas sciemment d’informations personnelles concernant des enfants."], ["Supprimer tes données", "Utilise Moi › Données › Tout réinitialiser, ou supprime l’app, pour effacer toutes les données stockées par Quack Derby."], ["Modifications et contact", "Si cette politique change, nous mettrons à jour la date ci-dessus. Questions : haily.211194@gmail.com · 0334044737."]], "terms_title": "Conditions d’utilisation", "terms": [["Utilisation de l’app", "Quack Derby est un outil pour tirer des noms au sort, former des équipes et s’amuser. Les résultats sont aléatoires ; utilise-les de façon responsable et jamais pour des jeux d’argent ou des décisions nécessitant un jugement professionnel."], ["Premium", "Premium est un achat unique non consommable. Il supprime les publicités et débloque des courses plus grandes, des tournois plus longs, des roues plus profondes, la vidéo 1080p et toute la garde-robe. Il n’y a pas d’abonnement. Les remboursements sont gérés par Apple ou Google selon leurs politiques."], ["Miettes", "Les miettes n’ont aucune valeur monétaire, ne peuvent être ni échangées ni transférées et peuvent être ajustées si l’économie du jeu évolue."], ["Ton contenu", "Tu es responsable des noms et contenus que tu ajoutes et partages. Ne partage pas les informations personnelles d’autrui sans autorisation."], ["Disponibilité", "Nous faisons de notre mieux pour que l’app soit fiable, mais elle est fournie « en l’état », sans garantie. Dans les limites autorisées par la loi, nous ne sommes pas responsables des pertes indirectes liées à son utilisation."], ["Contact", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Fait avec soin, des coin-coin et des dés honnêtes."}, "de": {"lang_name": "Deutsch", "nav_support": "Hilfe", "nav_privacy": "Datenschutz", "nav_terms": "Bedingungen", "updated": "Zuletzt aktualisiert: 2026-11-12", "support_title": "Hilfe & Support", "support_intro": "Quack Derby macht aus einer Namensliste ein Rennen, ein Turnier oder einen Dreh am Glücksrad – fair, überprüfbar und offline. Brauchst du Hilfe? Schreib uns, und ein echter Mensch antwortet dir.", "contact_title": "Kontakt", "contact_body": "E-Mail: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Entwickler: Truong Hai Ly", "faq_title": "Häufige Fragen", "faq": [["Wie kann ich sicher sein, dass ein Rennen fair ist?", "Vor jedem Rennen zeigt die App einen kurzen Fingerabdruck (Festlegung) eines geheimen Zufallswerts. Nach dem Rennen wird der Zufallswert enthüllt. Jeder kann den Renncode unter „Prüfen“ einfügen und genau dasselbe Rennen abspielen – wäre das Ergebnis verändert worden, würde der Fingerabdruck nicht passen."], ["Was bewirken Gewichte?", "Gewichte sind standardmäßig aus, sodass alle die gleiche Chance haben. Wenn du sie einschaltest, gewinnt ein Teilnehmer mit Gewicht 2× genau doppelt so wahrscheinlich wie einer mit 1×. Rennen mit Gewichtung zeigen immer ein „Gewichtet“-Abzeichen."], ["Was ist der Klassenmodus?", "In einer Klassenliste setzen bereits gewählte Personen aus, bis die ganze Liste einmal dran war. Die Liste zeigt, wie oft jede Person gewählt wurde."], ["Verlassen Fotos meiner Listen mein Handy?", "Nein. Die Texterkennung läuft auf deinem Gerät. Das Foto wird weder hochgeladen noch gespeichert."], ["Wie stelle ich meinen Kauf wieder her?", "Öffne den Tab „Ich“ und tippe auf „Käufe wiederherstellen“ oder nutze die Schaltfläche auf dem VIP-Ticket. Verwende dieselbe Apple-ID bzw. dasselbe Google-Konto wie beim Kauf."], ["Was sind Krümel?", "Krümel sind eine spaßige In-App-Währung für Hüte, Brillen und Streckendesigns. Du verdienst sie durch Rennen, Einchecken und optionale Werbevideos. Sie ändern nie Rennergebnisse und können nicht mit Geld gekauft werden."]], "privacy_title": "Datenschutzerklärung", "privacy": [["Überblick", "Quack Derby ist für den Offline-Betrieb gebaut. Deine Listen, Räder, dein Rennverlauf und deine Einstellungen werden nur auf deinem Gerät gespeichert. Wir betreiben keine Server, die deine Daten empfangen, und du brauchst kein Konto."], ["Von dir eingegebene Daten", "Namen, Notizen, Avatarfotos und Räder bleiben auf deinem Gerät. Die Texterkennung für fotografierte Listen erfolgt auf dem Gerät; Bilder werden nicht hochgeladen. Renncodes, die du teilst, enthalten die Namen dieses Rennens – teile sie also nur mit Personen, denen du vertraust."], ["Kamera und Fotos", "Die Kamera wird nur verwendet, wenn du auf „Foto einer Liste“ oder „Code scannen“ tippst. Der Zugriff auf die Fotomediathek wird nur genutzt, wenn du ein Bild auswählst oder ein Ergebnis speicherst. Du kannst diese Berechtigungen jederzeit in den Geräteeinstellungen ändern."], ["Werbung", "Die kostenlose Version zeigt Werbung von Google AdMob. AdMob kann Gerätekennungen, Werbedaten sowie Nutzungs- und Diagnosedaten erfassen, um Anzeigen auszuliefern und zu messen. Auf dem iPhone fragen wir vor jedem Tracking um Erlaubnis (App Tracking Transparency); im EWR/Vereinigten Königreich erscheint zuerst ein Einwilligungsformular der User Messaging Platform von Google. Du kannst deine Wahl jederzeit unter Ich › Datenschutzoptionen ändern. Premium entfernt Banner-, Interstitial- und App-Start-Werbung."], ["Käufe", "Käufe werden von Apple oder Google abgewickelt. Wir sehen deine Zahlungsdaten nie; wir erfahren nur, ob Premium erworben wurde, damit wir es freischalten können."], ["Kinder", "Quack Derby ist eine App für ein allgemeines Publikum und richtet sich nicht an Kinder unter 13 Jahren. Wir erheben nicht wissentlich personenbezogene Daten von Kindern."], ["Deine Daten löschen", "Nutze Ich › Daten › Alles zurücksetzen oder lösche die App, um alle von Quack Derby gespeicherten Daten zu entfernen."], ["Änderungen und Kontakt", "Wenn sich diese Erklärung ändert, aktualisieren wir das Datum oben. Fragen: haily.211194@gmail.com · 0334044737."]], "terms_title": "Nutzungsbedingungen", "terms": [["Nutzung der App", "Quack Derby ist ein Werkzeug zum Auslosen von Namen, Bilden von Teams und für Spaß. Die Ergebnisse sind zufällig; nutze sie verantwortungsvoll und niemals für Glücksspiel oder Entscheidungen, die fachliches Urteil erfordern."], ["Premium", "Premium ist ein einmaliger, nicht verbrauchbarer Kauf. Er entfernt Werbung und schaltet größere Rennen, längere Turniere, tiefere Räder, 1080p-Video und die ganze Garderobe frei. Es gibt kein Abo. Erstattungen werden von Apple oder Google nach deren Richtlinien bearbeitet."], ["Krümel", "Krümel haben keinen Geldwert, können nicht eingetauscht oder übertragen werden und können angepasst werden, wenn sich das Spielsystem ändert."], ["Deine Inhalte", "Du bist für die Namen und Inhalte verantwortlich, die du hinzufügst und teilst. Teile keine personenbezogenen Daten anderer ohne deren Erlaubnis."], ["Verfügbarkeit", "Wir arbeiten hart daran, die App zuverlässig zu halten, sie wird jedoch „wie besehen“ ohne Gewährleistung bereitgestellt. Soweit gesetzlich zulässig, haften wir nicht für indirekte Schäden aus ihrer Nutzung."], ["Kontakt", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Gemacht mit Sorgfalt, Quaks und fairen Würfeln."}, "it": {"lang_name": "Italiano", "nav_support": "Aiuto", "nav_privacy": "Privacy", "nav_terms": "Termini", "updated": "Ultimo aggiornamento: 2026-11-12", "support_title": "Aiuto e supporto", "support_intro": "Quack Derby trasforma una lista di nomi in una gara, un torneo o un giro di ruota — in modo equo, verificabile e offline. Hai bisogno di aiuto? Scrivici e ti risponderà una persona vera.", "contact_title": "Contatti", "contact_body": "Email: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefono: 0334044737<br>Sviluppatore: Truong Hai Ly", "faq_title": "Domande frequenti", "faq": [["Come posso essere sicuro che una gara sia equa?", "Prima di ogni gara l’app mostra una breve impronta (impegno) di un seme casuale segreto. Dopo la gara il seme viene rivelato. Chiunque può incollare il codice gara in “Verifica” e rigiocare la stessa identica gara — se il risultato fosse stato cambiato, l’impronta non corrisponderebbe."], ["A cosa servono i pesi?", "I pesi sono disattivati per impostazione predefinita, quindi tutti hanno le stesse possibilità. Se li attivi, un concorrente con peso 2× ha esattamente il doppio delle probabilità di vincere rispetto a uno con 1×. Le gare con pesi mostrano sempre il badge “Con pesi”."], ["Cos’è la modalità classe?", "In una lista di classe, chi viene scelto si mette da parte finché tutta la lista non è stata scelta una volta. La lista mostra quante volte ogni persona è stata scelta."], ["Le foto delle mie liste lasciano il telefono?", "No. Il riconoscimento del testo avviene sul tuo dispositivo. La foto non viene caricata né conservata."], ["Come ripristino il mio acquisto?", "Apri la scheda Io e tocca “Ripristina acquisti”, oppure usa il pulsante nella schermata del biglietto VIP. Usa lo stesso ID Apple o account Google con cui hai acquistato."], ["Cosa sono le briciole?", "Le briciole sono una valuta divertente dell’app per cappelli, occhiali e temi delle piste. Le guadagni gareggiando, facendo il check-in e guardando annunci facoltativi. Non cambiano mai i risultati delle gare e non si possono comprare con denaro."]], "privacy_title": "Informativa sulla privacy", "privacy": [["Panoramica", "Quack Derby è pensata per funzionare offline. Le tue liste, ruote, la cronologia delle gare e le impostazioni sono salvate solo sul tuo dispositivo. Non gestiamo server che ricevono i tuoi dati e non hai bisogno di un account."], ["Dati che inserisci", "Nomi, note, foto avatar e ruote restano sul tuo dispositivo. Il riconoscimento del testo delle liste fotografate avviene sul dispositivo; le immagini non vengono caricate. I codici gara che scegli di condividere contengono i nomi di quella gara, quindi condividili solo con persone di cui ti fidi."], ["Fotocamera e foto", "La fotocamera viene usata solo quando tocchi “Foto di una lista” o “Scansiona codice”. L’accesso alla libreria foto viene usato solo quando scegli un’immagine o salvi un risultato. Puoi modificare questi permessi nelle impostazioni del dispositivo in qualsiasi momento."], ["Pubblicità", "La versione gratuita mostra annunci di Google AdMob. AdMob può raccogliere identificatori del dispositivo, dati pubblicitari, dati di utilizzo e diagnostici per mostrare e misurare gli annunci. Su iPhone chiediamo il permesso prima di qualsiasi tracciamento (App Tracking Transparency); nel SEE/Regno Unito appare prima un modulo di consenso della User Messaging Platform di Google. Puoi cambiare la tua scelta in qualsiasi momento in Io › Scelte sulla privacy. Premium rimuove banner, annunci interstitial e annunci all’apertura dell’app."], ["Acquisti", "Gli acquisti sono gestiti da Apple o Google. Non vediamo mai i tuoi dati di pagamento; sappiamo solo se possiedi Premium per poterlo sbloccare."], ["Bambini", "Quack Derby è un’app per un pubblico generale e non è rivolta ai bambini sotto i 13 anni. Non raccogliamo consapevolmente informazioni personali dai bambini."], ["Eliminare i tuoi dati", "Usa Io › Dati › Ripristina tutto, oppure elimina l’app, per rimuovere tutti i dati salvati da Quack Derby."], ["Modifiche e contatti", "Se questa informativa cambia aggiorneremo la data qui sopra. Domande: haily.211194@gmail.com · 0334044737."]], "terms_title": "Termini di utilizzo", "terms": [["Uso dell’app", "Quack Derby è uno strumento per estrarre nomi, creare squadre e divertirsi. I risultati sono casuali; usali in modo responsabile e mai per il gioco d’azzardo o per decisioni che richiedono un giudizio professionale."], ["Premium", "Premium è un acquisto unico e non consumabile. Rimuove la pubblicità e sblocca gare più grandi, tornei più lunghi, ruote più profonde, video 1080p e tutti gli oggetti del guardaroba. Non c’è abbonamento. I rimborsi sono gestiti da Apple o Google secondo le loro politiche."], ["Briciole", "Le briciole non hanno valore monetario, non possono essere scambiate né trasferite e possono essere modificate se l’economia dell’app cambia."], ["I tuoi contenuti", "Sei responsabile dei nomi e dei contenuti che aggiungi e condividi. Non condividere informazioni personali di altri senza il loro permesso."], ["Disponibilità", "Ci impegniamo a mantenere l’app affidabile, ma è fornita “così com’è” senza garanzie. Nei limiti consentiti dalla legge non siamo responsabili per perdite indirette derivanti dal suo utilizzo."], ["Contatti", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Fatto con cura, qua qua e dadi onesti."}, "ru": {"lang_name": "Русский", "nav_support": "Помощь", "nav_privacy": "Конфиденциальность", "nav_terms": "Условия", "updated": "Последнее обновление: 2026-11-12", "support_title": "Помощь и поддержка", "support_intro": "Quack Derby превращает список имён в гонку, турнир или вращение колеса — честно, проверяемо и офлайн. Нужна помощь? Напишите нам, и ответит живой человек.", "contact_title": "Контакты", "contact_body": "Эл. почта: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Телефон: 0334044737<br>Разработчик: Truong Hai Ly", "faq_title": "Частые вопросы", "faq": [["Как убедиться, что гонка честная?", "Перед каждой гонкой приложение показывает короткий отпечаток (обязательство) секретного случайного зерна. После гонки зерно раскрывается. Любой может вставить код гонки в «Проверить» и воспроизвести точно такую же гонку — если бы результат изменили, отпечаток бы не совпал."], ["Что делают веса?", "По умолчанию веса выключены, и у всех одинаковые шансы. Если их включить, участник с весом 2× имеет ровно вдвое больше шансов на победу, чем участник с 1×. На гонках с весами всегда показывается значок «С весами»."], ["Что такое режим класса?", "В списке класса выбранные люди отходят в сторону, пока весь список не будет выбран по одному разу. В списке видно, сколько раз выбирали каждого."], ["Покидают ли фото моих списков телефон?", "Нет. Распознавание текста выполняется на вашем устройстве. Фото не загружается и не хранится."], ["Как восстановить покупку?", "Откройте вкладку «Я» и нажмите «Восстановить покупки» или воспользуйтесь кнопкой на экране VIP-билета. Используйте тот же Apple ID или аккаунт Google, с которого совершали покупку."], ["Что такое крошки?", "Крошки — это забавная внутриигровая валюта для шляп, очков и тем трасс. Их можно заработать гонками, ежедневными отметками и просмотром необязательной рекламы. Они никогда не влияют на результаты гонок и не продаются за деньги."]], "privacy_title": "Политика конфиденциальности", "privacy": [["Обзор", "Quack Derby создано для работы офлайн. Ваши списки, колёса, история гонок и настройки хранятся только на вашем устройстве. У нас нет серверов, получающих ваши данные, и аккаунт вам не нужен."], ["Данные, которые вы вводите", "Имена, заметки, фото-аватары и колёса остаются на вашем устройстве. Распознавание текста сфотографированных списков происходит на устройстве; изображения не загружаются. Коды гонок, которыми вы решите поделиться, содержат имена участников этой гонки, поэтому делитесь ими только с теми, кому доверяете."], ["Камера и фото", "Камера используется, только когда вы нажимаете «Фото списка» или «Сканировать код». Доступ к медиатеке используется, только когда вы выбираете изображение или сохраняете результат. Эти разрешения можно изменить в настройках устройства в любое время."], ["Реклама", "В бесплатной версии показывается реклама Google AdMob. AdMob может собирать идентификаторы устройства, рекламные данные, данные об использовании и диагностике, чтобы показывать и измерять рекламу. На iPhone мы запрашиваем разрешение перед любым отслеживанием (App Tracking Transparency); в ЕЭЗ и Великобритании сначала появляется форма согласия от User Messaging Platform Google. Вы можете изменить свой выбор в любое время в разделе Я › Настройки конфиденциальности. Premium убирает баннеры, полноэкранную рекламу и рекламу при открытии приложения."], ["Покупки", "Покупки обрабатывают Apple или Google. Мы никогда не видим ваши платёжные данные; мы узнаём только, приобретён ли Premium, чтобы его разблокировать."], ["Дети", "Quack Derby — приложение для широкой аудитории, не предназначенное для детей младше 13 лет. Мы сознательно не собираем личную информацию детей."], ["Удаление данных", "Используйте Я › Данные › Сбросить всё или удалите приложение, чтобы стереть все данные, хранящиеся в Quack Derby."], ["Изменения и контакты", "Если эта политика изменится, мы обновим дату выше. Вопросы: haily.211194@gmail.com · 0334044737."]], "terms_title": "Условия использования", "terms": [["Использование приложения", "Quack Derby — инструмент для выбора имён, формирования команд и веселья. Результаты случайны; пожалуйста, используйте их ответственно и никогда — для азартных игр или решений, требующих профессиональной оценки."], ["Premium", "Premium — разовая непотребляемая покупка. Она убирает рекламу и открывает большие гонки, более длинные турниры, более глубокие колёса, видео 1080p и все предметы гардероба. Подписки нет. Возвраты осуществляются Apple или Google согласно их правилам."], ["Крошки", "Крошки не имеют денежной ценности, не подлежат обмену или передаче и могут быть скорректированы при изменении экономики приложения."], ["Ваш контент", "Вы несёте ответственность за имена и контент, которые добавляете и которыми делитесь. Не делитесь личной информацией других людей без их разрешения."], ["Доступность", "Мы стараемся поддерживать надёжную работу приложения, но оно предоставляется «как есть» без гарантий. В пределах, допускаемых законом, мы не несём ответственности за косвенные убытки, возникшие в связи с его использованием."], ["Контакты", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Сделано с заботой, кряканьем и честными кубиками."}, "ar": {"lang_name": "العربية", "nav_support": "المساعدة", "nav_privacy": "الخصوصية", "nav_terms": "الشروط", "updated": "آخر تحديث: 2026-11-12", "support_title": "المساعدة والدعم", "support_intro": "يحوّل Quack Derby قائمة أسماء إلى سباق أو بطولة أو دورة عجلة — بعدل وقابلية للتحقق ودون اتصال. تحتاج إلى مساعدة؟ راسلنا وسيجيبك شخص حقيقي.", "contact_title": "التواصل", "contact_body": "البريد الإلكتروني: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>الهاتف: 0334044737<br>المطوّر: Truong Hai Ly", "faq_title": "الأسئلة الشائعة", "faq": [["كيف أتأكد من أن السباق عادل؟", "قبل كل سباق يعرض التطبيق بصمة قصيرة (التزامًا) لبذرة عشوائية سرية. بعد السباق تُكشف البذرة. يمكن لأي شخص لصق رمز السباق في «تحقّق» وإعادة تشغيل السباق نفسه تمامًا — ولو تغيّرت النتيجة لما تطابقت البصمة."], ["ماذا تفعل الأوزان؟", "الأوزان معطّلة افتراضيًا، فيحظى الجميع بالفرصة نفسها. عند تفعيلها، يكون المتسابق ذو الوزن 2× أرجح للفوز بضعف المتسابق ذي الوزن 1× تمامًا. وتعرض السباقات ذات الأوزان دائمًا شارة «بأوزان»."], ["ما هو وضع الصف؟", "في قائمة الصف، يتنحّى من يُختار جانبًا حتى تُختار القائمة كلها مرة واحدة. وتعرض القائمة عدد مرات اختيار كل شخص."], ["هل تغادر صور قوائمي هاتفي؟", "لا. يجري التعرّف على النص على جهازك. ولا تُرفع الصورة ولا تُحفظ."], ["كيف أستعيد مشترياتي؟", "افتح تبويب «أنا» واضغط «استعادة المشتريات»، أو استخدم الزر في شاشة تذكرة VIP. استخدم معرّف Apple أو حساب Google نفسه الذي اشتريت به."], ["ما هو الفتات؟", "الفتات عملة مرحة داخل التطبيق للقبعات والنظارات وسمات المسارات. تكسبه بالتسابق وتسجيل الحضور ومشاهدة الإعلانات الاختيارية. لا يغيّر نتائج السباقات أبدًا ولا يمكن شراؤه بالمال."]], "privacy_title": "سياسة الخصوصية", "privacy": [["نظرة عامة", "صُمّم Quack Derby ليعمل دون اتصال. تُحفظ قوائمك وعجلاتك وسجل سباقاتك وإعداداتك على جهازك فقط. لا نشغّل خوادم تستقبل بياناتك، ولا تحتاج إلى حساب."], ["البيانات التي تُدخلها", "تبقى الأسماء والملاحظات والصور الرمزية والعجلات على جهازك. يجري التعرّف على نص القوائم المصوّرة على الجهاز؛ ولا تُرفع الصور. رموز السباقات التي تختار مشاركتها تحتوي على أسماء ذلك السباق، فلا تشاركها إلا مع من تثق بهم."], ["الكاميرا والصور", "لا تُستخدم الكاميرا إلا عند الضغط على «صورة لقائمة» أو «مسح الرمز». ولا يُستخدم الوصول إلى مكتبة الصور إلا عند اختيار صورة أو حفظ نتيجة. يمكنك تغيير هذه الأذونات من إعدادات جهازك في أي وقت."], ["الإعلانات", "تعرض النسخة المجانية إعلانات من Google AdMob. قد يجمع AdMob معرّفات الجهاز وبيانات الإعلانات وبيانات الاستخدام والتشخيص لعرض الإعلانات وقياسها. على iPhone نطلب الإذن قبل أي تتبع (App Tracking Transparency)؛ وفي المنطقة الاقتصادية الأوروبية والمملكة المتحدة يظهر أولًا نموذج موافقة من User Messaging Platform التابعة لـ Google. يمكنك تغيير اختيارك في أي وقت من أنا › خيارات الخصوصية. يزيل Premium إعلانات البانر والإعلانات البينية وإعلانات فتح التطبيق."], ["المشتريات", "تتولى Apple أو Google معالجة المشتريات. لا نرى أبدًا تفاصيل الدفع الخاصة بك؛ نعرف فقط ما إذا كنت تملك Premium لنتمكن من فتحه."], ["الأطفال", "Quack Derby تطبيق موجّه للجمهور العام وليس موجّهًا للأطفال دون 13 عامًا. لا نجمع عن علم أي معلومات شخصية من الأطفال."], ["حذف بياناتك", "استخدم أنا › البيانات › إعادة ضبط كل شيء، أو احذف التطبيق، لإزالة كل البيانات التي يخزّنها Quack Derby."], ["التغييرات والتواصل", "إذا تغيّرت هذه السياسة فسنحدّث التاريخ أعلاه. للأسئلة: haily.211194@gmail.com · 0334044737."]], "terms_title": "شروط الاستخدام", "terms": [["استخدام التطبيق", "Quack Derby أداة لاختيار الأسماء وتكوين الفرق والاستمتاع. النتائج عشوائية؛ يُرجى استخدامها بمسؤولية وعدم استخدامها أبدًا في المقامرة أو في قرارات تتطلب حكمًا مهنيًا."], ["Premium", "Premium عملية شراء لمرة واحدة غير قابلة للاستهلاك. يزيل الإعلانات ويفتح سباقات أكبر وبطولات أطول وعجلات أعمق وفيديو 1080p وكل قطع الخزانة. لا يوجد اشتراك. تتولى Apple أو Google المبالغ المستردة وفق سياساتهما."], ["الفتات", "ليس للفتات أي قيمة مالية، ولا يمكن استبداله أو نقله، وقد يُعدَّل إذا تغيّر اقتصاد التطبيق."], ["محتواك", "أنت مسؤول عن الأسماء والمحتوى الذي تضيفه وتشاركه. لا تشارك المعلومات الشخصية للآخرين دون إذنهم."], ["التوفّر", "نعمل بجد لإبقاء التطبيق موثوقًا، لكنه مقدَّم «كما هو» دون ضمانات. وبالقدر الذي يسمح به القانون، لسنا مسؤولين عن الخسائر غير المباشرة الناشئة عن استخدامه."], ["التواصل", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. صُنع بعناية وبطبطة ونرد عادل."}, "hi": {"lang_name": "हिन्दी", "nav_support": "मदद", "nav_privacy": "गोपनीयता", "nav_terms": "शर्तें", "updated": "अंतिम अपडेट: 2026-11-12", "support_title": "मदद और सहायता", "support_intro": "Quack Derby नामों की सूची को रेस, टूर्नामेंट या पहिये के घुमाव में बदल देता है — निष्पक्ष, सत्यापन योग्य और ऑफ़लाइन। मदद चाहिए? हमें लिखें, एक असली इंसान जवाब देगा।", "contact_title": "संपर्क", "contact_body": "ईमेल: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>फ़ोन: 0334044737<br>डेवलपर: Truong Hai Ly", "faq_title": "अक्सर पूछे जाने वाले सवाल", "faq": [["मैं कैसे पक्का करूँ कि रेस निष्पक्ष है?", "हर रेस से पहले ऐप एक गुप्त रैंडम सीड का छोटा फ़िंगरप्रिंट (प्रतिबद्धता) दिखाता है। रेस के बाद सीड बताया जाता है। कोई भी रेस कोड को “सत्यापित करें” में पेस्ट करके हूबहू वही रेस फिर चला सकता है — अगर नतीजा बदला गया होता, तो फ़िंगरप्रिंट मेल नहीं खाता।"], ["वज़न क्या करते हैं?", "वज़न डिफ़ॉल्ट रूप से बंद होते हैं, इसलिए सबका मौका बराबर होता है। उन्हें चालू करने पर 2× वज़न वाले रेसर के जीतने की संभावना 1× वाले से ठीक दोगुनी होती है। वज़न वाली रेस पर हमेशा “वज़न सहित” बैज दिखता है।"], ["क्लास मोड क्या है?", "क्लास सूची में चुने गए लोग तब तक किनारे रहते हैं जब तक पूरी सूची एक बार न चुन ली जाए। सूची दिखाती है कि हर व्यक्ति कितनी बार चुना गया।"], ["क्या मेरी सूचियों की फ़ोटो मेरे फ़ोन से बाहर जाती हैं?", "नहीं। टेक्स्ट पहचान आपके डिवाइस पर चलती है। फ़ोटो न अपलोड होती है, न रखी जाती है।"], ["मैं अपनी ख़रीदारी कैसे बहाल करूँ?", "“मैं” टैब खोलें और “ख़रीदारी बहाल करें” टैप करें, या VIP टिकट स्क्रीन पर बटन इस्तेमाल करें। वही Apple ID या Google खाता इस्तेमाल करें जिससे आपने ख़रीदा था।"], ["चूरा क्या है?", "चूरा टोपियों, चश्मों और ट्रैक थीम के लिए ऐप की एक मज़ेदार मुद्रा है। आप इसे रेस करके, चेक-इन करके और वैकल्पिक विज्ञापन देखकर कमाते हैं। यह कभी रेस के नतीजे नहीं बदलता और पैसों से नहीं ख़रीदा जा सकता।"]], "privacy_title": "गोपनीयता नीति", "privacy": [["सारांश", "Quack Derby ऑफ़लाइन काम करने के लिए बना है। आपकी सूचियाँ, पहिये, रेस इतिहास और सेटिंग्स केवल आपके डिवाइस पर संग्रहीत होती हैं। हम ऐसे सर्वर नहीं चलाते जो आपका डेटा प्राप्त करें, और आपको खाते की ज़रूरत नहीं है।"], ["आपके द्वारा डाला गया डेटा", "नाम, नोट, अवतार फ़ोटो और पहिये आपके डिवाइस पर रहते हैं। फ़ोटो खींची गई सूचियों की टेक्स्ट पहचान डिवाइस पर होती है; इमेज अपलोड नहीं होतीं। आप जो रेस कोड शेयर करते हैं उनमें उस रेस के नाम होते हैं, इसलिए उन्हें केवल भरोसेमंद लोगों से ही शेयर करें।"], ["कैमरा और फ़ोटो", "कैमरा केवल तब इस्तेमाल होता है जब आप “सूची की फ़ोटो” या “कोड स्कैन करें” टैप करते हैं। फ़ोटो लाइब्रेरी की पहुँच केवल तब इस्तेमाल होती है जब आप कोई इमेज चुनते हैं या नतीजा सहेजते हैं। आप ये अनुमतियाँ कभी भी डिवाइस सेटिंग्स में बदल सकते हैं।"], ["विज्ञापन", "मुफ़्त संस्करण Google AdMob के विज्ञापन दिखाता है। विज्ञापन दिखाने और मापने के लिए AdMob डिवाइस पहचानकर्ता, विज्ञापन डेटा, उपयोग और डायग्नोस्टिक डेटा एकत्र कर सकता है। iPhone पर हम किसी भी ट्रैकिंग से पहले अनुमति माँगते हैं (App Tracking Transparency); EEA/UK में पहले Google के User Messaging Platform का सहमति फ़ॉर्म दिखता है। आप अपनी पसंद कभी भी मैं › गोपनीयता विकल्प में बदल सकते हैं। Premium बैनर, इंटरस्टीशियल और ऐप-खुलने वाले विज्ञापन हटा देता है।"], ["ख़रीदारी", "ख़रीदारी Apple या Google द्वारा संभाली जाती है। हम आपके भुगतान विवरण कभी नहीं देखते; हमें केवल यह पता चलता है कि Premium आपके पास है या नहीं, ताकि उसे अनलॉक कर सकें।"], ["बच्चे", "Quack Derby सामान्य दर्शकों के लिए ऐप है और 13 वर्ष से कम उम्र के बच्चों के लिए नहीं है। हम जानबूझकर बच्चों से व्यक्तिगत जानकारी एकत्र नहीं करते।"], ["अपना डेटा हटाना", "Quack Derby द्वारा संग्रहीत सारा डेटा हटाने के लिए मैं › डेटा › सब रीसेट करें इस्तेमाल करें, या ऐप हटा दें।"], ["बदलाव और संपर्क", "अगर यह नीति बदलती है तो हम ऊपर की तारीख़ अपडेट करेंगे। सवाल: haily.211194@gmail.com · 0334044737।"]], "terms_title": "उपयोग की शर्तें", "terms": [["ऐप का उपयोग", "Quack Derby नाम चुनने, टीमें बनाने और मज़े करने का एक टूल है। नतीजे रैंडम होते हैं; कृपया इनका ज़िम्मेदारी से उपयोग करें और कभी भी जुए या पेशेवर निर्णय माँगने वाले फ़ैसलों के लिए नहीं।"], ["Premium", "Premium एक बार की, नॉन-कंज़्यूमेबल ख़रीदारी है। यह विज्ञापन हटाता है और बड़ी रेस, लंबे टूर्नामेंट, गहरे पहिये, 1080p वीडियो और वार्डरोब की सभी चीज़ें अनलॉक करता है। कोई सदस्यता नहीं है। रिफ़ंड Apple या Google अपनी नीतियों के तहत संभालते हैं।"], ["चूरा", "चूरे का कोई मौद्रिक मूल्य नहीं है, इसे बदला या स्थानांतरित नहीं किया जा सकता, और ऐप की अर्थव्यवस्था बदलने पर इसे समायोजित किया जा सकता है।"], ["आपकी सामग्री", "आप जो नाम और सामग्री जोड़ते और शेयर करते हैं उसकी ज़िम्मेदारी आपकी है। दूसरों की व्यक्तिगत जानकारी बिना अनुमति शेयर न करें।"], ["उपलब्धता", "हम ऐप को भरोसेमंद रखने की पूरी कोशिश करते हैं, पर यह बिना किसी वारंटी के “जैसा है” प्रदान किया जाता है। क़ानून द्वारा अनुमत सीमा तक, इसके उपयोग से होने वाले अप्रत्यक्ष नुकसान के लिए हम उत्तरदायी नहीं हैं।"], ["संपर्क", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. देखभाल, क्वैक और ईमानदार पासों से बनाया गया।"}, "bn": {"lang_name": "বাংলা", "nav_support": "সাহায্য", "nav_privacy": "গোপনীয়তা", "nav_terms": "শর্তাবলি", "updated": "সর্বশেষ হালনাগাদ: 2026-11-12", "support_title": "সাহায্য ও সহায়তা", "support_intro": "Quack Derby নামের একটি তালিকাকে রেস, টুর্নামেন্ট বা চাকা ঘোরানোয় রূপ দেয় — ন্যায্য, যাচাইযোগ্য এবং অফলাইন। সাহায্য দরকার? আমাদের লিখুন, একজন সত্যিকারের মানুষ উত্তর দেবেন।", "contact_title": "যোগাযোগ", "contact_body": "ইমেইল: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>ফোন: 0334044737<br>ডেভেলপার: Truong Hai Ly", "faq_title": "প্রায়ই জিজ্ঞাসিত প্রশ্ন", "faq": [["রেস ন্যায্য কি না কীভাবে নিশ্চিত হব?", "প্রতিটি রেসের আগে অ্যাপ একটি গোপন র‍্যান্ডম সিডের ছোট ফিঙ্গারপ্রিন্ট (অঙ্গীকার) দেখায়। রেসের পরে সিড প্রকাশ করা হয়। যে কেউ “যাচাই”-এ রেস কোড পেস্ট করে হুবহু একই রেস আবার চালাতে পারে — ফল বদলানো হলে ফিঙ্গারপ্রিন্ট মিলবে না।"], ["ওজন কী করে?", "ডিফল্টভাবে ওজন বন্ধ থাকে, তাই সবার সমান সুযোগ। চালু করলে 2× ওজনের প্রতিযোগীর জেতার সম্ভাবনা 1× প্রতিযোগীর ঠিক দ্বিগুণ। ওজনযুক্ত রেসে সবসময় “ওজনযুক্ত” ব্যাজ দেখানো হয়।"], ["ক্লাসরুম মোড কী?", "ক্লাস তালিকায় যারা বাছাই হয়েছে তারা পুরো তালিকা একবার বাছাই না হওয়া পর্যন্ত সরে থাকে। তালিকায় দেখা যায় প্রত্যেকে কতবার বাছাই হয়েছে।"], ["আমার তালিকার ছবি কি ফোনের বাইরে যায়?", "না। লেখা শনাক্তকরণ আপনার ডিভাইসেই চলে। ছবি আপলোড বা রাখা হয় না।"], ["কীভাবে আমার কেনাকাটা পুনরুদ্ধার করব?", "আমি ট্যাব খুলে “কেনাকাটা পুনরুদ্ধার” ট্যাপ করুন, অথবা VIP টিকিট স্ক্রিনের বোতামটি ব্যবহার করুন। যে Apple ID বা Google অ্যাকাউন্ট দিয়ে কিনেছিলেন সেটিই ব্যবহার করুন।"], ["রুটিকণা কী?", "রুটিকণা হলো টুপি, চশমা ও ট্র্যাক থিমের জন্য অ্যাপের ভেতরের একটি মজার মুদ্রা। রেস করে, চেক-ইন করে এবং ঐচ্ছিক বিজ্ঞাপন দেখে এগুলো পাওয়া যায়। এগুলো কখনো রেসের ফল বদলায় না এবং টাকা দিয়ে কেনা যায় না।"]], "privacy_title": "গোপনীয়তা নীতি", "privacy": [["সংক্ষিপ্ত বিবরণ", "Quack Derby অফলাইনে কাজ করার জন্য তৈরি। আপনার তালিকা, চাকা, রেসের ইতিহাস ও সেটিংস শুধু আপনার ডিভাইসেই সংরক্ষিত থাকে। আপনার ডেটা গ্রহণ করে এমন কোনো সার্ভার আমরা চালাই না, এবং আপনার কোনো অ্যাকাউন্ট লাগে না।"], ["আপনার দেওয়া ডেটা", "নাম, নোট, অবতারের ছবি ও চাকা আপনার ডিভাইসেই থাকে। ছবি তোলা তালিকার লেখা শনাক্তকরণ ডিভাইসেই হয়; ছবি আপলোড হয় না। আপনি যে রেস কোড শেয়ার আপনার কনটেন্ট", "আপনি যে নাম ও কনটেন্ট যোগ ও শেয়ার করেন তার দায় আপনার। অনুমতি ছাড়া অন্যদের ব্যক্তিগত তথ্য শেয়ার করবেন না।"], ["প্রাপ্যতা", "অ্যাপটিকে নির্ভরযোগ্য রাখতে আমরা কঠোর পরিশ্রম করি, তবে এটি কোনো ওয়ারেন্টি ছাড়াই “যেমন আছে” ভিত্তিতে দেওয়া হয়। আইনের অনুমোদিত সীমা পর্যন্ত, এর ব্যবহারে উদ্ভূত পরোক্ষ ক্ষতির জন্য আমরা দায়ী নই।"], ["যোগাযোগ", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly। যত্ন, প্যাঁক প্যাঁক আর ন্যায্য ছক্কা দিয়ে তৈরি।"}, "th": {"lang_name": "ไทย", "nav_support": "ช่วยเหลือ", "nav_privacy": "ความเป็นส่วนตัว", "nav_terms": "ข้อกำหนด", "updated": "อัปเดตล่าสุด: 2026-11-12", "support_title": "ช่วยเหลือและสนับสนุน", "support_intro": "Quack Derby เปลี่ยนรายชื่อให้กลายเป็นการแข่ง ทัวร์นาเมนต์ หรือการหมุนวงล้อ — ยุติธรรม ตรวจสอบได้ และใช้งานออฟไลน์ ต้องการความช่วยเหลือ? เขียนถึงเรา แล้วคนจริง ๆ จะตอบกลับ", "contact_title": "ติดต่อ", "contact_body": "อีเมล: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>โทรศัพท์: 0334044737<br>ผู้พัฒนา: Truong Hai Ly", "faq_title": "คำถามที่พบบ่อย", "faq": [["จะมั่นใจได้อย่างไรว่าการแข่งยุติธรรม?", "ก่อนการแข่งทุกครั้ง แอปจะแสดงลายนิ้วมือสั้น ๆ (ค่าผูกมัด) ของซีดสุ่มลับ หลังการแข่ง ซีดจะถูกเปิดเผย ใครก็วางรหัสการแข่งใน “ตรวจสอบ” และเล่นซ้ำการแข่งเดิมได้ทุกประการ — หากผลถูกเปลี่ยน ลายนิ้วมือจะไม่ตรงกัน"], ["น้ำหนักทำอะไร?", "ค่าเริ่มต้นปิดน้ำหนักไว้ ทุกคนจึงมีโอกาสเท่ากัน เมื่อเปิด ผู้แข่งที่มีน้ำหนัก 2× จะมีโอกาสชนะเป็นสองเท่าของผู้แข่งที่มี 1× พอดี การแข่งที่ใช้น้ำหนักจะแสดงป้าย “ถ่วงน้ำหนัก” เสมอ"], ["โหมดห้องเรียนคืออะไร?", "ในรายชื่อห้องเรียน คนที่ถูกเลือกแล้วจะพักไว้จนกว่าทั้งรายชื่อจะถูกเลือกครบหนึ่งรอบ รายชื่อจะแสดงว่าแต่ละคนถูกเลือกกี่ครั้ง"], ["รูปรายชื่อของฉันออกจากโทรศัพท์ไหม?", "ไม่ การจดจำข้อความทำงานบนอุปกรณ์ของคุณ รูปภาพจะไม่ถูกอัปโหลดหรือเก็บไว้"], ["จะกู้คืนการซื้ออย่างไร?", "เปิดแท็บฉันแล้วแตะ “กู้คืนการซื้อ” หรือใช้ปุ่มบนหน้าจอตั๋ว VIP ใช้ Apple ID หรือบัญชี Google เดียวกับที่ใช้ซื้อ"], ["เศษขนมปังคืออะไร?", "เศษขนมปังคือสกุลเงินสนุก ๆ ในแอปสำหรับหมวก แว่นตา และธีมสนาม รับได้จากการแข่ง การเช็กอิน และการดูโฆษณาที่เลือกดูได้ เศษขนมปังไม่เคยเปลี่ยนผลการแข่งและซื้อด้วยเงินไม่ได้"]], "privacy_title": "นโยบายความเป็นส่วนตัว", "privacy": [["ภาพรวม", "Quack Derby ถูกสร้างให้ทำงานแบบออฟไลน์ รายชื่อ วงล้อ ประวัติการแข่ง และการตั้งค่าของคุณถูกเก็บไว้บนอุปกรณ์ของคุณเท่านั้น เราไม่มีเซิร์ฟเวอร์ที่รับข้อมูลของคุณ และคุณไม่ต้องมีบัญชี"], ["ข้อมูลที่คุณป้อน", "ชื่อ บันทึก รูปอวตาร และวงล้ออยู่บนอุปกรณ์ของคุณ การจดจำข้อความของรายชื่อที่ถ่ายรูปเกิดขึ้นบนอุปกรณ์ รูปภาพจะไม่ถูกอัปโหลด รหัสการแข่งที่คุณเลือกแชร์มีชื่อในการแข่งนั้น ดังนั้นแชร์เฉพาะกับคนที่คุณไว้ใจ"], ["กล้องและรูปภาพ", "กล้องจะใช้เฉพาะเมื่อคุณแตะ “ถ่ายรูปรายชื่อ” หรือ “สแกนรหัส” การเข้าถึงคลังรูปภาพใช้เฉพาะเมื่อคุณเลือกรูปหรือบันทึกผล คุณเปลี่ยนสิทธิ์เหล่านี้ได้ในการตั้งค่าอุปกรณ์ทุกเมื่อ"], ["การโฆษณา", "เวอร์ชันฟรีแสดงโฆษณาจาก Google AdMob ซึ่งอาจเก็บตัวระบุอุปกรณ์ ข้อมูลโฆษณา ข้อมูลการใช้งาน และข้อมูลการวินิจฉัยเพื่อแสดงและวัดผลโฆษณา บน iPhone เราจะขออนุญาตก่อนการติดตามใด ๆ (App Tracking Transparency) ใน EEA/สหราชอาณาจักร แบบฟอร์มขอความยินยอมจาก User Messaging Platform ของ Google จะปรากฏก่อน คุณเปลี่ยนตัวเลือกได้ทุกเมื่อที่ ฉัน › ตัวเลือกความเป็นส่วนตัว Premium จะนำโฆษณาแบนเนอร์ โฆษณาคั่นระหว่างหน้า และโฆษณาตอนเปิดแอปออก"], ["การซื้อ", "การซื้อดำเนินการโดย Apple หรือ Google เราไม่เคยเห็นรายละเอียดการชำระเงินของคุณ เรารู้เพียงว่ามี Premium หรือไม่เพื่อปลดล็อกให้"], ["เด็ก", "Quack Derby เป็นแอปสำหรับผู้ใช้ทั่วไปและไม่ได้มุ่งเป้าไปที่เด็กอายุต่ำกว่า 13 ปี เราไม่ได้เก็บข้อมูลส่วนบุคคลจากเด็กโดยเจตนา"], ["การลบข้อมูลของคุณ", "ใช้ ฉัน › ข้อมูล › รีเซ็ตทั้งหมด หรือลบแอป เพื่อลบข้อมูลทั้งหมดที่ Quack Derby เก็บไว้"], ["การเปลี่ยนแปลงและการติดต่อ", "หากนโยบายนี้เปลี่ยนแปลง เราจะอัปเดตวันที่ด้านบน มีคำถาม: haily.211194@gmail.com · 0334044737"]], "terms_title": "ข้อกำหนดการใช้งาน", "terms": [["การใช้แอป", "Quack Derby เป็นเครื่องมือสำหรับสุ่มชื่อ จัดทีม และสนุกสนาน ผลลัพธ์เป็นแบบสุ่ม โปรดใช้อย่างมีความรับผิดชอบ และห้ามใช้เพื่อการพนันหรือการตัดสินใจที่ต้องอาศัยวิจารณญาณทางวิชาชีพ"], ["Premium", "Premium เป็นการซื้อครั้งเดียวแบบใช้ไม่หมด จะนำโฆษณาออกและปลดล็อกการแข่งที่ใหญ่ขึ้น ทัวร์นาเมนต์ที่ยาวขึ้น วงล้อที่ลึกขึ้น วิดีโอ 1080p และไอเทมตู้เสื้อผ้าทั้งหมด ไม่มีการสมัครสมาชิก การคืนเงินดำเนินการโดย Apple หรือ Google ตามนโยบายของแต่ละราย"], ["เศษขนมปัง", "เศษขนมปังไม่มีมูลค่าทางการเงิน ไม่สามารถแลกเปลี่ยนหรือโอนได้ และอาจถูกปรับหากระบบเศรษฐกิจในแอปเปลี่ยนแปลง"], ["เนื้อหาของคุณ", "คุณรับผิดชอบต่อชื่อและเนื้อหาที่คุณเพิ่มและแชร์ อย่าแชร์ข้อมูลส่วนบุคคลของผู้อื่นโดยไม่ได้รับอนุญาต"], ["ความพร้อมให้บริการ", "เราพยายามอย่างเต็มที่ให้แอปทำงานได้อย่างเชื่อถือได้ แต่แอปนี้ให้บริการ “ตามสภาพ” โดยไม่มีการรับประกัน ภายในขอบเขตที่กฎหมายอนุญาต เราไม่รับผิดชอบต่อความเสียหายทางอ้อมที่เกิดจากการใช้งาน"], ["ติดต่อ", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly สร้างด้วยความใส่ใจ เสียงก๊าบ และลูกเต๋าที่ยุติธรรม"}, "id": {"lang_name": "Bahasa Indonesia", "nav_support": "Bantuan", "nav_privacy": "Privasi", "nav_terms": "Ketentuan", "updated": "Terakhir diperbarui: 2026-11-12", "support_title": "Bantuan & dukungan", "support_intro": "Quack Derby mengubah daftar nama menjadi balapan, turnamen, atau putaran roda — adil, bisa diverifikasi, dan offline. Butuh bantuan? Kirimi kami pesan dan orang sungguhan akan menjawab.", "contact_title": "Kontak", "contact_body": "Email: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telepon: 0334044737<br>Pengembang: Truong Hai Ly", "faq_title": "Pertanyaan yang sering diajukan", "faq": [["Bagaimana aku bisa yakin balapan itu adil?", "Sebelum setiap balapan, aplikasi menampilkan sidik jari singkat (komitmen) dari seed acak rahasia. Setelah balapan, seed diungkap. Siapa pun bisa menempel kode balapan di “Verifikasi” dan memutar ulang balapan yang persis sama — jika hasilnya diubah, sidik jarinya tidak akan cocok."], ["Apa fungsi bobot?", "Bobot nonaktif secara bawaan, jadi semua orang punya peluang yang sama. Saat diaktifkan, peserta dengan bobot 2× tepat dua kali lebih mungkin menang dibanding peserta dengan 1×. Balapan dengan bobot selalu menampilkan lencana “Berbobot”."], ["Apa itu mode kelas?", "Di daftar kelas, orang yang sudah terpilih menunggu sampai seluruh daftar terpilih sekali. Daftar menampilkan berapa kali setiap orang terpilih."], ["Apakah foto daftarku keluar dari ponsel?", "Tidak. Pengenalan teks berjalan di perangkatmu. Foto tidak diunggah atau disimpan."], ["Bagaimana cara memulihkan pembelianku?", "Buka tab Saya lalu ketuk “Pulihkan pembelian”, atau gunakan tombol di layar tiket VIP. Gunakan Apple ID atau akun Google yang sama dengan saat membeli."], ["Apa itu remah?", "Remah adalah mata uang seru di dalam aplikasi untuk topi, kacamata, dan tema lintasan. Kamu mendapatkannya dengan balapan, check-in, dan menonton iklan opsional. Remah tidak pernah mengubah hasil balapan dan tidak bisa dibeli dengan uang."]], "privacy_title": "Kebijakan privasi", "privacy": [["Ringkasan", "Quack Derby dibuat untuk bekerja offline. Daftar, roda, riwayat balapan, dan pengaturanmu hanya disimpan di perangkatmu. Kami tidak menjalankan server yang menerima datamu, dan kamu tidak perlu akun."], ["Data yang kamu masukkan", "Nama, catatan, foto avatar, dan roda tetap di perangkatmu. Pengenalan teks untuk daftar yang difoto terjadi di perangkat; gambar tidak diunggah. Kode balapan yang kamu bagikan berisi nama-nama dalam balapan itu, jadi bagikan hanya kepada orang yang kamu percaya."], ["Kamera dan foto", "Kamera hanya dipakai saat kamu mengetuk “Foto daftar” atau “Pindai kode”. Akses galeri foto hanya dipakai saat kamu memilih gambar atau menyimpan hasil. Kamu bisa mengubah izin ini di pengaturan perangkat kapan saja."], ["Iklan", "Versi gratis menampilkan iklan dari Google AdMob. AdMob dapat mengumpulkan pengenal perangkat, data iklan, data penggunaan, dan data diagnostik untuk menampilkan dan mengukur iklan. Di iPhone kami meminta izin sebelum pelacakan apa pun (App Tracking Transparency); di EEA/Inggris, formulir persetujuan dari User Messaging Platform Google muncul lebih dulu. Kamu bisa mengubah pilihanmu kapan saja di Saya › Pilihan privasi. Premium menghapus iklan banner, interstisial, dan iklan saat aplikasi dibuka."], ["Pembelian", "Pembelian ditangani oleh Apple atau Google. Kami tidak pernah melihat detail pembayaranmu; kami hanya tahu apakah Premium dimiliki agar bisa membukanya."], ["Anak-anak", "Quack Derby adalah aplikasi untuk umum dan tidak ditujukan untuk anak di bawah 13 tahun. Kami tidak dengan sengaja mengumpulkan informasi pribadi dari anak-anak."], ["Menghapus datamu", "Gunakan Saya › Data › Reset semuanya, atau hapus aplikasi, untuk menghapus semua data yang disimpan oleh Quack Derby."], ["Perubahan dan kontak", "Jika kebijakan ini berubah, kami akan memperbarui tanggal di atas. Pertanyaan: haily.211194@gmail.com · 0334044737."]], "terms_title": "Ketentuan penggunaan", "terms": [["Menggunakan aplikasi", "Quack Derby adalah alat untuk memilih nama, membentuk tim, dan bersenang-senang. Hasilnya acak; gunakan secara bertanggung jawab dan jangan pernah untuk perjudian atau keputusan yang memerlukan penilaian profesional."], ["Premium", "Premium adalah pembelian sekali yang tidak habis pakai. Premium menghapus iklan dan membuka balapan lebih besar, turnamen lebih panjang, roda lebih dalam, video 1080p, dan semua item lemari. Tidak ada langganan. Pengembalian dana ditangani oleh Apple atau Google sesuai kebijakan mereka."], ["Remah", "Remah tidak memiliki nilai uang, tidak dapat ditukar atau dipindahkan, dan dapat disesuaikan jika sistem ekonominya berubah."], ["Kontenmu", "Kamu bertanggung jawab atas nama dan konten yang kamu tambahkan dan bagikan. Jangan membagikan informasi pribadi orang lain tanpa izin."], ["Ketersediaan", "Kami berusaha keras menjaga aplikasi tetap andal, tetapi aplikasi disediakan “sebagaimana adanya” tanpa jaminan. Sejauh diizinkan hukum, kami tidak bertanggung jawab atas kerugian tidak langsung yang timbul dari penggunaannya."], ["Kontak", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Dibuat dengan cinta, kwek, dan dadu yang adil."}, "ms": {"lang_name": "Bahasa Melayu", "nav_support": "Bantuan", "nav_privacy": "Privasi", "nav_terms": "Terma", "updated": "Kemas kini terakhir: 2026-11-12", "support_title": "Bantuan & sokongan", "support_intro": "Quack Derby menukar senarai nama menjadi perlumbaan, kejohanan atau putaran roda — adil, boleh disahkan dan luar talian. Perlukan bantuan? Tulis kepada kami dan orang sebenar akan menjawab.", "contact_title": "Hubungi", "contact_body": "E-mel: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Pembangun: Truong Hai Ly", "faq_title": "Soalan lazim", "faq": [["Bagaimana saya boleh pasti perlumbaan itu adil?", "Sebelum setiap perlumbaan, apl memaparkan cap jari pendek (komitmen) bagi benih rawak rahsia. Selepas perlumbaan, benih didedahkan. Sesiapa sahaja boleh menampal kod perlumbaan dalam “Sahkan” dan memainkan semula perlumbaan yang sama persis — jika keputusan telah diubah, cap jari tidak akan sepadan."], ["Apakah fungsi pemberat?", "Pemberat dimatikan secara lalai, jadi semua orang mempunyai peluang yang sama. Apabila dihidupkan, pelumba dengan pemberat 2× tepat dua kali lebih berkemungkinan menang berbanding pelumba dengan 1×. Perlumbaan berpemberat sentiasa memaparkan lencana “Berpemberat”."], ["Apakah mod kelas?", "Dalam senarai kelas, orang yang telah dipilih menunggu sehingga seluruh senarai dipilih sekali. Senarai menunjukkan berapa kali setiap orang dipilih."], ["Adakah foto senarai saya keluar dari telefon?", "Tidak. Pengecaman teks berjalan pada peranti anda. Foto tidak dimuat naik atau disimpan."], ["Bagaimana cara memulihkan pembelian saya?", "Buka tab Saya dan ketik “Pulihkan pembelian”, atau gunakan butang pada skrin tiket VIP. Gunakan Apple ID atau akaun Google yang sama semasa membeli."], ["Apakah remah?", "Remah ialah mata wang seronok dal
