: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Телефон: 0334044737<br>Разработчик: Truong Hai Ly", "faq_title": "Често задавани въпроси", "faq": [["Как да съм сигурен, че състезанието е честно?", "Преди всяко състезание приложението показва кратък отпечатък (ангажимент) на тайно случайно семе. След състезанието семето се разкрива. Всеки може да постави кода на състезанието в „Провери“ и да преиграе абсолютно същото състезание — ако резултатът беше променен, отпечатъкът нямаше да съвпадне."], ["Какво правят теглата?", "Теглата са изключени по подразбиране, така че всички имат еднакъв шанс. Когато ги включиш, участник с тегло 2× има точно двойно по-голям шанс да спечели от участник с 1×. Състезанията с тегла винаги показват значка „С тегла“."], ["Какво е режимът за клас?", "В списък на клас избраните хора се отдръпват, докато целият списък не бъде избран веднъж. Списъкът показва колко пъти е избран всеки човек."], ["Напускат ли снимките на списъците ми телефона?", "Не. Разпознаването на текст става на устройството ти. Снимката не се качва и не се пази."], ["Как да възстановя покупката си?", "Отвори раздела „Аз“ и докосни „Възстанови покупките“ или използвай бутона на екрана с VIP билета. Използвай същия Apple ID или акаунт в Google, с който си купил."], ["Какво са трохите?", "Трохите са забавна валута в приложението за шапки, очила и теми за писти. Печелиш ги със състезания, чекиране и гледане на незадължителни реклами. Те никога не променят резултатите и не могат да се купят с пари."]], "privacy_title": "Политика за поверителност", "privacy": [["Общ преглед", "Quack Derby е създадено да работи офлайн. Списъците, колелата, историята на състезанията и настройките ти се съхраняват само на устройството ти. Нямаме сървъри, които получават данните ти, и не ти трябва акаунт."], ["Данни, които въвеждаш", "Имената, бележките, снимките за аватар и колелата остават на устройството ти. Разпознаването на текст в снимани списъци става на устройството; изображенията не се качват. Кодовете на състезания, които решиш да споделиш, съдържат имената в това състезание, затова ги споделяй само с хора, на които имаш доверие."], ["Камера и снимки", "Камерата се използва само когато докоснеш „Снимка на списък“ или „Сканирай код“. Достъпът до библиотеката със снимки се използва само когато избереш изображение или запазиш резултат. Можеш да промениш тези разрешения в настройките на устройството по всяко време."], ["Реклами", "Безплатната версия показва реклами от Google AdMob. AdMob може да събира идентификатори на устройството, рекламни данни, данни за употреба и диагностика, за да показва и измерва реклами. На iPhone искаме разрешение преди всяко проследяване (App Tracking Transparency); в ЕИП/Обединеното кралство първо се появява формуляр за съгласие от User Messaging Platform на Google. Можеш да промениш избора си по всяко време в Аз › Избор за поверителност. Premium премахва банерите, рекламите на цял екран и тези при отваряне на приложението."], ["Покупки", "Покупките се обработват от Apple или Google. Никога не виждаме данните ти за плащане; разбираме само дали притежаваш Premium, за да го отключим."], ["Деца", "Quack Derby е приложение за обща аудитория и не е насочено към деца под 13 години. Не събираме съзнателно лична информация от деца."], ["Изтриване на данните", "Използвай Аз › Данни › Нулирай всичко или изтрий приложението, за да премахнеш всички данни, съхранявани от Quack Derby."], ["Промени и контакт", "Ако тази политика се промени, ще актуализираме датата по-горе. Въпроси: haily.211194@gmail.com · 0334044737."]], "terms_title": "Условия за ползване", "terms": [["Използване на приложението", "Quack Derby е инструмент за избор на имена, правене на отбори и забавление. Резултатите са случайни; използвай ги отговорно и никога за хазарт или решения, които изискват професионална преценка."], ["Premium", "Premium е еднократна покупка, която не се изразходва. Премахва рекламите и отключва по-големи състезания, по-дълги турнири, по-дълбоки колела, видео 1080p и всички предмети от гардероба. Няма абонамент. Възстановяването на суми се обработва от Apple или Google според техните правила."], ["Трохи", "Трохите нямат парична стойност, не могат да се обменят или прехвърлят и могат да бъдат коригирани, ако икономиката в приложението се промени."], ["Твоето съдържание", "Ти носиш отговорност за имената и съдържанието, които добавяш и споделяш. Не споделяй лична информация на други хора без разрешение."], ["Наличност", "Полагаме големи усилия приложението да е надеждно, но то се предоставя „както е“, без гаранции. Доколкото законът позволява, не носим отговорност за косвени загуби, произтичащи от използването му."], ["Контакт", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Направено с грижа, па-па и честни зарове."}, "hr": {"lang_name": "Hrvatski", "nav_support": "Pomoć", "nav_privacy": "Privatnost", "nav_terms": "Uvjeti", "updated": "Posljednje ažuriranje: 2026-11-12", "support_title": "Pomoć i podrška", "support_intro": "Quack Derby pretvara popis imena u utrku, turnir ili vrtnju kola — pošteno, provjerljivo i bez interneta. Trebaš pomoć? Piši nam i odgovorit će ti stvarna osoba.", "contact_title": "Kontakt", "contact_body": "E-pošta: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Razvojni programer: Truong Hai Ly", "faq_title": "Česta pitanja", "faq": [["Kako mogu biti siguran da je utrka poštena?", "Prije svake utrke aplikacija prikazuje kratki otisak (obvezu) tajnog nasumičnog sjemena. Nakon utrke sjeme se otkriva. Svatko može zalijepiti kod utrke u „Provjeri” i reproducirati potpuno istu utrku — da je rezultat promijenjen, otisak se ne bi podudarao."], ["Čemu služe težine?", "Težine su prema zadanim postavkama isključene, pa svi imaju jednaku šansu. Kad ih uključiš, natjecatelj s težinom 2× ima točno dvostruko veću šansu za pobjedu od natjecatelja s 1×. Utrke s težinama uvijek prikazuju značku „S težinama”."], ["Što je razredni način?", "Na razrednom popisu izabrani se povlače dok cijeli popis ne bude izabran jednom. Popis prikazuje koliko je puta svaka osoba izabrana."], ["Napuštaju li fotografije mojih popisa mobitel?", "Ne. Prepoznavanje teksta odvija se na tvom uređaju. Fotografija se ne prenosi niti čuva."], ["Kako vratiti svoju kupnju?", "Otvori karticu Ja i dodirni „Vrati kupnje” ili upotrijebi gumb na zaslonu VIP ulaznice. Koristi isti Apple ID ili Google račun kojim si kupovao."], ["Što su mrvice?", "Mrvice su zabavna valuta u aplikaciji za šešire, naočale i teme staza. Zarađuješ ih utrkama, prijavama i gledanjem neobaveznih oglasa. Nikad ne mijenjaju rezultate utrka i ne mogu se kupiti novcem."]], "privacy_title": "Pravila privatnosti", "privacy": [["Pregled", "Quack Derby je izrađen za rad bez interneta. Tvoji popisi, kola, povijest utrka i postavke pohranjeni su samo na tvom uređaju. Nemamo poslužitelje koji primaju tvoje podatke i ne trebaš račun."], ["Podaci koje unosiš", "Imena, bilješke, fotografije avatara i kola ostaju na tvom uređaju. Prepoznavanje teksta na fotografiranim popisima odvija se na uređaju; slike se ne prenose. Kodovi utrka koje odlučiš podijeliti sadrže imena iz te utrke, pa ih dijeli samo s ljudima kojima vjeruješ."], ["Kamera i fotografije", "Kamera se koristi samo kad dodirneš „Fotografija popisa” ili „Skeniraj kod”. Pristup galeriji fotografija koristi se samo kad odabereš sliku ili spremiš rezultat. Ta dopuštenja možeš u bilo kojem trenutku promijeniti u postavkama uređaja."], ["Oglašavanje", "Besplatna verzija prikazuje oglase Google AdMob. AdMob može prikupljati identifikatore uređaja, oglasne podatke te podatke o korištenju i dijagnostici radi prikazivanja i mjerenja oglasa. Na iPhoneu tražimo dopuštenje prije bilo kakvog praćenja (App Tracking Transparency); u EGP-u i UK-u najprije se pojavljuje obrazac privole Googleove platforme User Messaging Platform. Svoj izbor možeš promijeniti u bilo kojem trenutku pod Ja › Postavke privatnosti. Premium uklanja banner, međuprostorne oglase i oglase pri otvaranju aplikacije."], ["Kupnje", "Kupnje obrađuju Apple ili Google. Nikad ne vidimo tvoje podatke o plaćanju; saznajemo samo posjeduješ li Premium kako bismo ga otključali."], ["Djeca", "Quack Derby je aplikacija za opću publiku i nije namijenjena djeci mlađoj od 13 godina. Svjesno ne prikupljamo osobne podatke djece."], ["Brisanje tvojih podataka", "Upotrijebi Ja › Podaci › Resetiraj sve ili izbriši aplikaciju kako bi uklonio sve podatke koje Quack Derby pohranjuje."], ["Promjene i kontakt", "Ako se ova pravila promijene, ažurirat ćemo gornji datum. Pitanja: haily.211194@gmail.com · 0334044737."]], "terms_title": "Uvjeti korištenja", "terms": [["Korištenje aplikacije", "Quack Derby je alat za biranje imena, sastavljanje timova i zabavu. Rezultati su nasumični; koristi ih odgovorno i nikad za kockanje ili odluke koje zahtijevaju stručnu procjenu."], ["Premium", "Premium je jednokratna, trajna kupnja. Uklanja oglase i otključava veće utrke, dulje turnire, dublja kola, 1080p video i sve komade garderobe. Nema pretplate. Povrate novca rješavaju Apple ili Google prema svojim pravilima."], ["Mrvice", "Mrvice nemaju novčanu vrijednost, ne mogu se zamijeniti ni prenijeti i mogu se prilagoditi ako se ekonomija promijeni."], ["Tvoj sadržaj", "Odgovoran si za imena i sadržaj koji dodaješ i dijeliš. Ne dijeli osobne podatke drugih bez dopuštenja."], ["Dostupnost", "Trudimo se da aplikacija bude pouzdana, ali pruža se „takva kakva jest” bez jamstava. U mjeri dopuštenoj zakonom nismo odgovorni za neizravne gubitke nastale njezinim korištenjem."], ["Kontakt", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Izrađeno s pažnjom, kvakanjem i poštenim kockicama."}, "sr": {"lang_name": "Српски", "nav_support": "Помоћ", "nav_privacy": "Приватност", "nav_terms": "Услови", "updated": "Последње ажурирање: 2026-11-12", "support_title": "Помоћ и подршка", "support_intro": "Quack Derby претвара листу имена у трку, турнир или окретање точка — фер, проверљиво и без интернета. Треба ти помоћ? Пиши нам и одговориће ти права особа.", "contact_title": "Контакт", "contact_body": "Е-пошта: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Телефон: 0334044737<br>Програмер: Truong Hai Ly", "faq_title": "Честа питања", "faq": [["Како могу да будем сигуран да је трка фер?", "Пре сваке трке апликација приказује кратак отисак (обавезу) тајног насумичног семена. После трке семе се открива. Свако може да налепи код трке у „Провери“ и понови потпуно исту трку — да је резултат промењен, отисак се не би поклопио."], ["Чему служе тежине?", "Тежине су подразумевано искључене, па сви имају једнаку шансу. Када их укључиш, такмичар са тежином 2× има тачно двоструко већу шансу за победу од такмичара са 1×. Трке са тежинама увек приказују значку „Са тежинама“."], ["Шта је режим одељења?", "На листи одељења изабрани се повлаче док цела листа не буде изабрана једном. Листа приказује колико је пута свака особа изабрана."], ["Да ли фотографије мојих листа напуштају телефон?", "Не. Препознавање текста се одвија на твом уређају. Фотографија се не отпрема нити чува."], ["Како да вратим своју куповину?", "Отвори картицу Ја и додирни „Врати куповине“ или употреби дугме на екрану VIP улазнице. Користи исти Apple ID или Google налог којим си куповао."], ["Шта су мрвице?", "Мрвице су забавна валута у апликацији за шешире, наочаре и теме стаза. Зарађујеш их тркама, пријавама и гледањем опционих реклама. Никада не мењају резултате трка и не могу се купити новцем."]], "privacy_title": "Политика приватности", "privacy": [["Преглед", "Quack Derby је направљен да ради без интернета. Твоје листе, точкови, историја трка и подешавања чувају се само на твом уређају. Немамо сервере који примају твоје податке и не треба ти налог."], ["Подаци које уносиш", "Имена, белешке, фотографије аватара и точкови остају на твом уређају. Препознавање текста на фотографисаним листама одвија се на уређају; слике се не отпремају. Кодови трка које одлучиш да поделиш садрже имена из те трке, па их дели само са људима којима верујеш."], ["Камера и фотографије", "Камера се користи само када додирнеш „Фотографија листе“ или „Скенирај код“. Приступ библиотеци фотографија користи се само када изабереш слику или сачуваш резултат. Ове дозволе можеш у било ком тренутку да промениш у подешавањима уређаја."], ["Оглашавање", "Бесплатна верзија приказује рекламе Google AdMob. AdMob може да прикупља идентификаторе уређаја, рекламне податке, као и податке о коришћењу и дијагностици ради приказивања и мерења реклама. На iPhone-у тражимо дозволу пре било каквог праћења (App Tracking Transparency); у ЕЕП-у и УК прво се појављује образац сагласности Google-ове платформе User Messaging Platform. Свој избор можеш да промениш у било ком тренутку у Ја › Подешавања приватности. Premium уклања банер, међупросторне рекламе и рекламе при отварању апликације."], ["Куповине", "Куповине обрађују Apple или Google. Никада не видимо твоје податке о плаћању; сазнајемо само да ли поседујеш Premium да бисмо га откључали."], ["Деца", "Quack Derby је апликација за општу публику и није намењена деци млађој од 13 година. Свесно не прикупљамо личне податке деце."], ["Брисање твојих података", "Употреби Ја › Подаци › Ресетуј све или обриши апликацију да би уклонио све податке које Quack Derby чува."], ["Измене и контакт", "Ако се ова политика промени, ажурираћемо датум изнад. Питања: haily.211194@gmail.com · 0334044737."]], "terms_title": "Услови коришћења", "terms": [["Коришћење апликације", "Quack Derby је алат за бирање имена, прављење тимова и забаву. Резултати су насумични; користи их одговорно и никада за коцкање или одлуке које захтевају стручну процену."], ["Premium", "Premium је једнократна, трајна куповина. Уклања рекламе и откључава веће трке, дуже турнире, дубље точкове, 1080p видео и све комаде гардеробе. Нема претплате. Повраћај новца обрађују Apple или Google према својим правилима."], ["Мрвице", "Мрвице немају новчану вредност, не могу се заменити нити пренети и могу бити прилагођене ако се економија промени."], ["Твој садржај", "Одговоран си за имена и садржај које додајеш и делиш. Не дели личне податке других без дозволе."], ["Доступност", "Трудимо се да апликација буде поуздана, али пружа се „таква каква јесте“, без гаранција. У мери у којој закон дозвољава, нисмо одговорни за посредне губитке настале њеним коришћењем."], ["Контакт", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Направљено с пажњом, квакањем и поштеним коцкицама."}, "lt": {"lang_name": "Lietuvių", "nav_support": "Pagalba", "nav_privacy": "Privatumas", "nav_terms": "Sąlygos", "updated": "Paskutinį kartą atnaujinta: 2026-11-12", "support_title": "Pagalba ir palaikymas", "support_intro": "Quack Derby paverčia vardų sąrašą lenktynėmis, turnyru ar rato sukimu — sąžiningai, patikrinamai ir be interneto. Reikia pagalbos? Parašyk mums ir atsakys tikras žmogus.", "contact_title": "Kontaktai", "contact_body": "El. paštas: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefonas: 0334044737<br>Kūrėjas: Truong Hai Ly", "faq_title": "Dažniausi klausimai", "faq": [["Kaip galiu būti tikras, kad lenktynės sąžiningos?", "Prieš kiekvienas lenktynes programėlė parodo trumpą slaptos atsitiktinės sėklos pirštų atspaudą (įsipareigojimą). Po lenktynių sėkla atskleidžiama. Bet kas gali įklijuoti lenktynių kodą į „Patikrinti“ ir pakartoti lygiai tas pačias lenktynes — jei rezultatas būtų pakeistas, atspaudas nesutaptų."], ["Ką daro svoriai?", "Pagal numatymą svoriai išjungti, todėl visi turi vienodą tikimybę. Juos įjungus, dalyvis su svoriu 2× turi lygiai dvigubai didesnę tikimybę laimėti nei dalyvis su 1×. Lenktynėse su svoriais visada rodomas ženkliukas „Su svoriais“."], ["Kas yra klasės režimas?", "Klasės sąraše išrinktieji pasitraukia, kol visas sąrašas bus išrinktas po kartą. Sąrašas rodo, kiek kartų buvo išrinktas kiekvienas žmogus."], ["Ar mano sąrašų nuotraukos palieka telefoną?", "Ne. Teksto atpažinimas vyksta tavo įrenginyje. Nuotrauka neįkeliama ir nesaugoma."], ["Kaip atkurti pirkinį?", "Atidaryk skirtuką Aš ir bakstelėk „Atkurti pirkinius“ arba naudok mygtuką VIP bilieto ekrane. Naudok tą patį Apple ID ar Google paskyrą, su kuria pirkai."], ["Kas yra trupiniai?", "Trupiniai — linksma programėlės valiuta kepurėms, akiniams ir trasų temoms. Juos uždirbi lenktyniaudamas, registruodamasis ir žiūrėdamas neprivalomas reklamas. Jie niekada nekeičia lenktynių rezultatų ir jų negalima nusipirkti už pinigus."]], "privacy_title": "Privatumo politika", "privacy": [["Apžvalga", "Quack Derby sukurta veikti be interneto. Tavo sąrašai, ratai, lenktynių istorija ir nustatymai saugomi tik tavo įrenginyje. Neturime serverių, kurie gautų tavo duomenis, ir tau nereikia paskyros."], ["Tavo įvedami duomenys", "Vardai, pastabos, avatarų nuotraukos ir ratai lieka tavo įrenginyje. Nufotografuotų sąrašų teksto atpažinimas vyksta įrenginyje; paveikslėliai neįkeliami. Lenktynių koduose, kuriais nusprendi pasidalyti, yra tų lenktynių dalyvių vardai, todėl dalykis jais tik su žmonėmis, kuriais pasitiki."], ["Kamera ir nuotraukos", "Kamera naudojama tik tada, kai bakstelėji „Sąrašo nuotrauka“ arba „Skenuoti kodą“. Prieiga prie nuotraukų bibliotekos naudojama tik pasirenkant paveikslėlį ar išsaugant rezultatą. Šiuos leidimus bet kada gali pakeisti įrenginio nustatymuose."], ["Reklama", "Nemokamoje versijoje rodomos Google AdMob reklamos. AdMob gali rinkti įrenginio identifikatorius, reklamos duomenis, naudojimo ir diagnostikos duomenis, kad rodytų ir vertintų reklamas. „iPhone“ įrenginiuose prieš bet kokį sekimą prašome leidimo (App Tracking Transparency); EEE ir JK pirmiausia parodoma Google User Messaging Platform sutikimo forma. Savo pasirinkimą bet kada gali pakeisti skiltyje Aš › Privatumo pasirinkimai. Premium pašalina reklamjuostes, tarpines reklamas ir reklamas atidarant programėlę."], ["Pirkiniai", "Pirkinius tvarko Apple arba Google. Mes niekada nematome tavo mokėjimo duomenų; sužinome tik tai, ar turi Premium, kad galėtume jį atrakinti."], ["Vaikai", "Quack Derby yra bendrajai auditorijai skirta programėlė ir nėra skirta jaunesniems nei 13 metų vaikams. Sąmoningai nerenkame vaikų asmens duomenų."], ["Tavo duomenų ištrynimas", "Naudok Aš › Duomenys › Atstatyti viską arba ištrink programėlę, kad pašalintum visus Quack Derby saugomus duomenis."], ["Pakeitimai ir kontaktai", "Jei ši politika pasikeis, atnaujinsime viršuje nurodytą datą. Klausimai: haily.211194@gmail.com · 0334044737."]], "terms_title": "Naudojimo sąlygos", "terms": [["Programėlės naudojimas", "Quack Derby yra įrankis vardams rinkti, komandoms sudaryti ir linksmintis. Rezultatai atsitiktiniai; naudok juos atsakingai ir niekada lošimams ar sprendimams, kuriems reikia profesionalaus vertinimo."], ["Premium", "Premium yra vienkartinis, nevartojamas pirkinys. Jis pašalina reklamas ir atrakina didesnes lenktynes, ilgesnius turnyrus, gilesnius ratus, 1080p vaizdo įrašus ir visus drabužinės daiktus. Prenumeratos nėra. Pinigų grąžinimą tvarko Apple arba Google pagal savo taisykles."], ["Trupiniai", "Trupiniai neturi piniginės vertės, jų negalima iškeisti ar perleisti, o pasikeitus ekonomikai jie gali būti koreguojami."], ["Tavo turinys", "Tu atsakai už vardus ir turinį, kurį pridedi ir kuriuo dalijiesi. Nesidalyk kitų asmens duomenimis be leidimo."], ["Prieinamumas", "Stengiamės, kad programėlė veiktų patikimai, tačiau ji teikiama „tokia, kokia yra“, be garantijų. Kiek leidžia įstatymai, neatsakome už netiesioginius nuostolius, kilusius ja naudojantis."], ["Kontaktai", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Sukurta su rūpesčiu, kvaksėjimu ir sąžiningais kauliukais."}, "lv": {"lang_name": "Latviešu", "nav_support": "Palīdzība", "nav_privacy": "Privātums", "nav_terms": "Noteikumi", "updated": "Pēdējoreiz atjaunināts: 2026-11-12", "support_title": "Palīdzība un atbalsts", "support_intro": "Quack Derby pārvērš vārdu sarakstu sacīkstēs, turnīrā vai rata griešanā — godīgi, pārbaudāmi un bezsaistē. Vajag palīdzību? Raksti mums, un atbildēs īsts cilvēks.", "contact_title": "Kontakti", "contact_body": "E-pasts: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Tālrunis: 0334044737<br>Izstrādātājs: Truong Hai Ly", "faq_title": "Biežāk uzdotie jautājumi", "faq": [["Kā varu būt drošs, ka sacīkstes ir godīgas?", "Pirms katrām sacīkstēm lietotne parāda īsu slepenas nejaušas sēklas nospiedumu (apņemšanos). Pēc sacīkstēm sēkla tiek atklāta. Ikviens var ielīmēt sacīkšu kodu sadaļā „Pārbaudīt” un atkārtot tieši tās pašas sacīkstes — ja rezultāts būtu mainīts, nospiedums nesakristu."], ["Ko dara svērums?", "Pēc noklusējuma svērums ir izslēgts, tāpēc visiem ir vienādas iespējas. Kad to ieslēdz, dalībniekam ar svērumu 2× ir tieši divreiz lielāka iespēja uzvarēt nekā dalībniekam ar 1×. Sacīkstēs ar svērumu vienmēr redzama nozīmīte „Ar svērumu”."], ["Kas ir klases režīms?", "Klases sarakstā izvēlētie paliek malā, līdz viss saraksts ir izvēlēts vienreiz. Saraksts rāda, cik reizes katrs cilvēks ir izvēlēts."], ["Vai manu sarakstu fotoattēli pamet tālruni?", "Nē. Teksta atpazīšana notiek tavā ierīcē. Fotoattēls netiek augšupielādēts vai saglabāts."], ["Kā atjaunot pirkumu?", "Atver cilni Es un pieskaries „Atjaunot pirkumus” vai izmanto pogu VIP biļetes ekrānā. Izmanto to pašu Apple ID vai Google kontu, ar kuru pirki."], ["Kas ir drupačas?", "Drupačas ir jautra lietotnes valūta cepurēm, brillēm un trašu motīviem. Tās nopelna, sacenšoties, piesakoties un skatoties neobligātas reklāmas. Tās nekad nemaina sacīkšu rezultātus, un tās nevar nopirkt par naudu."]], "privacy_title": "Privātuma politika", "privacy": [["Pārskats", "Quack Derby ir veidota darbam bezsaistē. Tavi saraksti, rati, sacīkšu vēsture un iestatījumi tiek glabāti tikai tavā ierīcē. Mums nav serveru, kas saņemtu tavus datus, un tev nav vajadzīgs konts."], ["Tevis ievadītie dati", "Vārdi, piezīmes, avatāru fotoattēli un rati paliek tavā ierīcē. Nofotografēto sarakstu teksta atpazīšana notiek ierīcē; attēli netiek augšupielādēti. Sacīkšu kodos, kurus izvēlies kopīgot, ir šo sacīkšu dalībnieku vārdi, tāpēc kopīgo tos tikai ar cilvēkiem, kuriem uzticies."], ["Kamera un fotoattēli", "Kamera tiek izmantota tikai tad, kad pieskaries „Saraksta foto” vai „Skenēt kodu”. Piekļuve fotoattēlu bibliotēkai tiek izmantota tikai tad, kad izvēlies attēlu vai saglabā rezultātu. Šīs atļaujas vari jebkurā laikā mainīt ierīces iestatījumos."], ["Reklāma", "Bezmaksas versijā tiek rādītas Google AdMob reklāmas. AdMob var vākt ierīces identifikatorus, reklāmas datus, lietošanas un diagnostikas datus, lai rādītu un mērītu reklāmas. iPhone ierīcēs pirms jebkādas izsekošanas lūdzam atļauju (App Tracking Transparency); EEZ un Apvienotajā Karalistē vispirms parādās Google User Messaging Platform piekrišanas veidlapa. Savu izvēli vari jebkurā laikā mainīt sadaļā Es › Privātuma izvēles. Premium noņem reklāmjoslas, starpreklāmas un reklāmas, atverot lietotni."], ["Pirkumi", "Pirkumus apstrādā Apple vai Google. Mēs nekad neredzam tavus maksājuma datus; mēs uzzinām tikai to, vai tev pieder Premium, lai to varētu atbloķēt."], ["Bērni", "Quack Derby ir lietotne plašai auditorijai un nav paredzēta bērniem līdz 13 gadu vecumam. Mēs apzināti nevācam bērnu personas datus."], ["Tavu datu dzēšana", "Izmanto Es › Dati › Atiestatīt visu vai izdzēs lietotni, lai noņemtu visus Quack Derby saglabātos datus."], ["Izmaiņas un kontakti", "Ja šī politika mainīsies, mēs atjaunināsim iepriekš norādīto datumu. Jautājumi: haily.211194@gmail.com · 0334044737."]], "terms_title": "Lietošanas noteikumi", "terms": [["Lietotnes lietošana", "Quack Derby ir rīks vārdu izvēlei, komandu veidošanai un izklaidei. Rezultāti ir nejauši; lūdzu, izmanto tos atbildīgi un nekad azartspēlēm vai lēmumiem, kuriem nepieciešams profesionāls vērtējums."], ["Premium", "Premi ging Platformi nõusolekuvorm. Oma valikut saad igal ajal muuta jaotises Mina › Privaatsusvalikud. Premium eemaldab bänner-, vahe- ja rakenduse avamise reklaamid."], ["Ostud", "Oste haldavad Apple või Google. Me ei näe kunagi sinu makseandmeid; saame teada ainult, kas Premium on olemas, et see avada."], ["Lapsed", "Quack Derby on üldisele publikule mõeldud rakendus ega ole suunatud alla 13-aastastele lastele. Me ei kogu teadlikult lastelt isikuandmeid."], ["Andmete kustutamine", "Kõigi Quack Derby salvestatud andmete eemaldamiseks kasuta Mina › Andmed › Lähtesta kõik või kustuta rakendus."], ["Muudatused ja kontakt", "Kui see poliitika muutub, uuendame ülaltoodud kuupäeva. Küsimused: haily.211194@gmail.com · 0334044737."]], "terms_title": "Kasutustingimused", "terms": [["Rakenduse kasutamine", "Quack Derby on tööriist nimede valimiseks, tiimide moodustamiseks ja lõbutsemiseks. Tulemused on juhuslikud; kasuta neid vastutustundlikult ja mitte kunagi hasartmängudeks ega otsusteks, mis nõuavad professionaalset hinnangut."], ["Premium", "Premium on ühekordne, mittekuluv ost. See eemaldab reklaamid ja avab suuremad võidujooksud, pikemad turniirid, sügavamad rattad, 1080p video ja kõik garderoobiesemed. Tellimust pole. Tagasimakseid haldavad Apple või Google vastavalt oma reeglitele."], ["Purud", "Purudel pole rahalist väärtust, neid ei saa vahetada ega üle kanda ning neid võidakse kohandada, kui majandus muutub."], ["Sinu sisu", "Vastutad nimede ja sisu eest, mida lisad ja jagad. Ära jaga teiste isikuandmeid ilma loata."], ["Kättesaadavus", "Teeme kõvasti tööd, et rakendus oleks töökindel, kuid see on pakutud „nagu on“, ilma garantiideta. Seadusega lubatud ulatuses ei vastuta me selle kasutamisest tulenevate kaudsete kahjude eest."], ["Kontakt", "Truong Hai Ly · haily.211194@gmail.com · 0334044737"]], "footer": "© 2026 Truong Hai Ly. Tehtud hoole, prääksude ja ausate täringutega."}, "sl": {"lang_name": "Slovenščina", "nav_support": "Pomoč", "nav_privacy": "Zasebnost", "nav_terms": "Pogoji", "updated": "Zadnja posodobitev: 2026-11-12", "support_title": "Pomoč in podpora", "support_intro": "Quack Derby spremeni seznam imen v dirko, turnir ali vrtenje kolesa — pošteno, preverljivo in brez povezave. Potrebuješ pomoč? Piši nam in odgovoril ti bo pravi človek.", "contact_title": "Stik", "contact_body": "E-pošta: <a href=\"mailto:haily.211194@gmail.com\">haily.211194@gmail.com</a><br>Telefon: 0334044737<br>Razvijalec: Truong Hai Ly", "faq_title": "Pogosta vprašanja", "faq": [["Kako sem lahko prepričan, da je dirka poštena?", "Pred vsako dirko aplikacija pokaže kratek prstni odtis (zavezo) skrivnega naključnega semena. Po dirki se seme razkrije. Kdorkoli lahko prilepi kodo dirke v »Preveri« in ponovi natanko isto dirko — če bi bil rezultat spremenjen, se prstni odtis ne bi ujemal."], ["Kaj naredijo uteži?", "Uteži so privzeto izklopljene, zato imajo vsi enake možnosti. Ko jih vklopiš, ima tekmovalec z utežjo 2× natanko dvakrat večjo možnost za zmago kot tekmovalec z 1×. Dirke z utežmi vedno prikazujejo značko »Uteženo«."], ["Kaj je način razreda?", "Na seznamu razreda izbrani počakajo ob strani, dokler ni celoten seznam izbran enkrat. Seznam prikazuje, kolikokrat je bil kdo izbran."], ["Ali fotografije mojih seznamov zapustijo telefon?", "Ne. Prepoznavanje besedila poteka v tvoji napravi. Fotografija se ne naloži in ne shrani."], ["Kako obnovim nakup?", "Odpri zavihek Jaz in tapni »Obnovi nakupe« ali uporabi gumb na zaslonu vstopnice VIP. Uporabi isti Apple ID ali račun Google, s katerim si kupil."], ["Kaj so drobtine?", "Drobtine so zabavna valuta v aplikaciji za klobuke, očala in teme prog. Zaslužiš jih z dirkanjem, prijavami in ogledom neobveznih oglasov. Nikoli ne spremenijo rezultatov dirk in jih ni mogoče kupiti z denarjem."]], "privacy_title": "Pravilnik o zasebnosti", "privacy": [["Pregled", "Quack Derby je narejen za delovanje brez povezave. Tvoji seznami, kolesa, zgodovina dirk in nastavitve so shranjeni samo v tvoji napravi. Nimamo strežnikov, ki bi prejemali tvoje podatke, in ne potrebuješ računa."], ["Podatki, ki jih vneseš", "Imena, opombe, fotografije avatarjev in kolesa ostanejo v tvoji napravi. Prepoznavanje besedila na fotografiranih seznamih poteka v napravi; slike se ne nalagajo. Kode dirk, ki jih deliš, vsebujejo imena iz te dirke, zato jih deli samo z ljudmi, ki jim zaupaš."], ["Kamera in fotografije", "Kamera se uporablja samo, ko tapneš »Fotografija seznama« ali »Skeniraj kodo«. Dostop do knjižnice fotografij se uporablja samo, ko izbereš sliko ali shraniš rezultat. Ta dovoljenja lahko kadarkoli spremeniš v nastavitvah naprave."], ["Oglaševanje", "Brezplačna različica prikazuje oglase Google AdMob. AdMob lahko za prikaz in merjenje oglasov zbira identifikatorje naprave, oglaševalske podatke ter podatke o uporabi in diagnostiki. Na iPhonu pred kakršnimkoli sledenjem prosimo za dovoljenje (App Tracking Transparency); v EGP/Združenem kraljestvu se najprej prikaže obrazec za soglasje Googlove platforme User Messaging Platform. Svojo izbiro lahko kadarkoli spremeniš v Jaz › Izbire zasebnosti. Premium odstrani pasične, vmesne oglase in oglase ob odprtju aplikacije."], ["Nakupi", "Nakupe urejata Apple ali Google. Tvojih plačilnih podatkov nikoli ne vidimo; izvemo samo, ali imaš Premium, da ga lahko odklenemo."], ["Otroci", "Quack Derby je aplikacija za splošno občinstvo in ni namenjena otrokom, mlajšim od 13 let. Od otrok zavestno ne zbiramo osebnih podatkov."], ["Brisanje podatkov", "Za odstranitev vseh podatkov, ki jih shranjuje Quack Derby, uporabi Jaz › Podatki › Ponastavi vse ali izbriši aplikacijo."], ["Spremembe in stik", "Če se ta pravilnik spremeni, bomo posodobili zgornji datum. Vprašanja: haily.211194@gmail.com · 0334044737."]], "terms_title": "Pogoji uporabe", "terms": [["Uporaba aplikacije", "Quack Derby je orodje za izbiranje imen, sestavljanje ekip in zabavo. Rezultati so naključni; uporabljaj jih odgovorno in nikoli za igre na srečo ali odločitve, ki zahtevajo strokovno
